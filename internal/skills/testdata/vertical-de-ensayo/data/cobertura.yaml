# Las filas de cobertura de la vertical de ensayo de TestVerticalDeEnsayo (contracts/paquetes.md §5 de H32 y
# contracts/datos-y-regiones.md §6 de H33): el test añade las entradas de cada clave al final del bloque de esa clave
# en data/cobertura.yaml de una copia del repositorio. La de cubierto, de los plazos y con la materia de sus dos
# normas, la escribe la región de lo que cubre la base de skills/consulta-juridica/SKILL.md; la de regulados_aparte,
# con su precepto en la primera de sus dos normas, la genera la región cobertura_por_materia de
# skills/plazos-y-territorio/references/ensayo.md.
cubierto:
  - capacidad: plazos
    alcance: los de ensayo del molde de los paquetes.
    materia: ensayo
regulados_aparte:
  - procedimiento: procedimientos de ensayo del molde de los paquetes
    precepto: {norma: BOE-A-1900-1, bloque: a1, apartado: "1"}
