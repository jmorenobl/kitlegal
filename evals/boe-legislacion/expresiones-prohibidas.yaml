# Expresiones que no lleva la respuesta de boe-legislacion en una eval que activa la skill (H7.2, FR-050; H7.3, FR-020),
# en tres familias: la maquinaria interna, lo dicho en otra conversación y el anuncio de la respuesta o del estado de lo
# comprobado. Se comparan por la forma, sin distinguir mayúsculas y con blancos y énfasis de Markdown entre palabras,
# delimitadas como palabras; lo dicho con otras palabras no se detecta.
