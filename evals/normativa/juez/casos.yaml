# Cada caso es la respuesta de una sesión de un informe versionado del job de evals. Nada está escrito a mano: la
# respuesta se lee del informe, y los textos de sus herramientas se reconstruyen repitiendo sus órdenes contra las
# grabaciones. Un caso con `quitado` es un defecto derivado: la misma respuesta sin el texto de ese bloque.
# Procedencias: `bitacora` es la lectura a mano de docs/USO.md del 2026-09-30; `derivado`, por construcción;
# `lectura` es la de la validación, del 2026-10-05: la hizo el agente y la revisa Jorge antes de aceptar el ADR.
# `frase` es la que decide la etiqueta de una lectura: en un defecto, la que el juez citó en la medida final; en un
# aviso correcto, la que citó con una rúbrica anterior, más estricta.
