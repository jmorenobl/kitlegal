pregunta: |
  Cítame esta sentencia. Este es el texto del documento que he descargado del buscador del CENDOJ:

  Roj: STS 3144/2023 - ECLI:ES:TS:2023:3144
  Id Cendoj: 28079110012023101073
  Órgano: Tribunal Supremo. Sala de lo Civil
  Sede: Madrid
  Sección: 1
  Fecha: 04/07/2023
  Nº de Recurso: 4703/2019
  Nº de Resolución: 1088/2023
  Procedimiento: Recurso de casación
  Ponente: PEDRO JOSE VELA TORRES
  Tipo de Resolución: Sentencia

  TRIBUNAL SUPREMO
  Sala de lo Civil
  Sentencia núm. 1088/2023

  En Madrid, a 4 de julio de 2023.

  […]

  F A L L O

  Por todo lo expuesto, en nombre del Rey y por la autoridad que le confiere la Constitución, esta sala ha decidido :

  1.º- Estimar los recursos de casación e infracción procesal interpuestos por D.ª Inocencia contra la sentencia 876/2019, de 15 de mayo, dictada por la Sección 15.ª de la Audiencia Provincial de Barcelona en el recurso de apelación núm. 117/2018, que casamos y anulamos.

  2.º- Estimamos parcialmente el recurso de apelación de la demandante, interpuesto contra la sentencia de 26 de septiembre de 2017 dictada por el Juzgado de Primera Instancia n.º 9 de Barcelona en juicio ordinario 364/2016, revocándola dejándola sin efecto, acordando en su lugar que procede estimar parcialmente la demanda; declarando únicamente la nulidad, por abusiva, de la cláusula del contrato de préstamo hipotecario celebrado entre las partes el 13 de junio de 2008, que otorga a Bankinter S.A, la facultad de dar por vencido anticipadamente el préstamo y, consecuentemente, exigir la inmediata devolución de la totalidad del capital pendiente de amortizar, más los intereses, en caso de que el contravalor del capital pendiente de amortizar excediera del límite pactado; desestimando sus restantes pretensiones, incluida la ejercitada de modo subsidiario, imponiendo a la demandada al pago de las costas devengadas en primera instancia.

  4.º- No procede imponer las costas del recurso extraordinario por infracción procesal y de casación.

  5.º- No hacer expresa imposición de las costas causadas por el recurso de apelación.

  6.º- Ordenar la devolución de los constituidos para los recursos de apelación, recurso extraordinario por infracción procesal y casación.

  Líbrese al mencionado tribunal la certificación correspondiente, con devolución de los autos y del rollo de Sala.

  Notifíquese esta resolución a las partes e insértese en la colección legislativa.

  Así se acuerda y firma.
