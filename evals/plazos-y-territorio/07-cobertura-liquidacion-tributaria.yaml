# Eval de cobertura (c): un recurso contra la liquidación de un tributo local, la plusvalía del Ayuntamiento de
# Leganés, que no es de los dos tipos del paquete tributario (art. 226.a LGT: los tributos del Estado) y que la fila de
# la DA 1ª.2.a de la LPAC deja fuera del procedimiento común. La pregunta da el municipio y la fecha de la
# notificación, todo lo que plazos calcular necesitaría: la respuesta tiene que declarar en la línea ⚠ NO CUBIERTO: que
# el procedimiento se rige por la Ley General Tributaria, con su identificador, sin calcular ningún plazo ni dar la
# línea ⚠ PLAZO:. Protege de contar un tributo local con el art. 223 LGT o con el art. 124 LPAC (H42; ADR 0062,
# punto 6; desde H9, FR-050, FR-051, FR-057, FR-088).
pregunta: "Vivo en Leganés y el 9 de septiembre de 2026 el Ayuntamiento de Leganés me notificó la liquidación de la plusvalía. ¿Hasta cuándo puedo recurrirla?"
activa: true
prohibidos:
  - applet: plazos
    verbo: calcular
no_cubierto:
  norma: BOE-A-2003-23186
  precepto: {norma: BOE-A-2015-10565, bloque: daprimera}
