# Eval de vigencia: el recurso de reposición contra una resolución del ayuntamiento del municipio de referencia,
# notificada el 2 de junio de 2014, antes de la entrada en vigor de la LPAC (2016-10-02). La respuesta tiene que situar
# el municipio con el applet territorio y pedir el plazo a plazos calcular, que termina con 3 (sin_calcular) porque el
# art. 124.1 y el art. 30 de la LPAC no regían ese día; y tiene que declararlo en la línea ⚠ PLAZO SIN CALCULAR: con
# el identificador de la LPAC, sin la línea ⚠ PLAZO: ni ninguna otra fecha de vencimiento (ADR 0042).
pregunta: "El 2 de junio de 2014 me notificaron una resolución del Ayuntamiento de Leganés y vivo en Leganés. ¿Hasta cuándo podía presentar el recurso de reposición?"
activa: true
comandos:
  - applet: territorio
    verbo: resolver
    municipio: Leganés
  - applet: plazos
    verbo: calcular
    tipo: reposicion
    sin_calcular: true
plazo_sin_calcular:
  norma: BOE-A-2015-10565
