# Flujo de la release (FR-110 a FR-115 de H19; specs/009-h19-instalar-sin-clonar/contracts/release.md §6 y
# research.md D30).
#
# Solo lo dispara una etiqueta v* que empuja una persona: etiquetar y publicar son humanos, y ninguna tarea ni ningún
# otro flujo lo ejecuta (FR-110, FR-115). Tres trabajos, cada uno con sus permisos y ninguno heredado del flujo:
#
#   - `publicar` construye con el goreleaser de tools/ —el mismo módulo de herramienta que `make release`, sin
#     --snapshot—, genera los SBOM con syft, firma checksums.txt con cosign sin clave, publica la release, el cask del
#     tap y el manifiesto del bucket, y atesta la procedencia de los seis archivos y de checksums.txt (FR-111, FR-112)
#     y, desde H22, de la extensión de escritorio y del plugin, que el propio goreleaser empaqueta (H22 FR-003).
#   - `humo` comprueba lo publicado como lo recibe quien lo instala: sin el código del repositorio, descarga el archivo
#     linux/amd64 de la release, verifica su huella y su atestación y ejecuta el binario (FR-113). Desde H22 comprueba
#     también la extensión y el plugin: su huella, su atestación, el manifiesto y los binarios de la extensión, y que
#     el servidor MCP lista las herramientas del manifiesto (H22 FR-040 a FR-043).
#   - `catalogo` solo corre si `humo` sale en verde: compone el catálogo de la etiqueta y lo escribe en
#     jmorenobl/kitlegal-plugins. No puede escribir en este repositorio (H22 FR-031, FR-032;
#     specs/016-h22-instalar-sin-terminal/contracts/release.md §6).
#
# Las acciones van fijadas por su etiqueta mayor, como en el resto de flujos, y las mantiene Dependabot (research.md
# V36). Las mayores de syft, cosign y la atestación no se pueden comprobar sin red (research.md S2).
name: release

on:
  push:
    tags: ['v*']

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Escribir la release, y el id-token y las atestaciones para firmar sin clave y atestar (FR-111). Solo este
    # trabajo los tiene.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Toda la historia y sus etiquetas, de las que salen la versión y las notas de la release. La credencial no se
      # queda en el clon: nada empuja por git, y así ningún paso posterior la encuentra en .git/config.
      - name: Obtener el código con su historia
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # El Go que fijan las directivas de go.mod, como en `ci.yml`. Sin caché: lo que se publica y se firma no se
      # construye sobre nada restaurado de otra ejecución.
      - name: Instalar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # syft y cosign solo existen aquí: ni `make ci` ni el snapshot los usan, y no son módulos de tools/ (FR-096).
      - name: Instalar syft
        uses: anchore/sbom-action/download-syft@v0

      # cosign-installer no publica etiqueta mayor (no existe `@v4`): se fija la versión completa y la sube Dependabot.
      - name: Instalar cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Los dos tokens, solo en el entorno de este paso (FR-097, FR-114): GITHUB_TOKEN para la release y
      # PUBLISHER_TOKEN para el tap y el bucket, que .goreleaser.yaml lee al publicar.
      - name: Publicar la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: go tool -modfile=tools/goreleaser/go.mod goreleaser release --clean

      # La procedencia SLSA de los seis archivos y de checksums.txt, tal como quedan en dist/ (FR-112), y de las dos
      # piezas de H22, la extensión de escritorio y el plugin: nueve sujetos (H22 FR-003).
      - name: Atestar la procedencia
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/kitlegal_darwin_amd64.tar.gz
            dist/kitlegal_darwin_arm64.tar.gz
            dist/kitlegal_linux_amd64.tar.gz
            dist/kitlegal_linux_arm64.tar.gz
            dist/kitlegal_windows_amd64.zip
            dist/kitlegal_windows_arm64.zip
            dist/checksums.txt
            dist/kitlegal.mcpb
            dist/kitlegal-plugin.zip

  # La release publicada, comprobada desde fuera (FR-113). Ningún paso obtiene el código ni usa una acción: todo
  # ocurre en el directorio temporal del runner, con lo publicado y nada más. Una comprobación por paso, para que el
  # registro nombre la que falla, y cada paso fija sus propias opciones de shell.
  humo:
    needs: [publicar]
    runs-on: ubuntu-latest
    # Leer la release y su atestación.
    permissions:
      contents: read
      attestations: read
    # gh lee el token de GH_TOKEN: el de esta ejecución, con los permisos de arriba.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar el archivo linux/amd64 publicado y checksums.txt
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo jmorenobl/kitlegal --pattern kitlegal_linux_amd64.tar.gz --pattern checksums.txt

      - name: Comprobar la huella del archivo
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # La línea cuyo segundo campo es exactamente el archivo, nunca por posición ni por subcadena. Sin ella,
          # sha256sum no tiene ninguna línea que comprobar y falla.
          awk '$2 == "kitlegal_linux_amd64.tar.gz"' checksums.txt > huella.txt
          sha256sum --check --strict huella.txt

      - name: Verificar la atestación del archivo
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh attestation verify kitlegal_linux_amd64.tar.gz --repo jmorenobl/kitlegal

      - name: Comprobar que version imprime la etiqueta
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tar -xzf kitlegal_linux_amd64.tar.gz kitlegal
          salida=$(./kitlegal version)
          primera=$(head -n 1 <<< "$salida")
          if [ "$primera" != "kitlegal $GITHUB_REF_NAME" ]; then
            echo "version imprime «${primera}» en lugar de «kitlegal ${GITHUB_REF_NAME}»" >&2
            exit 1
          fi

      - name: Comprobar que boe sin red y con la caché vacía sale con 4
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cache=$(mktemp -d)
          codigo=0
          KITLEGAL_CACHE_DIR="$cache" ./kitlegal boe articulo BOE-A-2015-10565 a21 --offline || codigo=$?
          if [ "$codigo" -ne 4 ]; then
            echo "boe articulo --offline con la caché vacía sale con $codigo en lugar de 4" >&2
            exit 1
          fi

      - name: Comprobar que skills install deja boe-legislacion en un directorio vacío
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          proyecto=$(mktemp -d)
          cd "$proyecto"
          "$RUNNER_TEMP/kitlegal" skills install
          if [ ! -f .agents/skills/boe-legislacion/SKILL.md ]; then
            echo "skills install no deja .agents/skills/boe-legislacion/SKILL.md" >&2
            exit 1
          fi

      # Desde aquí, las seis comprobaciones de H22 sobre la extensión de escritorio y el plugin (H22 FR-040 a FR-042),
      # con las reglas de las de arriba: ninguna acción, sin el código del repositorio y sin ningún secreto (H22
      # FR-043). Sus guiones son los que se midieron contra un snapshot (H22 research.md V20), y
      # TestConfiguracionDeLaRelease los fija enteros: se cambian a la vez que el test.
      #
      # Los tres archivos se descargan porque llevan los binarios con los que se comparan los de la extensión.
      - name: Descargar la extensión, el plugin y los archivos de sus binarios
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo jmorenobl/kitlegal --pattern kitlegal.mcpb --pattern kitlegal-plugin.zip --pattern kitlegal_darwin_amd64.tar.gz --pattern kitlegal_darwin_arm64.tar.gz --pattern kitlegal_windows_amd64.zip

      # Cinco líneas, una por fichero, del checksums.txt que descargó el primer paso: con una de menos, sha256sum daría
      # por buenas las que hay.
      - name: Comprobar las huellas de la extensión, del plugin y de los tres archivos
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          awk '$2 == "kitlegal.mcpb" || $2 == "kitlegal-plugin.zip" || $2 == "kitlegal_darwin_amd64.tar.gz" || $2 == "kitlegal_darwin_arm64.tar.gz" || $2 == "kitlegal_windows_amd64.zip"' checksums.txt > huellas.txt
          if [ "$(wc -l < huellas.txt)" -ne 5 ]; then
            echo "checksums.txt no lleva la huella de la extensión, del plugin y de los tres archivos" >&2
            exit 1
          fi
          sha256sum --check --strict huellas.txt

      - name: Verificar la atestación de la extensión y del plugin
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh attestation verify kitlegal.mcpb --repo jmorenobl/kitlegal
          gh attestation verify kitlegal-plugin.zip --repo jmorenobl/kitlegal

      # La versión es la etiqueta sin su v; los demás campos son fijos, y user_config no existe. La extensión no se
      # ejecuta: no lleva binario de Linux.
      - name: Comprobar el manifiesto de la extensión
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          unzip -q kitlegal.mcpb -d extension
          if ! jq -e --arg version "${GITHUB_REF_NAME#v}" '.manifest_version == "0.3" and .name == "kitlegal" and .version == $version and .homepage == "https://kitlegal.es" and .license == "EUPL-1.2" and .icon == "icon.png" and .server.type == "binary" and .server.entry_point == "server/kitlegal" and .server.mcp_config == {"command": "${__dirname}/server/kitlegal", "args": ["mcp", "serve"], "platform_overrides": {"win32": {"command": "${__dirname}/server/kitlegal.exe"}}} and .compatibility == {"platforms": ["darwin", "win32"]} and (has("user_config") | not)' extension/manifest.json > /dev/null; then
            echo "el manifiesto de kitlegal.mcpb no lleva la versión ${GITHUB_REF_NAME#v} o sus campos fijos" >&2
            exit 1
          fi

      # La cabecera del universal son enteros de 32 bits en big-endian: la magia (0xcafebabe, 3405691582), el número de
      # arquitecturas y, desde el byte 8, veinte bytes por arquitectura: CPU, subtipo, desplazamiento, tamaño y
      # alineación. 16777223 y 16777228 son los tipos de CPU de amd64 y de arm64: cada arquitectura se reconoce por el
      # suyo, no por su posición. awk 'NF == 4', porque algún od añade una línea en blanco; y head | tail y no
      # tail | head, que bajo pipefail hace fallar el paso, porque head cierra la tubería.
      - name: Comprobar que los binarios de la extensión son los de los archivos
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          campo() { od -An -tu1 -j "$1" -N 4 extension/server/kitlegal | awk 'NF == 4 { print (($1 * 256 + $2) * 256 + $3) * 256 + $4 }'; }
          if [ "$(campo 0)" -ne 3405691582 ] || [ "$(campo 4)" -ne 2 ]; then
            echo "server/kitlegal no es un binario universal de dos arquitecturas" >&2
            exit 1
          fi
          vistas=""
          for base in 8 28; do
            case "$(campo "$base")" in
              16777223) arquitectura=amd64 ;;
              16777228) arquitectura=arm64 ;;
              *) echo "server/kitlegal lleva una arquitectura que no es amd64 ni arm64" >&2; exit 1 ;;
            esac
            hasta=$(($(campo $((base + 8))) + $(campo $((base + 12)))))
            del_universal=$(head -c "$hasta" extension/server/kitlegal | tail -c "$(campo $((base + 12)))" | sha256sum | cut -d ' ' -f 1)
            del_archivo=$(tar -xzOf "kitlegal_darwin_${arquitectura}.tar.gz" kitlegal | sha256sum | cut -d ' ' -f 1)
            if [ "$del_universal" != "$del_archivo" ]; then
              echo "la arquitectura ${arquitectura} de server/kitlegal no es el binario de kitlegal_darwin_${arquitectura}.tar.gz" >&2
              exit 1
            fi
            vistas="${vistas}${arquitectura} "
          done
          if [ "$vistas" != "amd64 arm64 " ] && [ "$vistas" != "arm64 amd64 " ]; then
            echo "server/kitlegal no lleva una arquitectura amd64 y una arm64: ${vistas}" >&2
            exit 1
          fi
          de_la_extension=$(sha256sum < extension/server/kitlegal.exe | cut -d ' ' -f 1)
          del_archivo=$(unzip -p kitlegal_windows_amd64.zip kitlegal.exe | sha256sum | cut -d ' ' -f 1)
          if [ "$de_la_extension" != "$del_archivo" ]; then
            echo "server/kitlegal.exe no es el binario de kitlegal_windows_amd64.zip" >&2
            exit 1
          fi

      # ./kitlegal es el binario de Linux de la release, que el cuarto paso ya extrajo. El cliente lee cada respuesta de
      # la tubería con nombre antes de enviar lo siguiente y antes de cerrar la entrada del servidor, sin esperas ni
      # procesos en segundo plano; si el servidor termina sin responder, read falla y con él el paso.
      - name: Arrancar el servidor y comprobar que lista las herramientas del manifiesto
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkfifo respuestas
          cache=$(mktemp -d)
          {
            exec 4< respuestas
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"humo","version":"0"}}}'
            IFS= read -r saludo <&4
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            IFS= read -r lista <&4
            printf '%s\n' "$lista" > lista.json
          } | KITLEGAL_CACHE_DIR="$cache" ./kitlegal mcp serve > respuestas
          jq -r '.result.tools[].name' lista.json | sort > anunciadas.txt
          jq -r '.tools[].name' extension/manifest.json | sort > del-manifiesto.txt
          if [ ! -s anunciadas.txt ] || ! cmp anunciadas.txt del-manifiesto.txt; then
            echo "las herramientas que lista el servidor no son las de tools del manifiesto" >&2
            exit 1
          fi

  # El catálogo del plugin, en jmorenobl/kitlegal-plugins, pasa a ser el de esta etiqueta solo si `humo` sale en verde:
  # si no, sigue en la anterior (H22 FR-031). Lleva el plugin dentro, como carpeta, porque la app de escritorio de
  # Claude no sincroniza un catálogo que apunta a un zip de fuera (ADR 0035, «Prueba con la v0.4.0»): es el contenido
  # del kitlegal-plugin.zip de la release, comprobado contra su huella de checksums.txt. Si el último paso no puede
  # escribir, falla y este trabajo sale en rojo, sin afectar a los otros dos; volver a ejecutarlo deja lo mismo.
  catalogo:
    needs: [humo]
    runs-on: ubuntu-latest
    # Solo leer este repositorio: lo que escribe está en otro, y lo escribe con PUBLISHER_TOKEN.
    permissions:
      contents: read
    steps:
      # El código de la etiqueta, por el paso que compone el catálogo. La credencial no se queda en el clon.
      - name: Obtener el código de la etiqueta
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # La versión es la etiqueta sin su v, y el plugin, el de la release, que tiene que dar la huella que el
      # checksums.txt publicado le da: sin esa línea no hay nada que comprobar, y sha256sum falla. Con el token de la
      # ejecución, que solo lee.
      - name: Componer el catálogo de la etiqueta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo jmorenobl/kitlegal --pattern checksums.txt --pattern kitlegal-plugin.zip --dir "$RUNNER_TEMP"
          huella=$(awk '$2 == "kitlegal-plugin.zip" { print $1 }' "$RUNNER_TEMP/checksums.txt")
          echo "$huella  $RUNNER_TEMP/kitlegal-plugin.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/catalogo"
          go run ./cmd/empaquetar catalogo -version "${GITHUB_REF_NAME#v}" -plugin "$RUNNER_TEMP/kitlegal-plugin.zip" -salida "$RUNNER_TEMP/catalogo"

      # PUBLISHER_TOKEN, solo en el entorno de este paso: git lo pide a gh, y no queda en el clon. Sustituye enteras las
      # dos carpetas del catálogo, .claude-plugin y plugins, en un solo commit, y no toca nada más del repositorio; si
      # ya lleva lo mismo, no hay commit.
      - name: Publicar el catálogo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --depth 1 https://github.com/jmorenobl/kitlegal-plugins.git "$RUNNER_TEMP/kitlegal-plugins"
          cd "$RUNNER_TEMP/kitlegal-plugins"
          git rm -r --quiet --ignore-unmatch .claude-plugin plugins
          cp -R "$RUNNER_TEMP/catalogo/." .
          git add --all .claude-plugin plugins
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=kitlegal -c user.email=info@kitlegal.es commit --quiet --message "kitlegal $GITHUB_REF_NAME"
          git push --quiet origin HEAD
