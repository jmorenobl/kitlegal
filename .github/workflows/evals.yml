# Evals de skills con Claude Code (FR-070). No forma parte de make ci: las evals con modelo cuestan y no son
# deterministas (ADR 0008, «En contra, y asumido»). Contrato: specs/006-h5-skill-boe-legislacion/contracts/job-de-evals.md;
# la matriz de skills, specs/008-h6-territorio-skill-legal/contracts/evals-de-legal-core.md §5 y, con jurisprudencia,
# specs/019-h23-skill-jurisprudencia-ninguna/contracts/evals-jurisprudencia.md §6; la instalación con make install y
# kitlegal en el PATH, specs/009-h19-instalar-sin-clonar/contracts/skills-e-invocacion.md §6.
#
# Desde H24 (ADR 0037; specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md), el flujo usa además un juez con modelo,
# distinto del que decide y con su propio Claude Code, de dos maneras. El trabajo evals, con una skill que tiene juez,
# comprueba sin modelo, antes de abrir ninguna sesión, que la medida versionada del juez corresponde y se cumple —si no,
# no abre ninguna y su informe sale en fallo—, y tras las sesiones el juez vota el significado de las respuestas: lo que
# marca son umbrales del informe (contracts/informe-del-job.md §1, §2 y §5; contracts/juez-y-voto.md). Y el trabajo
# medida repite la medida del juez, solo cuando la lanza una persona (contracts/medida-del-juez.md §7). Una ejecución
# normal no mide al juez, y la lista de expresiones ya no juzga ninguna respuesta (contracts/informe-del-job.md §6).
#
# Desde H25 (specs/020-h25-el-juez-de/contracts/job-de-evals.md), jurisprudencia tiene juez: su trabajo evals va a cuatro
# sesiones a la vez, como iba el de normativa, y la skill entra en la matriz del trabajo medida, de modo que la
# etiqueta evals-medir-juez y la entrada medir_al_juez miden al juez de las dos, sin selector por skill. Desde antes de
# H20, normativa va a cinco, en los dos trabajos.
#
# Desde H30 (specs/026-h30-las-evals-miden/contracts/job-de-evals.md §1 a §3; research.md D1, D8, D13, D17 y D18), una
# ejecución mide lo que su disparador pide y reutiliza lo demás por su huella:
#   - Abrir o reabrir una propuesta de cambio: el trabajo cambios elige las evals que la propuesta ha podido cambiar
#     —las de cuyo conjunto de dependencias toca alguna ruta, y todas si toca lo común—. Si no elige ninguna, no corre
#     nada más. Si elige alguna, cada trabajo evals (<skill>) mide las elegidas y, de las demás, reutiliza el resultado
#     de la medida de main más reciente con su misma huella, y mide las que no lo tienen (modo reutilizacion).
#   - La etiqueta evals, la que pone el cierre del workflow: lo mismo, aunque la propuesta no elija ninguna.
#   - La etiqueta evals-completa y el despacho sin medir_al_juez: la suite completa, todas las evals de cada skill
#     medidas y ninguna reutilizada (modo completa). La etiqueta evals-prueba-de-red y el despacho con prueba_de_red,
#     también, con la sesión de prueba de red de la eval 01 de normativa.
#   - La etiqueta evals-medir-juez y el despacho con medir_al_juez: la medida del juez, sin evals, como hasta ahora, y,
#     desde H31, la del juez de las descripciones.
# La release exige la suite completa: no publica sin una ejecución de este flujo en modo completa sobre el commit
# etiquetado con el trabajo de cada skill en verde, que se lanza con gh workflow run evals.yml --ref <etiqueta>
# (contracts/release.md; FR-025). Ninguna ejecución abre más sesiones a la vez que antes de H30 (FR-020).
name: evals

on:
  # A mano, sobre la rama o la etiqueta que se elija: la suite completa, o la medida del juez con medir_al_juez.
  workflow_dispatch:
    inputs:
      prueba_de_red:
        description: "Añade la sesión de prueba de red de la eval 01 de normativa (SC-012)"
        type: boolean
        default: false
      # Con ella, el despacho no abre las sesiones de evals: ejecuta la medida del juez, el trabajo medida (ADR 0037), y,
      # desde H31, la del juez de las descripciones (ADR 0046).
      medir_al_juez:
        description: "Ejecuta la medida del juez de las skills que lo tienen y la del de las descripciones en lugar de sus evals (ADR 0037, ADR 0046)"
        type: boolean
        default: false
  # Al abrir (o reabrir) una propuesta de cambio que elige alguna eval, y al poner la etiqueta evals, evals-completa o
  # evals-prueba-de-red en cualquiera, también la que no elige ninguna (FR-070, FR-082; ADR 0016; FR-016 a FR-018 de
  # H30). Sin schedule: la ejecución semanal sobre main, con el modelo, la versión de Claude Code y las respuestas del
  # BOE fijados, no medía ningún cambio. Sin synchronize: cada ejecución abre sesiones con modelo, y un hito empuja
  # muchas veces; la etiqueta es el botón de «vuelve a medir», y es lo que usa la ejecución de cierre. La etiqueta
  # evals-medir-juez no mide la skill: lanza la medida del juez, que solo corre con ella o con la entrada medir_al_juez
  # del despacho.
  pull_request:
    types: [opened, reopened, labeled]

jobs:
  # Qué evals ha podido cambiar la propuesta de cambio (contracts/job-de-evals.md §2 de H30; FR-001 a FR-008 y FR-016
  # de H30). Va en un job aparte, y no en un filtro paths: del evento, porque paths: se aplica también a la actividad
  # labeled y dejaría sin arrancar la etiqueta sobre una propuesta que no elige ninguna eval, que es justo el
  # lanzamiento que FR-070 conserva. TestEleccionDeLaPropuesta calcula sobre el checkout, sin lista de rutas a mano, el
  # conjunto de dependencias de cada eval y lo común, en la cabeza y en la base, que saca de la historia del checkout
  # (research.md D5 de H30); lee con gh los ficheros de la propuesta, con su nombre anterior en un renombrado; registra
  # cada eval elegida con su motivo y las rutas que la eligen; y escribe elige=si o elige=no. Un conjunto que no se
  # puede calcular elige todas, y si gh no da los ficheros, también, con la orden y su salida de error en el registro:
  # elige=si (FR-005; research.md D17 de H30). El tope cubre los 12 minutos de go test y la preparación.
  cambios:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      elige: ${{ steps.elegir.outputs.elige }}
    steps:
      - name: Obtener el código de la cabeza de la propuesta de cambio
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Elegir las evals que la propuesta ha podido cambiar
        id: elegir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PROPUESTA: ${{ github.event.pull_request.number }}
          BASE_DE_LA_PROPUESTA: ${{ github.event.pull_request.base.sha }}
        run: >-
          go test -tags evals -count=1 -timeout 12m -v -run '^TestEleccionDeLaPropuesta$' ./internal/evals/
          -args -propuesta "$PROPUESTA" -base "$BASE_DE_LA_PROPUESTA" -salida "$GITHUB_OUTPUT"

  # Una tanda por commit (FR-070 y FR-071 de H7.4): solo corre en una ejecución que quiere medir —el despacho, la
  # etiqueta evals, evals-completa o evals-prueba-de-red, o la apertura que elige alguna eval— y decide si mide: no mide
  # si una ejecución anterior del flujo sobre el mismo commit, sin terminar, ya mide con un modo igual o mayor, completa
  # más que reutilizacion (FR-021 de H30; research.md D13 de H30). Espera, como mucho unos segundos, a que decidan las
  # anteriores; nunca a su tanda. Sus dos últimos pasos son las marcas que leen las posteriores: la de que mide el
  # commit y, si además mide la suite completa, la de la suite completa. Sin concurrency: ni queda en espera ni se
  # cancela, y no deja nunca una comprobación roja por decidir no medir. El despacho con la entrada medir_al_juez no
  # quiere medir la skill sino al juez, y no la corre; la etiqueta evals-medir-juez tampoco, porque no es ninguna de las
  # suyas y cambios no corre con labeled (FR-050 de H24; specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md §3).
  # El modo de la ejecución lo fija su env: completa solo con el despacho y con las etiquetas evals-completa y
  # evals-prueba-de-red, y reutilizacion con la apertura y con la etiqueta evals (contracts/job-de-evals.md §1 de H30);
  # sus salidas dan a los trabajos evals si miden y con qué modo.
  tanda:
    needs: [cambios]
    if: >-
      !cancelled() && needs.cambios.result != 'failure' && (
        (github.event_name == 'workflow_dispatch' && inputs.medir_al_juez != true) ||
        github.event.label.name == 'evals' ||
        github.event.label.name == 'evals-completa' ||
        github.event.label.name == 'evals-prueba-de-red' ||
        needs.cambios.outputs.elige == 'si'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MODO_DE_EVALS: >-
        ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'evals-completa' ||
        github.event.label.name == 'evals-prueba-de-red') && 'completa' || 'reutilizacion' }}
    outputs:
      medir: ${{ steps.decidir.outputs.medir }}
      modo: ${{ steps.decidir.outputs.modo }}
    steps:
      - name: Obtener el código del commit evaluado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      # -timeout 12m: la decisión espera como mucho 10 min, más sus consultas, y con los 10 min de go test por omisión
      # el test acabaría en pánico antes de medir tras la espera; con la preparación, cabe en los 15 del trabajo.
      - name: Mirar si otra tanda mide este commit
        id: decidir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_EVALUADO: ${{ github.event.pull_request.head.sha || github.sha }}
          EJECUCION: ${{ github.run_id }}
        run: >-
          go test -tags evals -count=1 -timeout 12m -v -run '^TestTandaDelCommit$' ./internal/evals/
          -args -commit "$COMMIT_EVALUADO" -ejecucion "$EJECUCION" -modo "$MODO_DE_EVALS" -salida "$GITHUB_OUTPUT"

      - name: Esta ejecución mide el commit
        if: steps.decidir.outputs.medir == 'si'
        run: echo "La tanda de este commit la mide esta ejecución."

      - name: Esta ejecución mide la suite completa
        if: steps.decidir.outputs.medir == 'si' && steps.decidir.outputs.modo == 'completa'
        run: echo "La tanda de este commit la mide esta ejecución con la suite completa."

  # Un trabajo por skill en la misma ejecución del flujo, cada uno con su informe: el de una skill en rojo no cancela el
  # de la otra, que termina y publica el suyo (SC-015; research.md D23). La definición del trabajo la comprueba
  # TestDefinicionDelJob en make ci (specs/013-h7-3-el-umbral-de/contracts/ejecucion-del-job.md §6 y §7).
  # Desde H24, con una skill que tiene juez —la carpeta juez en sus evals: hoy, normativa y jurisprudencia— el
  # trabajo comprueba la medida versionada del juez antes de abrir ninguna sesión y, si corresponde y se cumple, tras las
  # sesiones el juez vota las respuestas del modelo que decide con MODELO_DEL_JUEZ y el Claude Code de CLAUDE_DEL_JUEZ;
  # sus recuentos, los de la medida y la duración de sus votos son umbrales del informe, y una respuesta sin juzgar lo
  # deja en fallo. No vota ningún caso etiquetado. Con una skill sin juez, legal-core, hace lo de antes
  # (specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md §2 y §5; contracts/informe-del-job.md §1 a §5).
  # Desde H23, jurisprudencia es la tercera skill de la matriz, y sus umbrales cita_sin_documento y sin_activar de cada
  # modo se miden sin modelo (specs/019-h23-skill-jurisprudencia-ninguna/contracts/evals-jurisprudencia.md §4 y §6).
  # Desde H25 tiene juez, y su informe lleva además, por modo, los de sus dos clases —afirma_lo_no_leido y
  # afirma_que_existe— y el de la duración de sus votos, y los dos de su medida
  # (specs/020-h25-el-juez-de/contracts/juez-de-jurisprudencia.md §5; contracts/job-de-evals.md §1).
  # Desde H26 (ADR 0038), afirma_lo_no_leido no decide por modo: su recuento de cada modo solo se publica, y decide un
  # umbral más, el de las respuestas de los dos modos juntas, con la tasa de la clase en clases.yaml; igual en
  # normativa. Cada una de las dos skills con juez lleva trece umbrales, nueve que deciden
  # (specs/021-h26-el-umbral-de/contracts/umbrales-del-informe.md §1 y §2).
  # Desde H30 (contracts/job-de-evals.md §2 y §3 de H30; FR-010 a FR-014, FR-019; research.md D8, D17 y D18 de H30),
  # cada trabajo decide antes de abrir ninguna sesión qué evals de su skill mide y cuáles reutiliza, con el modo de la
  # tanda: en completa, todas medidas; en reutilizacion, las que la propuesta elige se miden, y las demás reutilizan el
  # resultado de la medida de main más reciente con su misma huella o, sin él, se miden. El trabajo de una skill que lo
  # reutiliza todo corre igual, con su nombre y su informe, y abre 0 sesiones. La decisión es el único paso que lee la
  # plataforma, con GH_TOKEN y GH_REPO solo en él; su fichero lo exige scripts/evals.sh, que abre solo las sesiones de
  # lo medido; y el último paso, que corre también con el anterior en rojo, es la marca del informe escrito que lee la
  # búsqueda de medidas de main.
  evals:
    # El nombre por el que el cierre lee el informe de cada skill, evals (<skill>): con claves nuevas en la matriz, el
    # nombre por omisión llevaría también sus valores (FR-034 de H7.3; research.md D12 de H7.3).
    name: evals (${{ matrix.skill }})
    needs: [tanda]
    # !cancelled(): sin una función de estado, el if lleva un success() implícito que podría saltar el trabajo por
    # cambios, saltado en la etiqueta y en el despacho (research S9; el mismo motivo que el if de hoy, H5).
    if: ${{ !cancelled() && needs.tanda.outputs.medir == 'si' }}
    # Como mucho una tanda a la vez por commit y skill (SC-010 de H7.4): un segundo disparo sobre el mismo commit —en el
    # cierre, el de la apertura y el de la etiqueta— no llega a este grupo, porque tanda decide que no mide y el trabajo
    # se salta entero, sin abrir sesiones; el cierre espera a la tanda que corre y recoge su informe. Solo si la espera
    # de tanda se agota con una anterior sin decidir mide también, y este grupo la pone detrás de la otra, sin cancelar
    # ninguna. Sin concurrency de nivel de flujo, que no admite matrix y detendría también el trabajo de la otra skill
    # (FR-034 de H7.3; research.md D11 de H7.3; FR-070 de H7.4).
    concurrency:
      group: evals-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.skill }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        skill: [normativa, jurisprudencia, legal-core]
        # Cuántas sesiones abre a la vez el trabajo de cada skill y el objetivo de duración de sus sesiones, en
        # segundos (0, sin objetivo): include los añade a la combinación de su skill sin crear otras (FR-030 y FR-051
        # de H7.3; research.md D12 de H7.3). normativa va a cinco a la vez desde antes de H20: a cuatro, con las
        # veintiuna evals de entonces, su peor caso era de 21 097 s, 351,6 minutos, sin sitio para ninguna eval más; con
        # las veintitrés de hoy, las dos de la pregunta fechada que entraron en H20, sería de 23 449 s, que el tope no
        # cubre, y a cinco es de 18 977 s (entrada de H20, docs/roadmap/done/). Su objetivo de duración
        # sigue en 900 s: no hay medida a cinco que lo cambie. jurisprudencia va desde H25 a cuatro a la vez: de una en
        # una, con sus diez evals y su juez, el tope del trabajo no cubre su peor caso. Sigue sin objetivo, como
        # legal-core: no hay medida con esa concurrencia de la que sacar una cifra. legal-core va a dos a la vez desde
        # antes de H9: con las cinco evals de plazos que entran en H9, de una en una su peor caso es de 28 501 s, que el
        # tope no cubre, y a dos, de 14 629 s (entrada de H9, docs/roadmap/done/). Los tres trabajos corren a la vez
        # contra la misma suscripción, con once sesiones entre los tres, que no se han medido
        # (specs/020-h25-el-juez-de/contracts/job-de-evals.md §1, §3 y §5; FR-070 de H25). Desde H30 siguen siendo
        # como mucho once, también con la reutilización: una combinación por skill, sin otra clave en la matriz, y
        # TestDefinicionDelJob sale en rojo si la matriz admite más (FR-020 y SC-011 de H30).
        include:
          - skill: normativa
            concurrencia: 5
            objetivo_de_duracion: 900
          - skill: jurisprudencia
            concurrencia: 4
            objetivo_de_duracion: 0
          - skill: legal-core
            concurrencia: 2
            objetivo_de_duracion: 0
    runs-on: ubuntu-24.04
    # El tope de un cuelgue, no el control del objetivo de duración, que es un umbral del informe: cubre el peor caso de
    # cada skill, que TestDefinicionDelJob recalcula con las evals del repositorio (FR-035 y FR-052 de H7.3; research.md
    # D13 de H7.3). Desde H30, el de cada skill suma los 900 s del plazo del paso de la decisión, el -timeout de su go
    # test (contracts/job-de-evals.md §2 de H30; research.md D17 de H30): 19 877 s en normativa, 331,3 minutos;
    # 13 477 s en jurisprudencia, 224,6 minutos; y 20 425 s en legal-core, 340,4 minutos, el mayor, que los 352 minutos
    # cubren sin cambiar. Desde H31, el de cada skill suma el del juez de su descripción, que todo trabajo puede juzgar:
    # sus 6 votos de 40 s, 240 s, y, en legal-core, que no tiene juez de las respuestas, los 60 s de instalar el Claude
    # Code del juez (specs/027-h31-las-skills-siguen/research.md D10; SC-015 de H31): 20 117 s en normativa, 335,3
    # minutos; 13 717 s en jurisprudencia, 228,6 minutos; y 20 725 s en legal-core, 345,4 minutos, el mayor, que los 352
    # minutos cubren sin cambiar. Las cifras que siguen son las de sus sesiones y su juez, sin la decisión ni la
    # descripción.
    # 352 minutos: el peor caso de normativa, a cinco a la vez desde antes de H20, es de 18 977 s,
    # 316,3 minutos. Son los 12 997 s de sus sesiones, con sus 23 evals en tres tandas —las del modo orden, las del modo
    # herramienta y las de la eval sin binario ni servidor— (FR-083 de H21; specs/015-h21-kitlegal-mcp-serve/research.md
    # D20), 46 tandas de 272 s, más lo que añade su juez: 60 s de instalar su Claude Code y 148 tandas de votos de 40 s,
    # el tope de un voto y su margen. Las tandas son, por grupo, los 6 votos que como mucho pide cada respuesta, a 5
    # respuestas a la vez: 72, 72 y 4, con las 60, 60 y 3 respuestas que juzga (FR-092 de H24;
    # specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md §4; research.md S1 de H20). A cuatro, como iba hasta
    # H20, era de 21 097 s, 351,6 minutos, con las 21 evals de entonces, sin sitio para ninguna eval más. Cabe en las 6
    # horas de un trabajo de un runner de GitHub. El de legal-core, que no tiene juez, es hoy de 19 525 s, 325,4 minutos, a dos a la vez (70 tandas de 272 s). El de jurisprudencia,
    # con su juez y a cuatro a la vez, es de 12 577 s, 209,6 minutos, y cabe en el mismo tope, que no cambia: 31 tandas
    # de sesiones de 272 s —16 y 15, con las 60 sesiones de sus diez evals en cada modo y la de la prueba de red, que el
    # cálculo cuenta en el modo orden aunque su trabajo no la lleve— y, de su juez, los 60 s de instalar su Claude Code y
    # 90 tandas de votos de 40 s, 45 por modo con las 30 respuestas que juzga en cada uno. De una en una serían
    # 47 857 s, que el tope no cubre (specs/020-h25-el-juez-de/contracts/job-de-evals.md §3; FR-072 de H25). Es un
    # cálculo, y no una medida de lo que tarda.
    timeout-minutes: 352
    # De lectura: actions, para las ejecuciones del flujo y sus registros, y pull-requests, para los ficheros de la
    # propuesta y las propuestas fusionadas, las dos solo en la decisión (contracts/job-de-evals.md §2 y §5 de H30).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      # El modelo que decide el veredicto: el del uso real de la skill, el id al que resuelve el alias sonnet en
      # VERSION_DE_CLAUDE_CODE, fijado aquí por su id; los dos cambian juntos, en este fichero (ADR 0031, que sustituye
      # en esto al ADR 0016).
      MODELO_DE_EVALS: claude-sonnet-5-5
      # El modelo del juez, el que juzga el significado de las respuestas: distinto del que decide y fijado por su id
      # completo, no por un alias (ADR 0037). Es el de la medida versionada del juez: con otro, make ci falla hasta que
      # una persona versiona la medida de ese.
      MODELO_DEL_JUEZ: claude-opus-5-5
      # Los modelos que se ejecutan y se publican como límite inferior, sin decidir el veredicto, separados por comas.
      MODELOS_INFORMATIVOS_DE_EVALS: claude-haiku-4-5-20251001
      # Cada eval se repite con cada modelo y pasa con el umbral, en lugar de exigir una sola tirada perfecta (ADR 0016).
      REPETICIONES_DE_EVALS: 3
      UMBRAL_DE_EVALS: 2
      # La concurrencia y el objetivo de duración de la skill del trabajo, los de su entrada de include (FR-030 y FR-051
      # de H7.3).
      CONCURRENCIA_DE_EVALS: ${{ matrix.concurrencia }}
      OBJETIVO_DE_DURACION_DE_EVALS: ${{ matrix.objetivo_de_duracion }}
      # La versión de Claude Code de las sesiones: la primera en la que el alias sonnet resuelve a MODELO_DE_EVALS, que
      # la anterior del job, 2.1.270, no reconoce (ADR 0031); su comportamiento es el de research.md de H5, V1-V13.
      VERSION_DE_CLAUDE_CODE: 2.1.284
      # La versión de Claude Code de los votos del juez: la de la medida versionada del juez, que va aparte de la de las
      # sesiones. Subir una no obliga a repetir la medida de la otra: la de las sesiones cambia sin volver a medir al
      # juez, y con otra aquí make ci falla hasta que una persona versiona la medida de esa (ADR 0037).
      VERSION_DE_CLAUDE_CODE_DEL_JUEZ: 2.1.289
      SKILL_EVALUADA: ${{ matrix.skill }}
      COMMIT_EVALUADO: ${{ github.event.pull_request.head.sha || github.sha }}
      # La prueba de red es solo de normativa: su texto invoca el applet boe para provocar dos invocaciones fuera
      # de lo grabado, y territorio no tiene red que probar, porque no puede pedir nada por construcción (FR-043). Lo
      # decide el flujo y no Go, que la añadiría a la primera eval de cualquier skill; en el trabajo de otra skill vale
      # false, con la entrada o con la etiqueta.
      PRUEBA_DE_RED: >-
        ${{ matrix.skill == 'normativa' && (github.event.label.name == 'evals-prueba-de-red' || inputs.prueba_de_red == true) }}
      # El modo que decidió la tanda, y la propuesta y su base, con las que la decisión elige en reutilizacion y decide,
      # en los dos modos, si se juzgan las descripciones; en el despacho, que es completa, van vacías
      # (contracts/job-de-evals.md §2 de H30; FR-030 de H31).
      MODO_DE_EVALS: ${{ needs.tanda.outputs.modo }}
      PROPUESTA: ${{ github.event.pull_request.number }}
      BASE_DE_LA_PROPUESTA: ${{ github.event.pull_request.base.sha }}
    steps:
      # Con toda la historia: la decisión saca de ella el árbol de la base de la propuesta (research.md D5 de H30).
      - name: Obtener el código del commit evaluado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      # Qué evals de la skill mide este trabajo y cuáles reutiliza (contracts/job-de-evals.md §2 de H30; FR-012 a FR-014,
      # FR-018): TestDecisionDelTrabajo calcula la huella de cada eval con los modelos y las versiones de Claude Code
      # fijados en el env; en completa las mide todas sin leer nada de la plataforma; en reutilizacion lee con gh los
      # ficheros de la propuesta y busca lo no elegido en las medidas de main, con un plazo de 10 minutos para todo lo que
      # lee. Con propuesta, en los dos modos, lee también el árbol de su base y, si la descripción de alguna skill cambia
      # entre la base y la cabeza, la decisión lleva el bloque descripcion de la skill del trabajo, juzgada o, en
      # reutilizacion, con el juicio de una medida de main con su huella, la del juez de las descripciones con
      # MODELO_DEL_JUEZ y VERSION_DE_CLAUDE_CODE_DEL_JUEZ (specs/027-h31-las-skills-siguen/contracts/
      # juez-de-las-descripciones.md §2; FR-030 de H31); en el despacho, sin propuesta, no lo lleva. Registra una línea
      # por eval —medida con su motivo o reutilizada con su procedencia— y escribe el fichero de
      # la decisión, que lee el paso que ejecuta las evals. Una orden de gh que falla, o el plazo agotado, no lo dejan en
      # rojo: lo que no pudo reutilizar se mide, y la orden y su error van al registro y al informe (research.md D17 de
      # H30). Es el único paso con GH_TOKEN y GH_REPO, y lo que sigue no los ve. Su -timeout, 15 minutos, es el plazo que
      # el peor caso del tope suma.
      - name: Decidir qué mide y qué reutiliza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          go test -tags evals -count=1 -timeout 15m -v -run '^TestDecisionDelTrabajo$' ./internal/evals/
          -args -skill "$SKILL_EVALUADA" -modo "$MODO_DE_EVALS" -commit "$COMMIT_EVALUADO" -propuesta "$PROPUESTA"
          -base "$BASE_DE_LA_PROPUESTA" -modelo-que-decide "$MODELO_DE_EVALS"
          -version-de-claude-code "$VERSION_DE_CLAUDE_CODE" -modelo-del-juez "$MODELO_DEL_JUEZ"
          -version-del-juez "$VERSION_DE_CLAUDE_CODE_DEL_JUEZ" -salida "$RUNNER_TEMP/decision-de-evals.json"

      # Dos Claude Code: el de las sesiones, global, y el de los votos del juez, en un prefijo aparte y en su propia
      # versión; su ruta queda en CLAUDE_DEL_JUEZ para los pasos siguientes. Si npm no deja el ejecutable en
      # node_modules/.bin de ese prefijo, el paso falla al pedir su versión, antes de abrir ninguna sesión
      # (specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md §2; research.md S1).
      - name: Instalar strace y Claude Code
        shell: bash
        run: |
          # Las opciones las fija el propio paso, como las del paso de retirada de Python (research.md V56).
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y strace
          npm install -g "@anthropic-ai/claude-code@${VERSION_DE_CLAUDE_CODE}"
          claude --version
          npm install --prefix "$RUNNER_TEMP/claude-del-juez" "@anthropic-ai/claude-code@${VERSION_DE_CLAUDE_CODE_DEL_JUEZ}"
          "$RUNNER_TEMP/claude-del-juez/node_modules/.bin/claude" --version
          echo "CLAUDE_DEL_JUEZ=$RUNNER_TEMP/claude-del-juez/node_modules/.bin/claude" >> "$GITHUB_ENV"

      - name: Instalar kitlegal y las skills como las deja make install
        shell: bash
        run: |
          # Las opciones las fija el propio paso: si go list falla, el paso se detiene en lugar de dejar en el PATH el
          # directorio de una ruta vacía (research.md V56).
          set -euo pipefail
          make install
          # Las skills invocan kitlegal desde el PATH (FR-127 de H19): el directorio donde go install deja el binario
          # entra en el de los pasos siguientes, sin confiar en que setup-go lo haya puesto (H19, research.md D19).
          binario=$(go list -f '{{.Target}}' ./cmd/kitlegal)
          dirname "$binario" >> "$GITHUB_PATH"

      - name: Retirar Python del runner
        shell: bash
        run: |
          # Las opciones las fija el propio paso, sin depender de con cuáles lo invoque la plataforma: una orden que falla
          # fuera de una condición —la búsqueda o un borrado— lo detiene con su código, y una variable sin valor, también
          # (research.md D17, V56 y V60).
          set -euo pipefail
          # Sin Python accesible para la sesión (FR-073, FR-081; research.md D17). Ninguna orden descarta su salida de error.
          # scripts/evals.sh repite la búsqueda antes de la primera sesión (contrato del job §3.1).
          # No consulta ni purga paquetes: en ubuntu-24.04 los de Python son dependencias de paquetes del sistema y la purga
          # termina con 100 sin retirar nada; la búsqueda encuentra el intérprete y sus bibliotecas, y lo que un paquete
          # deja en disco sin ellos no se ejecuta (research.md D17 y V60).
          # Las marcas se componen al ejecutar: el texto del paso, si el registro lo reproduce, no las contiene.
          marca="retirada de Python"
          echo "--- inicio de la $marca ---"

          # Lo que el job usa después de este paso: la retirada no puede llevárselo (research.md D22, S7). Las skills de
          # ~/.claude/skills son enlaces a ~/.agents/skills, y kitlegal se localiza en el PATH: si no está, readlink -e
          # falla y el paso se detiene (H19, contracts/skills-e-invocacion.md §6).
          usados=("$GITHUB_WORKSPACE" "$HOME/.claude" "$HOME/.agents")
          kitlegal=$(readlink -e "$(command -v kitlegal)")
          usados+=("$kitlegal")
          # El Claude Code del juez no está en el PATH: es la ruta que dejó el paso de instalación, y su enlace resuelto.
          del_juez=$(readlink -e "$CLAUDE_DEL_JUEZ")
          usados+=("$CLAUDE_DEL_JUEZ" "$del_juez")
          for orden in bash sudo find rm timeout strace claude node go make git; do
            if ! ruta=$(command -v "$orden"); then echo "falta $orden" >&2; exit 1; fi
            real=$(readlink -e "$ruta")
            usados+=("$ruta" "$real")
          done
          contiene_algo_usado() {
            local u
            for u in "${usados[@]}"; do
              case "$u" in "$1" | "${1%/}"/*) return 0 ;; esac
            done
            return 1
          }

          # 1. Todo el sistema de ficheros salvo /proc y /sys, como root: ejecutables y enlaces python* y pypy*, y bibliotecas
          # libpython* y libpypy*. Se retira cada uno; si está en <prefijo>/bin y <prefijo>/lib tiene un python* o un pypy*,
          # se retira la instalación entera, salvo que contenga algo de lo que el job usa.
          busqueda=(find / '(' -path /proc -o -path /sys ')' -prune -o '(' '(' -type f -perm /111 '(' -iname 'python*' -o -iname 'pypy*' ')' ')' -o '(' -type l '(' -iname 'python*' -o -iname 'pypy*' ')' ')' -o '(' '(' -type f -o -type l ')' '(' -iname 'libpython*' -o -iname 'libpypy*' ')' ')' ')' -print)
          echo "búsqueda: ${busqueda[*]}"
          encontrado=$(sudo "${busqueda[@]}")
          while IFS= read -r ruta; do
            if [ -z "$ruta" ]; then continue; fi
            if ! sudo test -e "$ruta" && ! sudo test -L "$ruta"; then continue; fi
            objetivo=$ruta
            directorio=$(dirname "$ruta")
            if [ "$(basename "$directorio")" = bin ]; then
              prefijo=$(dirname "$directorio")
              lib=""
              if sudo test -d "$prefijo/lib"; then
                lib=$(sudo find -H "$prefijo/lib" -mindepth 1 -maxdepth 1 '(' -iname 'python*' -o -iname 'pypy*' ')' -print -quit)
              fi
              if [ -n "$lib" ] && ! contiene_algo_usado "$prefijo"; then objetivo=$prefijo; fi
            fi
            echo "retirado: $objetivo"
            sudo rm -rf -- "$objetivo"
          done <<< "$encontrado"

          # 2. No queda nada, y la retirada no se ha llevado nada de lo que el job usa.
          queda=$(sudo "${busqueda[@]}")
          if [ -n "$queda" ]; then
            while IFS= read -r ruta; do echo "queda Python: $ruta" >&2; done <<< "$queda"
            exit 1
          fi
          for u in "${usados[@]}"; do
            if ! sudo test -e "$u"; then echo "la retirada se llevó algo que el job usa: $u" >&2; exit 1; fi
          done
          echo "búsqueda tras retirar: ninguno"
          echo "--- fin de la $marca ---"

      # scripts/evals.sh: con una skill que tiene juez exige MODELO_DEL_JUEZ, VERSION_DE_CLAUDE_CODE_DEL_JUEZ y un
      # CLAUDE_DEL_JUEZ ejecutable antes de la primera sesión, y los votos se abren con scripts/evals-voto.sh, con el
      # directorio de ese claude delante en su PATH (specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md §2;
      # contracts/juez-y-voto.md §4).
      #
      # La salida de error va con la estándar (2>&1). El runner lee cada una por su tubería y las junta en el registro
      # según le llegan: si el guion termina en fallo, la línea con la que make lo dice por la de error quedaba en un
      # punto cualquiera del informe.json, que la estándar aún no había terminado de entregar, y el cierre de un hito no
      # podía recogerlo (H25, medición 1: scripts/workflow/cierre.sh; TestRecogerLasEvalsDelCierre). Por una sola
      # tubería, las líneas llegan en el orden en que se escriben.
      #
      # Desde H30, con el fichero de la decisión en DECISION_DE_EVALS, que scripts/evals.sh exige antes de la primera
      # sesión: abre solo las sesiones de las evals que la decisión mide y compone el informe con las que reutiliza
      # (contracts/job-de-evals.md §3 de H30; research.md D18 de H30).
      - name: Ejecutar las evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: DECISION_DE_EVALS="$RUNNER_TEMP/decision-de-evals.json" make evals SKILL="$SKILL_EVALUADA" 2>&1

      # La marca que lee la búsqueda de medidas de main (FR-010 de H30; research.md D8 de H30): en success solo si el
      # trabajo escribió su informe, en verde o en rojo. Corre también con el paso anterior en rojo, salvo que se cancele
      # la ejecución, y su conclusión dice si el informe del registro es una medida que se puede reutilizar.
      - name: El informe del trabajo está escrito
        if: ${{ !cancelled() }}
        run: test -s "$RUNNER_TEMP/kitlegal-evals-$SKILL_EVALUADA/informe.json"

  # La medida del juez (ADR 0037; specs/017-h24-las-evals-juzgan/contracts/job-de-evals.md §3): vota los casos
  # etiquetados de la skill e imprime medida.json, que versiona una persona. Solo corre con la etiqueta evals-medir-juez
  # o con la entrada medir_al_juez del despacho, y entonces tanda y evals no corren: no abre sesiones de evals, y por eso
  # no depende de tanda, no instala strace ni las skills y no retira Python. No es un paso de evals, cuyo informe lee el
  # cierre por el nombre del trabajo y cuyo tope es otro. Repite el modelo del juez y la versión de Claude Code de sus
  # votos del trabajo evals, y TestDefinicionDelJob exige en make ci que coincidan. Su tope cubre el peor caso de la
  # medida de cada skill de su matriz, que ese test recalcula con los casos del repositorio. El de normativa:
  # 12 985 s, 216,4 minutos, con los 485 s de fuera de los votos, los 60 s de instalar el Claude Code del juez y 311
  # tandas de 40 s, las de los 6 votos que como mucho pide cada uno de sus 259 casos, a 5 a la vez desde antes de H20;
  # a 4 eran 16 105 s, 268,4 minutos, los que fijaron el tope, que no cambia. El de jurisprudencia,
  # que está en la matriz desde H25: 15 505 s, 258,4 minutos, con 374 tandas, las de sus 249 casos; de uno en uno serían
  # 60 305 s, que el tope no cubre. Con la etiqueta o con la entrada corren los dos trabajos de la matriz, sin selector
  # por skill y cada uno con su resultado (specs/020-h25-el-juez-de/contracts/job-de-evals.md §1 a §3; FR-050, FR-071 y
  # FR-072 de H25).
  #
  # Desde H31, la entrada descripciones mide al juez de las descripciones con los 99 casos de
  # evidencias/adr-0046/casos.yaml, a 5 a la vez (specs/027-h31-las-skills-siguen/contracts/juez-de-las-descripciones.md
  # §7; research.md D9; FR-034): 5305 s, 88,4 minutos, con los 485 s de fuera de los votos, los 60 s de instalar el
  # Claude Code del juez y 119 tandas de 40 s, que el tope cubre. La lanza una persona, con la etiqueta, nunca un paso
  # del run (SC-011).
  medida:
    name: medida del juez (${{ matrix.skill }})
    if: github.event.label.name == 'evals-medir-juez' || inputs.medir_al_juez == true
    strategy:
      fail-fast: false
      matrix:
        skill: [normativa, jurisprudencia, descripciones]
        include:
          - skill: normativa
            concurrencia: 5
          - skill: jurisprudencia
            concurrencia: 4
          - skill: descripciones
            concurrencia: 5
    runs-on: ubuntu-24.04
    timeout-minutes: 269
    permissions:
      contents: read
    env:
      MODELO_DEL_JUEZ: claude-opus-5-5
      VERSION_DE_CLAUDE_CODE_DEL_JUEZ: 2.1.289
      CONCURRENCIA_DE_EVALS: ${{ matrix.concurrencia }}
      SKILL_EVALUADA: ${{ matrix.skill }}
      COMMIT_EVALUADO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Obtener el código del commit evaluado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Instalar el Claude Code del juez
        shell: bash
        run: |
          # Las opciones las fija el propio paso (research.md V56).
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/claude-del-juez" "@anthropic-ai/claude-code@${VERSION_DE_CLAUDE_CODE_DEL_JUEZ}"
          "$RUNNER_TEMP/claude-del-juez/node_modules/.bin/claude" --version
          echo "CLAUDE_DEL_JUEZ=$RUNNER_TEMP/claude-del-juez/node_modules/.bin/claude" >> "$GITHUB_ENV"

      # Con la salida de error por la misma tubería que la estándar, como el paso que ejecuta las evals y por lo mismo:
      # la medida.json que imprime, y que versiona una persona, sale entera entre sus dos marcas.
      - name: Ejecutar la medida del juez
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: make evals-medir-juez SKILL="$SKILL_EVALUADA" 2>&1
