# Evals de skills con Claude Code (FR-070). No forma parte de make ci: las evals con modelo cuestan y no son
# deterministas (ADR 0008, «En contra, y asumido»). Contrato: specs/006-h5-skill-boe-legislacion/contracts/job-de-evals.md;
# la matriz de skills, specs/008-h6-territorio-skill-legal/contracts/evals-de-legal-core.md §5; la instalación con make
# install y kitlegal en el PATH, specs/009-h19-instalar-sin-clonar/contracts/skills-e-invocacion.md §6.
name: evals

on:
  # A mano, sobre la rama que se elija.
  workflow_dispatch:
    inputs:
      prueba_de_red:
        description: "Añade la sesión de prueba de red de la eval 01 de boe-legislacion (SC-012)"
        type: boolean
        default: false
  # Al abrir (o reabrir) una propuesta de cambio que toque lo que las evals miden, y al poner la etiqueta evals o
  # evals-prueba-de-red en cualquiera, también la que no toca nada de eso (FR-070, FR-082; ADR 0016). Sin schedule: la
  # ejecución semanal sobre main, con el modelo, la versión de Claude Code y las respuestas del BOE fijados, no medía
  # ningún cambio. Sin synchronize: cada ejecución abre decenas de sesiones con modelo, y un hito empuja muchas veces;
  # la etiqueta es el botón de «vuelve a medir», y es lo que usa la ejecución de cierre.
  pull_request:
    types: [opened, reopened, labeled]

jobs:
  # Qué toca la propuesta de cambio. Va en un job aparte, y no en un filtro paths: del evento, porque paths: se aplica
  # también a la actividad labeled y dejaría sin arrancar la etiqueta sobre una propuesta que no toca estas rutas, que
  # es justo el lanzamiento que FR-070 conserva.
  cambios:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      coincide: ${{ steps.mirar.outputs.coincide }}
    steps:
      - name: Mirar los ficheros de la propuesta de cambio
        id: mirar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          # Las opciones las fija el propio paso (research.md V56).
          set -euo pipefail
          # Lo que las evals miden: las skills y sus datos —data/* cubre también los ficheros congelados de
          # data/territorio/, porque en un patrón de case * casa también las barras—, las propias evals y todo el
          # código del binario que las skills invocan desde el PATH: cmd/, internal/ (applets, dominio, kernel,
          # composición, red, caché, disco y el arnés del job) y skills.go, lo que el binario empotra. Y el fichero del
          # job y los dos guiones que lo ejecutan, el del job y el que abre cada sesión (H7.3, research.md D12). Una
          # ruta que no se puede leer detiene el paso, y no lo deja en «no».
          cambiados=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMERO}/files" --jq '.[].filename')
          echo "ficheros cambiados:"
          printf '%s\n' "$cambiados"
          coincide=no
          while IFS= read -r fichero; do
            case "$fichero" in
              skills/* | evals/* | data/* | cmd/* | internal/* | skills.go | \
              scripts/evals.sh | scripts/evals-sesion.sh | .github/workflows/evals.yml | schemas/eval.yaml.json | Makefile)
                echo "toca lo que las evals miden: $fichero"
                coincide=si
                ;;
            esac
          done <<< "$cambiados"
          echo "coincide=$coincide" >> "$GITHUB_OUTPUT"

  # Una tanda por commit (FR-070 y FR-071 de H7.4): solo corre en una ejecución que quiere medir —el despacho, la
  # etiqueta evals o evals-prueba-de-red, o la apertura que toca lo que las evals miden— y decide si mide: no mide si una
  # ejecución anterior del flujo sobre el mismo commit, sin terminar, ya mide. Espera, como mucho unos segundos, a que
  # decidan las anteriores; nunca a su tanda. Su último paso es la marca que leen las posteriores. Sin concurrency: ni
  # queda en espera ni se cancela, y no deja nunca una comprobación roja por decidir no medir.
  tanda:
    needs: [cambios]
    if: >-
      !cancelled() && needs.cambios.result != 'failure' && (
        github.event_name == 'workflow_dispatch' ||
        github.event.label.name == 'evals' ||
        github.event.label.name == 'evals-prueba-de-red' ||
        needs.cambios.outputs.coincide == 'si'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      medir: ${{ steps.decidir.outputs.medir }}
    steps:
      - name: Obtener el código del commit evaluado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      # -timeout 12m: la decisión espera como mucho 10 min, más sus consultas, y con los 10 min de go test por omisión
      # el test acabaría en pánico antes de medir tras la espera; con la preparación, cabe en los 15 del trabajo.
      - name: Mirar si otra tanda mide este commit
        id: decidir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_EVALUADO: ${{ github.event.pull_request.head.sha || github.sha }}
          EJECUCION: ${{ github.run_id }}
        run: >-
          go test -tags evals -count=1 -timeout 12m -v -run '^TestTandaDelCommit$' ./internal/evals/
          -args -commit "$COMMIT_EVALUADO" -ejecucion "$EJECUCION" -salida "$GITHUB_OUTPUT"

      - name: Esta ejecución mide el commit
        if: steps.decidir.outputs.medir == 'si'
        run: echo "La tanda de este commit la mide esta ejecución."

  # Un trabajo por skill en la misma ejecución del flujo, cada uno con su informe: el de una skill en rojo no cancela el
  # de la otra, que termina y publica el suyo (SC-015; research.md D23). La definición del trabajo la comprueba
  # TestDefinicionDelJob en make ci (specs/013-h7-3-el-umbral-de/contracts/ejecucion-del-job.md §6 y §7).
  evals:
    # El nombre por el que el cierre lee el informe de cada skill, evals (<skill>): con claves nuevas en la matriz, el
    # nombre por omisión llevaría también sus valores (FR-034 de H7.3; research.md D12 de H7.3).
    name: evals (${{ matrix.skill }})
    needs: [tanda]
    # !cancelled(): sin una función de estado, el if lleva un success() implícito que podría saltar el trabajo por
    # cambios, saltado en la etiqueta y en el despacho (research S9; el mismo motivo que el if de hoy, H5).
    if: ${{ !cancelled() && needs.tanda.outputs.medir == 'si' }}
    # Como mucho una tanda a la vez por commit y skill (SC-010 de H7.4): un segundo disparo sobre el mismo commit —en el
    # cierre, el de la apertura y el de la etiqueta— no llega a este grupo, porque tanda decide que no mide y el trabajo
    # se salta entero, sin abrir sesiones; el cierre espera a la tanda que corre y recoge su informe. Solo si la espera
    # de tanda se agota con una anterior sin decidir mide también, y este grupo la pone detrás de la otra, sin cancelar
    # ninguna. Sin concurrency de nivel de flujo, que no admite matrix y detendría también el trabajo de la otra skill
    # (FR-034 de H7.3; research.md D11 de H7.3; FR-070 de H7.4).
    concurrency:
      group: evals-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.skill }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        skill: [boe-legislacion, legal-core]
        # Cuántas sesiones abre a la vez el trabajo de cada skill y el objetivo de duración de sus sesiones, en
        # segundos (0, sin objetivo): include los añade a la combinación de su skill sin crear otras (FR-030 y FR-051
        # de H7.3; research.md D12 de H7.3).
        include:
          - skill: boe-legislacion
            concurrencia: 4
            objetivo_de_duracion: 900
          - skill: legal-core
            concurrencia: 1
            objetivo_de_duracion: 0
    runs-on: ubuntu-24.04
    # El tope de un cuelgue, no el control del objetivo de duración, que es un umbral del informe: cubre el peor caso de
    # cada skill, que TestDefinicionDelJob recalcula con las evals del repositorio (FR-035 y FR-052 de H7.3; research.md
    # D13 de H7.3). 240 minutos: el peor caso de boe-legislacion con sus 21 evals en tres tandas —las sesiones del modo
    # orden, las del modo herramienta y las de la eval sin binario ni servidor— es de 14 357 s, 239,3 minutos (FR-083 de
    # H21; specs/015-h21-kitlegal-mcp-serve/research.md D20). Con 21 evals, el de un solo modo ya es de 7557 s y no cabe
    # en los 122 minutos de antes.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # El modelo que decide el veredicto: el del uso real de la skill, el id al que resuelve el alias sonnet en
      # VERSION_DE_CLAUDE_CODE, fijado aquí por su id; los dos cambian juntos, en este fichero (ADR 0031, que sustituye
      # en esto al ADR 0016).
      MODELO_DE_EVALS: claude-sonnet-5-5
      # Los modelos que se ejecutan y se publican como límite inferior, sin decidir el veredicto, separados por comas.
      MODELOS_INFORMATIVOS_DE_EVALS: claude-haiku-4-5-20251001
      # Cada eval se repite con cada modelo y pasa con el umbral, en lugar de exigir una sola tirada perfecta (ADR 0016).
      REPETICIONES_DE_EVALS: 3
      UMBRAL_DE_EVALS: 2
      # La concurrencia y el objetivo de duración de la skill del trabajo, los de su entrada de include (FR-030 y FR-051
      # de H7.3).
      CONCURRENCIA_DE_EVALS: ${{ matrix.concurrencia }}
      OBJETIVO_DE_DURACION_DE_EVALS: ${{ matrix.objetivo_de_duracion }}
      # La versión de Claude Code de las sesiones: la primera en la que el alias sonnet resuelve a MODELO_DE_EVALS, que
      # la anterior del job, 2.1.270, no reconoce (ADR 0031); su comportamiento es el de research.md de H5, V1-V13.
      VERSION_DE_CLAUDE_CODE: 2.1.284
      SKILL_EVALUADA: ${{ matrix.skill }}
      COMMIT_EVALUADO: ${{ github.event.pull_request.head.sha || github.sha }}
      # La prueba de red es solo de boe-legislacion: su texto invoca el applet boe para provocar dos invocaciones fuera
      # de lo grabado, y territorio no tiene red que probar, porque no puede pedir nada por construcción (FR-043). Lo
      # decide el flujo y no Go, que la añadiría a la primera eval de cualquier skill; en el trabajo de otra skill vale
      # false, con la entrada o con la etiqueta.
      PRUEBA_DE_RED: >-
        ${{ matrix.skill == 'boe-legislacion' && (github.event.label.name == 'evals-prueba-de-red' || inputs.prueba_de_red == true) }}
    steps:
      - name: Obtener el código del commit evaluado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Instalar strace y Claude Code
        shell: bash
        run: |
          # Las opciones las fija el propio paso, como las del paso de retirada de Python (research.md V56).
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y strace
          npm install -g "@anthropic-ai/claude-code@${VERSION_DE_CLAUDE_CODE}"
          claude --version

      - name: Instalar kitlegal y las skills como las deja make install
        shell: bash
        run: |
          # Las opciones las fija el propio paso: si go list falla, el paso se detiene en lugar de dejar en el PATH el
          # directorio de una ruta vacía (research.md V56).
          set -euo pipefail
          make install
          # Las skills invocan kitlegal desde el PATH (FR-127 de H19): el directorio donde go install deja el binario
          # entra en el de los pasos siguientes, sin confiar en que setup-go lo haya puesto (H19, research.md D19).
          binario=$(go list -f '{{.Target}}' ./cmd/kitlegal)
          dirname "$binario" >> "$GITHUB_PATH"

      - name: Retirar Python del runner
        shell: bash
        run: |
          # Las opciones las fija el propio paso, sin depender de con cuáles lo invoque la plataforma: una orden que falla
          # fuera de una condición —la búsqueda o un borrado— lo detiene con su código, y una variable sin valor, también
          # (research.md D17, V56 y V60).
          set -euo pipefail
          # Sin Python accesible para la sesión (FR-073, FR-081; research.md D17). Ninguna orden descarta su salida de error.
          # scripts/evals.sh repite la búsqueda antes de la primera sesión (contrato del job §3.1).
          # No consulta ni purga paquetes: en ubuntu-24.04 los de Python son dependencias de paquetes del sistema y la purga
          # termina con 100 sin retirar nada; la búsqueda encuentra el intérprete y sus bibliotecas, y lo que un paquete
          # deja en disco sin ellos no se ejecuta (research.md D17 y V60).
          # Las marcas se componen al ejecutar: el texto del paso, si el registro lo reproduce, no las contiene.
          marca="retirada de Python"
          echo "--- inicio de la $marca ---"

          # Lo que el job usa después de este paso: la retirada no puede llevárselo (research.md D22, S7). Las skills de
          # ~/.claude/skills son enlaces a ~/.agents/skills, y kitlegal se localiza en el PATH: si no está, readlink -e
          # falla y el paso se detiene (H19, contracts/skills-e-invocacion.md §6).
          usados=("$GITHUB_WORKSPACE" "$HOME/.claude" "$HOME/.agents")
          kitlegal=$(readlink -e "$(command -v kitlegal)")
          usados+=("$kitlegal")
          for orden in bash sudo find rm timeout strace claude node go make git; do
            if ! ruta=$(command -v "$orden"); then echo "falta $orden" >&2; exit 1; fi
            real=$(readlink -e "$ruta")
            usados+=("$ruta" "$real")
          done
          contiene_algo_usado() {
            local u
            for u in "${usados[@]}"; do
              case "$u" in "$1" | "${1%/}"/*) return 0 ;; esac
            done
            return 1
          }

          # 1. Todo el sistema de ficheros salvo /proc y /sys, como root: ejecutables y enlaces python* y pypy*, y bibliotecas
          # libpython* y libpypy*. Se retira cada uno; si está en <prefijo>/bin y <prefijo>/lib tiene un python* o un pypy*,
          # se retira la instalación entera, salvo que contenga algo de lo que el job usa.
          busqueda=(find / '(' -path /proc -o -path /sys ')' -prune -o '(' '(' -type f -perm /111 '(' -iname 'python*' -o -iname 'pypy*' ')' ')' -o '(' -type l '(' -iname 'python*' -o -iname 'pypy*' ')' ')' -o '(' '(' -type f -o -type l ')' '(' -iname 'libpython*' -o -iname 'libpypy*' ')' ')' ')' -print)
          echo "búsqueda: ${busqueda[*]}"
          encontrado=$(sudo "${busqueda[@]}")
          while IFS= read -r ruta; do
            if [ -z "$ruta" ]; then continue; fi
            if ! sudo test -e "$ruta" && ! sudo test -L "$ruta"; then continue; fi
            objetivo=$ruta
            directorio=$(dirname "$ruta")
            if [ "$(basename "$directorio")" = bin ]; then
              prefijo=$(dirname "$directorio")
              lib=""
              if sudo test -d "$prefijo/lib"; then
                lib=$(sudo find -H "$prefijo/lib" -mindepth 1 -maxdepth 1 '(' -iname 'python*' -o -iname 'pypy*' ')' -print -quit)
              fi
              if [ -n "$lib" ] && ! contiene_algo_usado "$prefijo"; then objetivo=$prefijo; fi
            fi
            echo "retirado: $objetivo"
            sudo rm -rf -- "$objetivo"
          done <<< "$encontrado"

          # 2. No queda nada, y la retirada no se ha llevado nada de lo que el job usa.
          queda=$(sudo "${busqueda[@]}")
          if [ -n "$queda" ]; then
            while IFS= read -r ruta; do echo "queda Python: $ruta" >&2; done <<< "$queda"
            exit 1
          fi
          for u in "${usados[@]}"; do
            if ! sudo test -e "$u"; then echo "la retirada se llevó algo que el job usa: $u" >&2; exit 1; fi
          done
          echo "búsqueda tras retirar: ninguno"
          echo "--- fin de la $marca ---"

      - name: Ejecutar las evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: make evals SKILL="$SKILL_EVALUADA"
