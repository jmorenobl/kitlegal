# Flujo nocturno (FR-027 y research.md D1 y D12 de H0; FR-115 y research.md D15
# de H4).
#
# Dos trabajos independientes, cada uno con su pregunta.
#
# `nightly` ejecuta a diario la misma orden agregada que la propuesta de cambio,
# sobre la rama principal. No añade ningún control: `make ci` es idéntica aquí,
# en `ci.yml`, en el gancho de pre-commit y en local. Existe por dos razones,
# ambas de segundo orden respecto de `ci.yml`:
#
#   1. Hace visible sin esperar a la siguiente propuesta de cambio un hallazgo
#      que aparece por el paso del tiempo y no por un cambio en el árbol: el
#      caso previsto es `govulncheck`, que empieza a fallar sobre el
#      `toolchain` fijado en `go.mod` cuando se publica un parche de Go que
#      corrige la biblioteca estándar (research.md D1). El arreglo es subir esa
#      directiva; el detector no se vuelve un adorno.
#   2. Mantiene viva la caché de la rama por defecto, de la que heredan por
#      *fallback* todas las propuestas de cambio, así que la primera ejecución
#      de una rama nueva ya arranca en caliente y SC-006 se mide en caliente
#      (research.md D12).
#
# `fuentes` pregunta si una fuente real ha cambiado sin avisar (US7 y SC-009 de
# H4). Ejecuta `make verify-sources`, que pide a la API del BOE
# `boe articulo BOE-A-2015-10565 a21 --json` y exige que la respuesta se siga
# interpretando, que el sobre valide contra la parte `articulo` de
# `schemas/bloque.json` y que traiga texto: forma y no contenido, porque el texto
# de un artículo cambia legítimamente con cada reforma. Si la verificación
# falla, el trabajo falla y comenta la incidencia abierta «verify-sources: boe
# articulo», o la abre, para que quien mantiene el proyecto se entere sin esperar
# a que falle una consulta real. Es el único control que pide algo a una fuente
# real, y por eso vive aquí y no en `make ci`.
#
# Lo que este flujo NO hace: grabar respuestas —`KITLEGAL_RECORD` no aparece en
# ningún flujo; las grabaciones las hace una persona—, ninguna construcción
# de la release —el snapshot lo construye el trabajo `snapshot` de `ci` y la
# publicación, `release.yml` en cada etiqueta— y ninguna publicación del perfil de cobertura, que FR-029 encomienda
# únicamente al flujo `ci`.
name: nightly

on:
  # Un evento `schedule` se dispara siempre sobre la rama por defecto del
  # repositorio, así que «sobre la rama principal» ya queda garantizado por el
  # propio disparador: no hay filtro `branches` que aplicar ni `ref` que
  # declarar en el paso de obtención del código, y declararlo introduciría una
  # segunda fuente de verdad sobre cuál es esa rama.
  #
  # La hora es intencionadamente un minuto arbitrario y no en punto: las
  # ejecuciones programadas en :00 compiten con el pico de carga de la
  # plataforma y se retrasan más.
  schedule:
    - cron: '27 3 * * *'

jobs:
  nightly:
    runs-on: ubuntu-latest
    # Permisos mínimos: este flujo solo lee el árbol, igual que `ci.yml`.
    permissions:
      contents: read
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # Preparación idéntica a la de `ci.yml`: la versión de Go sale de las
      # directivas de `go.mod` y el parche efectivo lo fija el `GOTOOLCHAIN`
      # que exporta el `Makefile`. Sin `go-version` ni `check-latest`, que
      # serían una segunda fuente de verdad sobre el parche que compila,
      # testea y analiza —y justamente aquí importa, porque es este flujo el
      # que ha de delatar que ese parche se ha quedado atrás (research.md D1)—.
      # Tampoco se exporta `CGO_ENABLED` en el entorno del job: dejaría
      # `make test -race` sin detector de carreras.
      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Misma clave que en `ci.yml`. Es la caché de esta rama la que
          # heredan por *fallback* las propuestas de cambio, así que ha de
          # cubrir lo mismo: dependencias, construcción y los binarios de las
          # herramientas de control, que `go tool` compila desde fuente.
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Ejecutar los controles
        run: make ci

  # La verificación contra la fuente real (contrato esquemas-fixtures-y-controles
  # §7 de H4). Va en un trabajo propio y no como un paso más de `nightly`: una
  # fuente caída no oculta lo que diga `make ci`, ni al revés, y solo este
  # trabajo necesita escribir incidencias.
  fuentes:
    runs-on: ubuntu-latest
    # Leer el árbol y, solo para avisar del fallo, escribir incidencias.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # La misma preparación que en el trabajo `nightly`, por las mismas razones.
      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Verificar las fuentes
        id: verificar
        run: make verify-sources

      # Solo cuando lo que ha fallado es la verificación: una incidencia con el
      # título del caso abierta porque no se pudo obtener el código o instalar Go
      # culparía a la fuente de un fallo de la plataforma, que ya hace fallar el
      # trabajo por sí solo. `failure()` es necesario: sin una función de estado,
      # la condición llevaría un `success()` implícito y el paso no se ejecutaría
      # nunca tras un fallo. La incidencia se busca por su título entre las
      # abiertas, de modo que las noches seguidas de fallo se acumulan como
      # comentarios de una sola.
      - name: Abrir o actualizar la incidencia
        if: failure() && steps.verificar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "verify-sources: boe articulo"
          CUERPO: "La verificación nocturna contra la fuente real ha fallado: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          numero=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$numero" ]; then gh issue comment "$numero" --body "$CUERPO"; else gh issue create --title "$TITULO" --body "$CUERPO"; fi
