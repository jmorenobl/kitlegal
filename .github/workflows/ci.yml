# Flujo de integración continua (FR-025, research.md D12; el trabajo snapshot,
# FR-120 de H19).
#
# Los pasos propios del trabajo `ci` se limitan a preparar el entorno y a
# publicar el perfil de cobertura. Todos los controles —formato, lint, detector
# de carreras, vulnerabilidades, esquemas, secretos, integridad de módulos y
# dependencias saneadas— los aplica `make ci`, exactamente la misma orden que se
# ejecuta en local y en el gancho de pre-commit. Esa identidad es lo que hace
# cierta SC-004: lo que pasa en local pasa aquí, y lo que falla aquí falla en
# local.
#
# Ninguna acción de terceros aplica un control por su cuenta (R5.1): ni
# golangci-lint-action, ni gitleaks-action, ni un `go test` suelto.
#
# El trabajo `snapshot` construye la release sin publicarla y la comprueba con
# dos órdenes del Makefile, las mismas que en local, que quedan fuera de
# `make ci` porque construyen las seis plataformas y leen dist/
# (specs/009-h19-instalar-sin-clonar/contracts/release.md §3 y §5). Desde H22
# valida además, con una tercera, el plugin del snapshot y el catálogo de su
# versión con Claude Code, del que `make ci` no depende
# (specs/016-h22-instalar-sin-terminal/contracts/release.md §2, §4 y §5).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Permisos mínimos: este flujo solo lee el árbol (R5.5).
    permissions:
      contents: read
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      # Toda acción de los flujos tiene que existir en la versión que la fija. Una
      # referencia que la acción no publica solo falla al ejecutar el flujo que la
      # usa, y release.yml solo se ejecuta al etiquetar: v0.1.0 no llegó a
      # publicarse por `sigstore/cosign-installer@v4`, que no existe. Aquí se
      # comprueban todas en cada propuesta de cambio (también las que sube
      # Dependabot). Las acciones locales (`./…`) no se resuelven en la API.
      - name: Comprobar que existen las acciones de los flujos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs=$(grep -rhoE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]#]+' .github/workflows \
            | sed -E 's/.*uses:[[:space:]]*//' | grep -v '^\./' | sort -u)
          fallos=0
          while IFS= read -r ref; do
            repo=$(printf '%s' "${ref%@*}" | cut -d/ -f1-2)
            version=${ref##*@}
            if gh api "repos/${repo}/commits/${version}" --silent 2>/dev/null; then
              echo "existe: ${ref}"
            else
              echo "::error::${ref} no existe: ${repo} no tiene la referencia ${version}"
              fallos=$((fallos + 1))
            fi
          done <<< "$refs"
          [ "$fallos" -eq 0 ]

      # La versión de Go sale de las directivas de go.mod, que la acción lee por
      # sí sola; el parche efectivo lo fija el GOTOOLCHAIN que exporta el
      # Makefile, y una asignación del Makefile gana al GOTOOLCHAIN=local que
      # esta acción deja en el entorno (research.md D1). Por eso no se declara
      # go-version ni check-latest: introducirían una segunda fuente de verdad
      # sobre el parche que compila, testea y analiza (R5.6, R7.4).
      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # La caché de la acción cubre GOMODCACHE y GOCACHE, es decir las
          # dependencias, la construcción y los binarios de las cinco
          # herramientas de control (goreleaser desde H19), que `go tool`
          # compila desde fuente. Sin ella la ejecución en frío domina el tiempo
          # del flujo y SC-006 («PR limpia en < 3 min») es inalcanzable (R5.2,
          # research.md D12).
          cache: true
          # Los modfiles de herramienta entran en la clave: sin ellos, subir la
          # versión de una herramienta reutilizaría la caché anterior. El go.sum
          # del módulo raíz aún no existe —H0 no tiene dependencias de
          # producto— y el patrón simplemente no casa hasta que las haya.
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Ejecutar los controles
        run: make ci

      # fail_ci_if_error: una subida que falla en silencio deja el estado de
      # cobertura sin llegar nunca y convierte el gate en un adorno (R5.7,
      # research.md D15). Requiere el secreto CODECOV_TOKEN dado de alta en el
      # repositorio: es un prerrequisito de plataforma, y su ausencia se
      # resuelve dándolo de alta, no rebajando esta bandera.
      - name: Publicar el perfil de cobertura
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out,./coverage-integration.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # El snapshot de la release en los mismos eventos que `ci` (FR-120 de H19;
  # specs/009-h19-instalar-sin-clonar/research.md D30). Va en un trabajo aparte,
  # sin condición y sin esperar a `ci`: construir las seis plataformas no retrasa
  # el veredicto de `make ci`, y un fallo de uno no oculta el del otro.
  snapshot:
    runs-on: ubuntu-latest
    # Solo lee el árbol: sin `id-token` y sin ningún secreto, porque el snapshot
    # no firma ni publica nada (FR-097, FR-120).
    permissions:
      contents: read
    steps:
      # Toda la historia y sus etiquetas: de ellas saca goreleaser la versión
      # del snapshot (research.md D30, V5).
      - name: Obtener el código con su historia
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # La misma preparación y la misma caché que el trabajo `ci`, por las
      # mismas razones: el parche lo fija el GOTOOLCHAIN que exporta el
      # Makefile, y los modfiles de herramienta —el de goreleaser entre ellos—
      # entran en la clave.
      - name: Instalar Go y restaurar la caché
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      # Los seis archivos, los paquetes .deb y .rpm y checksums.txt (que lista también
      # install.sh) en dist/, sin publicar, sin firmar y sin SBOM (FR-095).
      - name: Construir el snapshot
        run: make release

      # TestSnapshot sobre dist/ —el binario linux/amd64 de este runner imprime
      # la versión y el commit del snapshot— y los guiones del instalador contra
      # ese dist/, sin red (FR-108, SC-016, SC-017).
      - name: Comprobar el snapshot
        run: make snapshot-check

      # La versión es la de jobs.evals.env de evals.yml, la única que el
      # repositorio fija: TestConfiguracionDeLaRelease, en make ci, falla si las
      # dos difieren (H22 FR-065; contracts/release.md §5 y §7 de H22).
      - name: Instalar Claude Code
        env:
          VERSION_DE_CLAUDE_CODE: 2.1.284
        run: npm install -g "@anthropic-ai/claude-code@${VERSION_DE_CLAUDE_CODE}"

      # TestPluginValido sobre dist/: `claude plugin validate` sobre el plugin
      # extraído y sobre el catálogo de la versión del snapshot, sin sesión con
      # modelo y sin credencial, que este trabajo no tiene (H22 FR-065, SC-008).
      - name: Validar el plugin y el catálogo
        run: make plugin-check
