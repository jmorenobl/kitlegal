schema_version: "1.0"
workflow:
  id: "hito"
  name: "Hito del roadmap (SDD con gates automáticos)"
  version: "1.2.0"
  author: "kitlegal"
  description: "Implementa un hito de docs/ROADMAP.md: specify → clarify (preguntas / resolución en contexto limpio / integración) → plan → tasks → analyze → implement tarea a tarea con verificación determinista → converge → revisión. Gates evaluados con el Criterio de decisión autónoma de la constitución."

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["claude"]

# Seguridad: `inputs.hito` se interpola en pasos `shell`, por eso está
# restringido a un enum. Ningún otro valor libre entra en un `run:`.
# Los textos de tasks.md y los logs solo se interpolan en prompts.
inputs:
  hito:
    type: string
    required: true
    prompt: "Hito del roadmap a implementar (H0..H26)"
    enum: ["H0","H1","H2","H3","H4","H5","H6","H7","H8","H9","H10","H11","H12","H13","H14","H15","H16","H17","H18","H19","H20","H21","H22","H23","H24","H25","H26"]
  modo:
    type: string
    default: "desatendido"
    enum: ["desatendido", "supervisado"]
    prompt: "desatendido: los gates los decide Claude con el criterio de la constitución; supervisado: además pausa para revisión humana"
  granularidad:
    type: string
    default: "tarea"
    enum: ["tarea", "hito"]
    prompt: "tarea: implementa y verifica tarea a tarea; hito: una sola pasada de implement"
  veredicto_spec:
    type: string
    default: ""
  veredicto_plan:
    type: string
    default: ""
  veredicto_final:
    type: string
    default: ""
  # ---- modelo por rol (alias de claude --model o nombre completo) ----
  modelo_juez:
    type: string
    default: "fable"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para resolver clarificaciones, gates y revisión final (decisiones con criterio)"
  modelo_redaccion:
    type: string
    default: "opus"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para specify, clarify (preguntas e integración), plan y tasks"
  modelo_implementacion:
    type: string
    default: "opus"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para implement (por tarea, por hito, restante) y reparaciones de CI"
  modelo_analisis:
    type: string
    default: "sonnet"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para analyze y converge (lectura y contraste de artefactos)"

steps:
  # ================================================================ contexto
  - id: extraer_hito
    type: shell
    output_format: json
    timeout: 30
    run: |
      set -eu
      h="{{ inputs.hito }}"
      sec=$(awk -v h="$h" 'BEGIN{p=0} $0 ~ ("^#### " h " · "){p=1; print; next} p && /^(#{2,4} |---)/{exit} p{print}' docs/ROADMAP.md)
      [ -n "$sec" ] || { echo "hito $h no encontrado en docs/ROADMAP.md" >&2; exit 1; }
      titulo=$(printf '%s\n' "$sec" | head -1 | sed -E 's/^#### [A-Z0-9]+ · //')
      palabras=$(printf '%s' "$titulo" | tr '[:upper:]' '[:lower:]' | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -d- -f1-3)
      slug="$(printf '%s' "$h" | tr '[:upper:]' '[:lower:]')-$palabras"
      jq -n --arg hito "$h" --arg titulo "$titulo" --arg slug "$slug" --arg texto "$sec" \
        '{hito:$hito, titulo:$titulo, slug:$slug, texto:$texto}'

  # ================================================================ specify
  - id: specify
    command: speckit.specify
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        Hito {{ inputs.hito }} · {{ steps.extraer_hito.output.data.titulo }}.
        Nombre corto OBLIGATORIO para la rama y el directorio: {{ steps.extraer_hito.output.data.slug }}

        MODO DESATENDIDO. Nadie va a responder preguntas en esta sesión:
        - No esperes respuesta del usuario. Si detectas ambigüedad que afecte al alcance, déjala como [NEEDS CLARIFICATION: pregunta concreta] (máximo 3); las resolverá un proceso posterior con contexto limpio. No la resuelvas tú ni presentes opciones.
        - El alcance del spec es EXACTAMENTE la sección del hito que sigue. Lo que no esté en ella, en CLAUDE.md, en refs/ o en .specify/memory/constitution.md va a una sección "## Fuera de alcance" y no se implementa.
        - Lee antes CLAUDE.md, docs/ROADMAP.md (§1 Definition of Done, §2 arquitectura, §3 controles, §6 ritual) y los refs/ que el hito cite.
        - Los criterios de aceptación del spec deben incluir literalmente los de "Aceptación" y "Controles" del hito.

        Sección del roadmap:

        {{ steps.extraer_hito.output.data.texto }}

  # ================================================================ clarify en tres pasos
  # 1) el comando clarify solo formula preguntas (sin recomendación)
  # 2) un proceso nuevo, sin acceso a la sesión anterior, las responde con el criterio
  # 3) el comando clarify integra las respuestas en el spec
  - id: clarify_preguntas
    command: speckit.clarify
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO DESATENDIDO, FASE 1 (solo preguntas). Ejecuta el escaneo de ambigüedad y cobertura y genera la cola priorizada de preguntas (máximo 5) exactamente como en modo interactivo, PERO:
        - No presentes las preguntas al usuario ni esperes respuesta.
        - No respondas ninguna. No incluyas recomendación, sugerencia ni opción "preferida": las decidirá otro proceso con contexto limpio y cualquier pista sesgaría la decisión.
        - No modifiques spec.md ni checklists en esta fase.
        - Incluye también como preguntas los marcadores [NEEDS CLARIFICATION] que queden en spec.md.
        - Escribe <feature_dir>/gates/clarify-preguntas.json (localiza <feature_dir> en .specify/feature.json; crea gates/ si no existe) con este formato exacto:
          {"preguntas":[{"id":"Q1","categoria":"…","pregunta":"…","por_que_importa":"…","opciones":[{"id":"A","texto":"…"}],"respuesta_corta_permitida":true}]}
          Las opciones deben ser mutuamente excluyentes y describir implicaciones de forma neutral, sin valorar cuál es mejor.
        - Si no hay ambigüedades que merezcan pregunta, escribe {"preguntas":[]}.
        Termina con un resumen de una línea.

  - id: resolver_clarify
    type: prompt
    model: "{{ inputs.modelo_juez }}"
    timeout: 1800
    prompt: |
      Eres un proceso independiente con contexto limpio: no has visto la sesión que formuló las preguntas, no debes buscar su razonamiento y decides únicamente con documentos.
      1. Lee .specify/feature.json para localizar <feature_dir>. Lee <feature_dir>/gates/clarify-preguntas.json y <feature_dir>/spec.md; la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md; la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md; CLAUDE.md; y los refs/ que el hito cite.
      2. Para cada pregunta, en orden:
         (a) si la respuesta está determinada por el hito, CLAUDE.md, refs/ o la constitución, esa es la respuesta; cita la fuente;
         (b) si no está especificada en ninguna fuente, la respuesta es "fuera de alcance: no se implementa";
         (c) si varias opciones son compatibles con las fuentes, elige la de mayor calidad, escalabilidad, mantenibilidad, seguridad y mejores prácticas de Go y de este proyecto, sin atajos ni ñapas, y explica la alternativa rechazada;
         (d) si la pregunta afecta a alcance, frontera humana, privacidad, términos de uso de una fuente o a una decisión cerrada de CLAUDE.md, no decidas: marca escalar=true y explica qué debe decidir el humano.
      3. Escribe <feature_dir>/gates/clarify-respuestas.json con este formato exacto, una entrada por pregunta y los mismos ids:
         {"respuestas":[{"id":"Q1","opcion":"A","respuesta":"…","criterio":"a|b|c|d","fuente":"…","alternativa_rechazada":"…","escalar":false}]}
         Si preguntas está vacío, escribe {"respuestas":[]}.
      No modifiques ningún otro fichero. No preguntes ni esperes respuesta.

  - id: check_clarify
    type: shell
    output_format: json
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      p="$d/gates/clarify-preguntas.json"; r="$d/gates/clarify-respuestas.json"
      [ -f "$p" ] || { echo "falta $p" >&2; exit 1; }
      [ -f "$r" ] || { echo "falta $r" >&2; exit 1; }
      n=$(jq '.preguntas | length' "$p")
      faltan=$(jq -r --slurpfile r "$r" '([.preguntas[].id] - [$r[0].respuestas[].id]) | join(" ")' "$p")
      [ -z "$faltan" ] || { echo "preguntas sin respuesta: $faltan" >&2; exit 1; }
      esc=$(jq '[.respuestas[] | select(.escalar == true)] | length' "$r")
      if [ "$esc" -gt 0 ]; then
        echo "clarificaciones ESCALADAS a decisión humana. Edita $r (respuesta + escalar=false) y reanuda el run:" >&2
        jq -r '.respuestas[] | select(.escalar == true) | "- \(.id): \(.respuesta)"' "$r" >&2
        exit 1
      fi
      jq -n --argjson n "$n" '{n: $n}'

  - id: integrar_clarify
    type: if
    condition: "{{ steps.check_clarify.output.data.n > 0 }}"
    then:
      - id: clarify_integrar
        command: speckit.clarify
        model: "{{ inputs.modelo_redaccion }}"
        input:
          args: |
            MODO DESATENDIDO, FASE 2 (integración). No generes preguntas nuevas ni esperes respuesta. Las preguntas están en <feature_dir>/gates/clarify-preguntas.json y las respuestas ya decididas en <feature_dir>/gates/clarify-respuestas.json (localiza <feature_dir> en .specify/feature.json). Trata cada par como una pregunta ya aceptada por el usuario y aplica tus reglas de integración incremental:
            - en ## Clarifications, una línea por pregunta: "- Q: <pregunta> → A: <respuesta> (auto: criterio <criterio>; fuente: <fuente>)";
            - actualiza las secciones afectadas del spec y elimina los [NEEDS CLARIFICATION] resueltos;
            - lo respondido con "no se implementa" va a "## Fuera de alcance";
            - actualiza checklists/requirements.md.
            Termina con el informe de cobertura.

  # ================================================================ gate del spec
  - id: gate_spec
    type: prompt
    model: "{{ inputs.modelo_juez }}"
    timeout: 1800
    prompt: |
      Actúas como gate de calidad del spec del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Aplica la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md.
      1. Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, checklists/requirements.md y gates/clarify-*.json de ese directorio, la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md, CLAUDE.md y la constitución.
      2. Comprueba: (a) el alcance coincide con el hito, ni más ni menos; (b) todo lo no especificado está en "Fuera de alcance"; (c) no quedan [NEEDS CLARIFICATION] y cada respuesta de clarify-respuestas.json está reflejada en el spec; (d) los criterios de aceptación y controles del hito están en el spec; (e) no se reabre ninguna decisión cerrada; (f) requirements.md tiene todos los ítems marcados y cada marca es cierta.
      3. Si encuentras defectos corregibles sin decisión humana, corrige spec.md y el checklist directamente, con la mejor solución y sin atajos. Un defecto que requiera decisión humana (alcance, frontera humana, privacidad, TOS, decisión cerrada) no se resuelve: se documenta.
      4. Escribe <feature_dir>/gates/spec.json con el formato exacto {"veredicto":"aprobado"|"rechazado","motivos":["…"],"correcciones":["…"]}. "aprobado" solo si tras tus correcciones se cumplen (a)-(f).
      No hagas preguntas; no esperes respuesta.

  - id: check_gate_spec
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      jq -e '.veredicto == "aprobado"' "$d/gates/spec.json" >/dev/null || { echo "gate_spec RECHAZADO:"; jq -r '.motivos[]' "$d/gates/spec.json"; exit 1; }
      ! grep -q "NEEDS CLARIFICATION" "$d/spec.md" || { echo "quedan marcadores sin resolver en spec.md"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md || { echo "checklists con ítems sin marcar"; exit 1; }
      echo "gate_spec aprobado"

  - id: revision_humana_spec
    type: if
    condition: "{{ inputs.modo == 'supervisado' }}"
    then:
      - id: gate_humano_spec
        type: gate
        message: "Revisa spec.md, gates/clarify-respuestas.json y gates/spec.json antes de planificar."
        options: [approve, reject]
        on_reject: abort
        verdict_input: veredicto_spec

  # ================================================================ plan
  - id: plan
    command: speckit.plan
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes ni esperes respuesta; resuelve dudas técnicas con la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md y déjalas documentadas en research.md (decisión, alternativas, por qué).
        Restricciones para este hito {{ inputs.hito }}:
        - Stack y dependencias: solo las fijadas en la constitución (§V) y en docs/ROADMAP.md §3; cualquier otra va a Complexity Tracking con justificación o no se usa.
        - Estructura: la de docs/ROADMAP.md §2 y CLAUDE.md. Reglas de dependencia entre paquetes obligatorias.
        - Rellena el Constitution Check con un ítem por principio (I-VII) y por regla de dependencia, indicando cómo lo cumple este hito. Si un gate falla sin justificación, detente con ERROR.
        - Aplica las skills golang-* instaladas (golang-how-to orquesta) al decidir layout, tests, lint y CLI.
        - Lo que no esté en el spec no entra en el plan.

  - id: gate_plan
    type: prompt
    model: "{{ inputs.modelo_juez }}"
    timeout: 1800
    prompt: |
      Actúas como gate de arquitectura del plan del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Aplica la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md.
      1. Lee .specify/feature.json y, en <feature_dir>: spec.md, plan.md, research.md, data-model.md y contracts/ (los que existan). Lee la constitución, CLAUDE.md y docs/ROADMAP.md §2-§3.
      2. Comprueba: (a) Constitution Check completo y veraz; (b) ninguna dependencia fuera de la lista fijada sin justificación; (c) reglas de dependencia entre paquetes respetadas en la estructura propuesta; (d) errores tipados y exit codes; (e) tests primero: el plan nombra el test e2e y los unitarios/fixtures del hito; (f) nada fuera del spec; (g) ningún atajo (nolint, tests saltados, TODO diferidos, errores silenciados); (h) si hay varias alternativas técnicas, la elegida es la de mayor calidad y escalabilidad, y research.md explica la rechazada.
      3. Corrige directamente plan.md/research.md/data-model.md si el defecto no requiere decisión humana. Si la requiere (alcance, frontera humana, privacidad, TOS, decisión cerrada), no lo resuelvas: documéntalo.
      4. Escribe <feature_dir>/gates/plan.json con el formato exacto {"veredicto":"aprobado"|"rechazado","motivos":["…"],"correcciones":["…"]}.
      No hagas preguntas; no esperes respuesta.

  - id: check_gate_plan
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      jq -e '.veredicto == "aprobado"' "$d/gates/plan.json" >/dev/null || { echo "gate_plan RECHAZADO:"; jq -r '.motivos[]' "$d/gates/plan.json"; exit 1; }
      ! grep -q "NEEDS CLARIFICATION" "$d/plan.md" || { echo "plan.md conserva NEEDS CLARIFICATION"; exit 1; }
      echo "gate_plan aprobado"

  - id: revision_humana_plan
    type: if
    condition: "{{ inputs.modo == 'supervisado' }}"
    then:
      - id: gate_humano_plan
        type: gate
        message: "Revisa plan.md, research.md y gates/plan.json antes de generar tareas."
        options: [approve, reject]
        on_reject: abort
        verdict_input: veredicto_plan

  # ================================================================ tasks + analyze
  - id: tasks
    command: speckit.tasks
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes. Genera tasks.md siguiendo docs/ROADMAP.md §6 (ritual por hito) con estas reglas, porque las tareas se ejecutarán y verificarán UNA A UNA por un proceso automático:
        - Cada tarea es una rebanada vertical que deja `make ci` en verde al terminar: incluye su test (unitario, integración o e2e) y la implementación mínima que lo hace pasar. No separes "escribir el test" e "implementar" en tareas distintas salvo que el test cubra código ya existente.
        - Orden estrictamente ejecutable en secuencia: ninguna tarea depende de una posterior. La primera tarea de implementación entrega el esqueleto mínimo que hace que `make ci` exista y pase (en H0, el propio Makefile y los gates); el test e2e testscript que describe la entrega del hito va en la primera tarea que pueda dejarlo en verde.
        - Formato de línea obligatorio: "- [ ] T001 [P] [US1] Descripción con rutas de fichero", una tarea por línea, ids T001, T002… únicos y correlativos.
        - Incluye tareas explícitas para cada punto de la Definition of Done (§1) que aplique al hito: CHANGELOG.md, ADR, docs/SOURCES.md, schemas, fixtures.
        - Ninguna tarea fuera del spec.

  - id: analyze
    command: speckit.analyze
    model: "{{ inputs.modelo_analisis }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes ni ofrezcas remediaciones para después. Además de mostrar el informe, escríbelo íntegro en <feature_dir>/gates/analyze.md (localiza <feature_dir> con .specify/feature.json).

  - id: gate_tasks
    type: prompt
    model: "{{ inputs.modelo_juez }}"
    timeout: 1800
    prompt: |
      Actúas como gate de consistencia del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Aplica la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md.
      1. Lee .specify/feature.json y, en <feature_dir>: gates/analyze.md, spec.md, plan.md, tasks.md y checklists/.
      2. Resuelve cada hallazgo CRITICAL y HIGH del análisis corrigiendo el artefacto que corresponda (spec, plan o tasks), con la mejor solución y sin atajos. Los MEDIUM/LOW corrígelos si no requieren decisión humana. Un hallazgo que exija decisión humana (alcance, frontera humana, privacidad, TOS, decisión cerrada) no se resuelve: se documenta.
      3. Verifica que toda tarea traza a un requisito del spec y todo requisito tiene tareas; que cada tarea es una rebanada que deja `make ci` en verde por sí sola (test + implementación juntos) y que el orden es ejecutable en secuencia; que cada línea de tarea sigue el formato "- [ ] Tnnn …"; que las checklists están todas marcadas y cada marca es verdad (si una no lo es, corrige el artefacto; nunca marques sin cumplir).
      4. Escribe <feature_dir>/gates/tasks.json con el formato exacto {"veredicto":"aprobado"|"rechazado","motivos":["…"],"correcciones":["…"]}.
      No hagas preguntas; no esperes respuesta.

  - id: check_gate_tasks
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      jq -e '.veredicto == "aprobado"' "$d/gates/tasks.json" >/dev/null || { echo "gate_tasks RECHAZADO:"; jq -r '.motivos[]' "$d/gates/tasks.json"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md || { echo "checklists con ítems sin marcar: implement se detendría a preguntar"; exit 1; }
      grep -qE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" || { echo "tasks.md no contiene tareas con el formato '- [ ] Tnnn'"; exit 1; }
      echo "gate_tasks aprobado: $(grep -cE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md") tareas"

  # ================================================================ implementación tarea a tarea
  - id: implementacion_por_tarea
    type: if
    condition: "{{ inputs.granularidad == 'tarea' }}"
    then:
      - id: bucle_tareas
        type: do-while
        max_iterations: 300
        condition: "{{ steps.siguiente_tarea.output.data.id != '' }}"
        steps:
          - id: siguiente_tarea
            type: shell
            output_format: json
            timeout: 30
            run: |
              set -eu
              d=$(jq -r .feature_directory .specify/feature.json)
              mkdir -p "$d/gates"
              f="$d/gates/tareas-intentos.json"; [ -f "$f" ] || echo '{}' > "$f"
              linea=$(grep -E '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" | head -1 || true)
              if [ -z "$linea" ]; then jq -n '{id:"", texto:"", intento:0}'; exit 0; fi
              id=$(printf '%s' "$linea" | grep -oE 'T[0-9]+' | head -1)
              texto=$(printf '%s' "$linea" | sed -E 's/^[[:space:]]*- \[ \] //')
              n=$(jq -r --arg id "$id" '.[$id] // 0' "$f"); n=$((n + 1))
              jq --arg id "$id" --argjson n "$n" '.[$id] = $n' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              if [ "$n" -gt 3 ]; then
                echo "la tarea $id lleva $n intentos sin quedar marcada [X]; se detiene para revisión humana (ver $d/gates/tarea-$id.md)" >&2
                exit 1
              fi
              jq -n --arg id "$id" --arg texto "$texto" --argjson n "$n" '{id:$id, texto:$texto, intento:$n}'

          - id: tarea
            type: if
            condition: "{{ steps.siguiente_tarea.output.data.id != '' }}"
            then:
              - id: implementar_tarea
                command: speckit.implement
                model: "{{ inputs.modelo_implementacion }}"
                input:
                  args: |
                    MODO DESATENDIDO. Ejecuta ÚNICAMENTE la tarea {{ steps.siguiente_tarea.output.data.id }} de tasks.md (intento {{ steps.siguiente_tarea.output.data.intento }} de 3):
                    {{ steps.siguiente_tarea.output.data.texto }}
                    Reglas: el test primero, dentro de la tarea (rojo → verde); sin atajos (nada de nolint sin justificar, tests saltados, TODO diferidos ni errores silenciados); aplica las skills golang-*; no toques ni marques otras tareas. Al terminar ejecuta la verificación determinista (`make ci`; si aún no existe el Makefile, `go build ./... && go vet ./... && go test -race ./...`) y marca la tarea [X] SOLO si está en verde. Si ya estaba hecha y en verde, limítate a marcarla. Si no consigues verde, déjala [ ] y escribe la causa en <feature_dir>/gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md. Las checklists ya fueron verificadas; no preguntes ni esperes respuesta.

              - id: verificar
                type: shell
                continue_on_error: true
                timeout: 1800
                run: |
                  set -u
                  d=$(jq -r .feature_directory .specify/feature.json)
                  mkdir -p "$d/gates"; log="$d/gates/ci.log"
                  if [ -f Makefile ] && grep -qE '^ci:' Makefile; then cmd="make ci"
                  elif [ -f go.mod ]; then cmd="go build ./... && go vet ./... && go test -race ./..."
                  else echo "sin Makefile ni go.mod todavía: nada que verificar"; exit 0; fi
                  sh -c "$cmd" > "$log" 2>&1; rc=$?
                  if [ "$rc" -eq 0 ]; then echo "verificación en verde: $cmd"; exit 0; fi
                  echo "verificación FALLIDA ($cmd, exit $rc). Últimas 80 líneas del log ($log):"
                  tail -80 "$log"
                  exit "$rc"

              - id: reparar_tarea
                type: if
                condition: "{{ steps.verificar.output.exit_code != 0 }}"
                then:
                  - id: reparar
                    type: prompt
                    model: "{{ inputs.modelo_implementacion }}"
                    timeout: 1800
                    prompt: |
                      La verificación determinista falla tras la tarea {{ steps.siguiente_tarea.output.data.id }} ({{ steps.siguiente_tarea.output.data.texto }}) del hito {{ inputs.hito }} de kitlegal. Salida del verificador (final del log; el completo está en <feature_dir>/gates/ci.log, con <feature_dir> en .specify/feature.json):

                      {{ steps.verificar.output.stdout }}

                      Arregla la causa raíz aplicando la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md: nada de desactivar linters, tests o controles; nada de nolint sin justificación en el propio código; nada de silenciar errores. Si el fallo es un test que legítimamente sigue en rojo porque su implementación pertenece a una tarea posterior, NO lo arregles: la tarea está mal delimitada; anótalo en gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md, deja la tarea como [ ] y termina. En cualquier otro caso repite la verificación hasta verde y deja la tarea marcada [X]. No preguntes ni esperes respuesta.

                  - id: verificar_reparacion
                    type: shell
                    timeout: 1800
                    run: |
                      set -u
                      d=$(jq -r .feature_directory .specify/feature.json)
                      log="$d/gates/ci.log"
                      if [ -f Makefile ] && grep -qE '^ci:' Makefile; then cmd="make ci"
                      elif [ -f go.mod ]; then cmd="go build ./... && go vet ./... && go test -race ./..."
                      else exit 0; fi
                      sh -c "$cmd" > "$log" 2>&1; rc=$?
                      if [ "$rc" -eq 0 ]; then echo "reparación verificada: $cmd"; exit 0; fi
                      echo "la reparación no deja la verificación en verde; se detiene para revisión humana. Últimas 80 líneas:"
                      tail -80 "$log"
                      exit "$rc"

  # ================================================================ implementación en una pasada (granularidad=hito)
  - id: implementacion_hito
    type: if
    condition: "{{ inputs.granularidad == 'hito' }}"
    then:
      - id: implement
        command: speckit.implement
        model: "{{ inputs.modelo_implementacion }}"
        input:
          args: |
            MODO DESATENDIDO: no preguntes ni esperes respuesta. Las checklists ya han sido verificadas. Ejecuta todas las tareas de tasks.md en orden; tests antes que código; sin atajos. Aplica las skills golang-*. Al terminar ejecuta `make ci` y no des por terminado el hito hasta que esté en verde; si un control falla, arregla la causa, no el control. Marca cada tarea completada como [X].

  # ================================================================ CI del hito completo
  - id: ci
    type: shell
    continue_on_error: true
    timeout: 1800
    run: |
      set -u
      d=$(jq -r .feature_directory .specify/feature.json)
      mkdir -p "$d/gates"; log="$d/gates/ci.log"
      make ci > "$log" 2>&1; rc=$?
      if [ "$rc" -eq 0 ]; then echo "make ci en verde"; exit 0; fi
      echo "make ci FALLA (exit $rc). Últimas 80 líneas:"; tail -80 "$log"; exit "$rc"

  - id: reparar_ci
    type: if
    condition: "{{ steps.ci.output.exit_code != 0 }}"
    then:
      - id: bucle_reparacion
        type: do-while
        max_iterations: 3
        condition: "{{ steps.ci_reintento.output.exit_code != 0 }}"
        steps:
          - id: reparar_hito
            type: prompt
            model: "{{ inputs.modelo_implementacion }}"
            timeout: 1800
            prompt: |
              `make ci` falla en el hito {{ inputs.hito }} de kitlegal. Salida (final del log; completo en <feature_dir>/gates/ci.log):

              {{ steps.ci.output.stdout }}

              Ejecuta `make ci`, lee la salida completa y arregla la causa raíz aplicando la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md: nada de desactivar linters, tests o controles; nada de nolint sin justificación. Repite hasta verde. Si el fallo requiere una decisión humana, escribe el motivo en <feature_dir>/gates/ci-bloqueado.md y termina. No preguntes.
          - id: ci_reintento
            type: shell
            continue_on_error: true
            timeout: 1800
            run: |
              set -u
              d=$(jq -r .feature_directory .specify/feature.json)
              log="$d/gates/ci.log"
              make ci > "$log" 2>&1; rc=$?
              if [ "$rc" -eq 0 ]; then echo "make ci en verde"; exit 0; fi
              echo "make ci sigue FALLANDO (exit $rc). Últimas 80 líneas:"; tail -80 "$log"; exit "$rc"
      - id: ci_tras_reparacion
        type: shell
        timeout: 1800
        run: "make ci"

  # ================================================================ converge + revisión
  - id: converge
    command: speckit.converge
    model: "{{ inputs.modelo_analisis }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes. Compara el código con spec.md, plan.md y tasks.md y añade a tasks.md, con el formato "- [ ] Tnnn …" e ids correlativos, solo el trabajo que falte para cumplir el spec y la Definition of Done (docs/ROADMAP.md §1). Nada fuera del spec.

  - id: implement_restante
    command: speckit.implement
    model: "{{ inputs.modelo_implementacion }}"
    input:
      args: |
        MODO DESATENDIDO: ejecuta únicamente las tareas pendientes ([ ]) que converge haya añadido, una a una, con test primero y verificación `make ci` tras cada una. Si no hay ninguna, termina sin cambios. Termina con `make ci` en verde y las tareas marcadas [X]. No preguntes.

  - id: revision
    type: prompt
    model: "{{ inputs.modelo_juez }}"
    timeout: 1800
    prompt: |
      Actúas como revisor final del hito {{ inputs.hito }} de kitlegal antes de la PR, en un proceso nuevo con contexto limpio. Aplica la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md y la Definition of Done de docs/ROADMAP.md §1.
      1. Revisa `git diff main...HEAD` completo: corrección, seguridad (frontera humana, HTTP solo vía internal/httpx y solo GET/HEAD, sin secretos, sin NIF de persona), reglas de dependencia entre paquetes, errores tipados y exit codes, cobertura de tests del código nuevo, ausencia de atajos.
      2. Corrige directamente todo lo que encuentres y vuelve a ejecutar `make ci` hasta verde.
      3. Comprueba cada punto de la Definition of Done y escribe <feature_dir>/gates/revision.md con: tabla DoD (punto, cumple sí/no, evidencia), hallazgos corregidos y una sección "Pendientes" con lo que quedó fuera de alcance o requiere decisión humana. Escribe además <feature_dir>/gates/revision.json con {"veredicto":"aprobado"|"rechazado","motivos":["…"]}: "aprobado" solo si la DoD se cumple entera.
      4. Deja todo commiteado en la rama del hito con Conventional Commits. No hagas push ni merge.
      No preguntes; no esperes respuesta.

  - id: ci_final
    type: shell
    timeout: 1800
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      make ci
      jq -e '.veredicto == "aprobado"' "$d/gates/revision.json" >/dev/null || { echo "revisión final RECHAZADA:"; jq -r '.motivos[]' "$d/gates/revision.json"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" || { echo "quedan tareas sin marcar en tasks.md"; exit 1; }
      test -z "$(git status --porcelain)" || { echo "quedan cambios sin commitear"; git status --short; exit 1; }
      echo "== Hito {{ inputs.hito }} listo para PR =="
      git log --oneline main..HEAD
      git diff --stat main...HEAD | tail -1

  - id: revision_humana_final
    type: if
    condition: "{{ inputs.modo == 'supervisado' }}"
    then:
      - id: gate_humano_final
        type: gate
        message: "Revisa gates/revision.md y el diff. approve = listo para abrir PR y squash-merge (acción humana)."
        options: [approve, reject]
        on_reject: abort
        verdict_input: veredicto_final
