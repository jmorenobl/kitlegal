schema_version: "1.0"
workflow:
  id: "hito"
  name: "Hito del roadmap (SDD autónomo, persona en los extremos)"
  version: "2.2.0"
  author: "kitlegal"
  integration: "claude"
  description: "Implementa un hito de docs/ROADMAP.md sin ninguna persona entre la entrada y el informe final (ADR 0018). La sección del hito es la entrada; specify, clarify (lectura conservadora), plan y tasks se juzgan con rúbrica y un corrector aparte; el único rechazo posible es el de entrada del spec. Los jueces aplican el umbral de materialidad, el criterio de uso de fuera adentro, la proporcionalidad y la convergencia entre rondas (ADR 0028), y exigen que todo umbral que se mide en make ci o en el cierre tenga un control que lo haga cumplir (ADR 0029). Implementación tarea a tarea con guardián de diff, suite de aceptación congelada, grabación determinista de datos externos y cuarentena en lugar de paradas. Barrido de artefactos, revisión final con dos jueces, cierre en la plataforma (CI y evals sobre la cabeza) e informe final como cuerpo de la propuesta de cambio. Fusionar sigue siendo humano."

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["claude"]

# Seguridad: `inputs.hito` se interpola en pasos `shell`, por eso está
# restringido a un enum. Ningún otro valor libre entra en un `run:`; los
# pasos shell leen todo lo demás de ficheros (.specify/feature.json, gates/*.json).
# La lógica de los pasos shell vive en scripts/workflow/*.sh (un script por
# responsabilidad, compartidos por los pasos que antes la repetían en el YAML).
inputs:
  hito:
    type: string
    required: true
    prompt: "Hito del roadmap a implementar (H0..H30, o un seguimiento H<n>.<m>)"
    # Los H<n>.<m> son seguimientos que endurecen un hito ya entregado sin ocupar
    # el número del siguiente: renumerar H6..H19 reescribiría registros de
    # decisiones ya tomadas (ADR 0013, ADR 0014), que es lo que el proyecto evita.
    # Siguen siendo una lista cerrada, que es lo que protege la interpolación en
    # los pasos shell: ninguno lleva un metacarácter.
    enum: ["H0","H1","H2","H3","H4","H5","H5.1","H5.2","H6","H6.1","H6.2","H7","H7.1","H7.2","H7.3","H8","H9","H10","H11","H12","H13","H14","H15","H16","H17","H18","H19","H20","H21","H22","H23","H24","H25","H26","H27","H28","H29","H30"]
  # ---- modelo y esfuerzo por rol: "<modelo>" o "<modelo>@<esfuerzo>" ----
  # (Haiku 4.5 no admite esfuerzo: solo sin sufijo.)
  # scripts/claude-modelo.sh (SPECKIT_INTEGRATION_CLAUDE_EXECUTABLE, exportado
  # por scripts/hito.sh) traduce "@<esfuerzo>" a `--effort`; sin el wrapper,
  # `claude` rechaza el valor. Criterio de asignación en docs/WORKFLOW.md.
  # Fable 5.1 solo donde la estructura lo pide: el juez adversarial de la revisión
  # final (otra familia que el juez A) y lo que ya falló con Opus (escalada).
  modelo_decision:
    type: string
    default: "opus@xhigh"
    enum: &modelos [
      "fable", "fable@low", "fable@medium", "fable@high", "fable@xhigh", "fable@max",
      "opus", "opus@low", "opus@medium", "opus@high", "opus@xhigh", "opus@max",
      "sonnet", "sonnet@low", "sonnet@medium", "sonnet@high", "sonnet@xhigh", "sonnet@max",
      "haiku",
      "claude-fable-5-1", "claude-fable-5-1@low", "claude-fable-5-1@medium", "claude-fable-5-1@high", "claude-fable-5-1@xhigh", "claude-fable-5-1@max",
      "claude-opus-5", "claude-opus-5@low", "claude-opus-5@medium", "claude-opus-5@high", "claude-opus-5@xhigh", "claude-opus-5@max",
      "claude-sonnet-5", "claude-sonnet-5@low", "claude-sonnet-5@medium", "claude-sonnet-5@high", "claude-sonnet-5@xhigh", "claude-sonnet-5@max",
      "claude-haiku-4-5"
    ]
    prompt: "Decisiones con más consecuencias aguas abajo: resolver clarificaciones, plan y corrector del plan"
  modelo_juez:
    type: string
    default: "opus@xhigh"
    enum: *modelos
    prompt: "Jueces de spec, plan y tasks"
  modelo_revisor:
    type: string
    default: "opus@xhigh"
    enum: *modelos
    prompt: "Juez A de la revisión final (rúbrica DoD)"
  modelo_adversario:
    type: string
    default: "fable@xhigh"
    enum: *modelos
    prompt: "Juez B (adversarial) de la revisión final; otra familia que modelo_revisor para que los dos votos no fallen a la vez"
  modelo_redaccion:
    type: string
    default: "opus@high"
    enum: *modelos
    prompt: "specify, formular preguntas de clarify, tasks, correctores de spec y tasks y barrido de artefactos"
  modelo_implementacion:
    type: string
    default: "opus@xhigh"
    enum: *modelos
    prompt: "Primer intento de cada tarea y corrector de la revisión final"
  modelo_escalada:
    type: string
    default: "fable@xhigh"
    enum: *modelos
    prompt: "Lo que ya falló con modelo_implementacion: reintentos de tarea y reparaciones de CI y del cierre"
  modelo_analisis:
    type: string
    default: "sonnet@high"
    enum: *modelos
    prompt: "Pasos de lectura y transformación: integrar clarificaciones, analyze y converge"

steps:
  # ================================================================ entrada: la sección del hito es lo único que escribe la persona
  - id: extraer_hito
    type: shell
    output_format: json
    timeout: 30
    run: |
      set -eu
      h="{{ inputs.hito }}"
      # El punto de un seguimiento H<n>.<m> es literal en el patrón: sin escapar,
      # casaría con cualquier carácter y podría extraer otro hito.
      h_re=$(printf '%s' "$h" | sed 's/\./\\./g')
      sec=$(awk -v h="$h_re" 'BEGIN{p=0} $0 ~ ("^#### " h " · "){p=1; print; next} p && /^(#{2,4} |---)/{exit} p{print}' docs/ROADMAP.md)
      [ -n "$sec" ] || { echo "hito $h no encontrado en docs/ROADMAP.md" >&2; exit 1; }
      titulo=$(printf '%s\n' "$sec" | head -1 | sed -E 's/^#### [A-Z0-9.]+ · //')
      palabras=$(printf '%s' "$titulo" | tr '[:upper:]' '[:lower:]' | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -d- -f1-3)
      # El punto no llega al nombre de la rama ni al del directorio: h5.1 → h5-1.
      slug="$(printf '%s' "$h" | tr '[:upper:]' '[:lower:]' | tr . -)-$palabras"
      jq -n --arg hito "$h" --arg titulo "$titulo" --arg slug "$slug" --arg texto "$sec" \
        '{hito:$hito, titulo:$titulo, slug:$slug, texto:$texto}'

  # ================================================================ specify
  - id: specify
    command: speckit.specify
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        Hito {{ inputs.hito }} · {{ steps.extraer_hito.output.data.titulo }}.
        Nombre corto OBLIGATORIO para la rama y el directorio: {{ steps.extraer_hito.output.data.slug }}

        MODO AUTÓNOMO (ADR 0018). La sección del roadmap que sigue es la entrada de la persona: la única instrucción humana de todo el run. Nadie va a responder preguntas ni a revisar nada hasta el informe final:
        - No esperes respuesta. Si detectas ambigüedad que afecte al alcance, déjala como [NEEDS CLARIFICATION: pregunta concreta] (máximo 3); la cerrará un proceso posterior con contexto limpio y el criterio de la constitución. No la resuelvas tú ni presentes opciones.
        - El alcance del spec es EXACTAMENTE la sección del hito. Lo que no esté en ella, en CLAUDE.md, en refs/ o en .specify/memory/constitution.md va a "## Fuera de alcance" (obligatoria, aunque quede vacía) y no se implementa.
        - Lee antes CLAUDE.md, docs/ROADMAP.md (§1 Definition of Done, §2 arquitectura, §3 controles, §6 ritual) y los refs/ que el hito cite.
        - Cada requisito lleva un id estable y único en negrita (**FR-001**, **SC-001**…) y al menos un criterio comprobable; los escenarios de aceptación van en forma Dado/Cuando/Entonces; las restricciones no funcionales llevan umbral numérico. De ahí saldrán los guiones de aceptación congelados, que no se pueden escribir contra un requisito ambiguo.
        - Los criterios de aceptación del spec deben incluir literalmente los de "Aceptación" y "Controles" del hito.
        - De fuera adentro (criterio i del juez): para cada salida que consume una skill o una persona, el spec dice quién la pide y cuántas veces por pregunta, qué tamaño tiene con meses de uso (cientos de normas y miles de bloques consultados) y cuándo deja de darse cada señal. Parte de lo que el hito dice que gana la skill.
        - Umbral de materialidad (constitución, «Gates»): especifica solo los estados y las entradas a los que el producto puede llegar y cuyas lecturas cambian algo que ve una persona o una skill. Lo que llega de fuera manipulado a mano lo cubre una regla genérica —defecto `inesperado`, código 1 (ADR 0023)—, sin casos, ficheros ni bytes.
        - Umbrales que se cumplen (criterio j del juez; ADR 0029): cada requisito o criterio de éxito con un umbral numérico que se mide sin persona, en `make ci` o en el cierre (el job de evals u otra comprobación de la plataforma), dice qué comprobación sale en rojo si la medida pasa del umbral. Publicar la medida no basta; la regla por serie del ADR 0016 no hace cumplir un umbral agregado; y hacer cumplir un umbral que pide el hito no es alcance añadido: su control nunca va a "## Fuera de alcance".
        - Antes de dar por terminado, comprueba spec.md y checklists/ contra la rúbrica del paso `juez_spec` de .specify/workflows/hito/workflow.yml y contra scripts/workflow/precheck.sh (fase spec), y corrige lo que no cumpla: cada rechazo cuesta una ronda entera.

        Sección del roadmap:

        {{ steps.extraer_hito.output.data.texto }}

  # ================================================================ clarify: pregunta un proceso, responde otro, nadie escala
  - id: clarify_preguntas
    command: speckit.clarify
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO AUTÓNOMO, FASE 1 (solo preguntas). Ejecuta el escaneo de ambigüedad y cobertura y genera la cola priorizada de preguntas (máximo 5) exactamente como en modo interactivo, PERO:
        - No presentes las preguntas al usuario ni esperes respuesta.
        - No respondas ninguna. No incluyas recomendación, sugerencia ni opción "preferida": las decidirá otro proceso con contexto limpio y cualquier pista sesgaría la decisión.
        - No modifiques spec.md ni checklists en esta fase.
        - Incluye también como preguntas los marcadores [NEEDS CLARIFICATION] que queden en spec.md.
        - No formules preguntas sobre estados o entradas que no pasan el umbral de materialidad de .specify/memory/constitution.md («Gates»): los cubre una regla genérica y preguntar por ellos solo añade texto al spec.
        - Escribe <feature_dir>/gates/clarify-preguntas.json (localiza <feature_dir> en .specify/feature.json; crea gates/ si no existe) con este formato exacto:
          {"preguntas":[{"id":"Q1","categoria":"…","pregunta":"…","por_que_importa":"…","opciones":[{"id":"A","texto":"…"}],"respuesta_corta_permitida":true}]}
          Las opciones deben ser mutuamente excluyentes y describir implicaciones de forma neutral, sin valorar cuál es mejor.
        - Si no hay ambigüedades que merezcan pregunta, escribe {"preguntas":[]}.
        Termina con un resumen de una línea.

  - id: iniciar_clarify
    type: shell
    timeout: 30
    run: "scripts/workflow/clarify.sh iniciar"

  - id: ronda_clarify
    type: do-while
    max_iterations: 3
    condition: "{{ not steps.check_clarify.output.data.completo and steps.check_clarify.output.data.ronda < 3 }}"
    steps:
      - id: resolver_clarify
        type: prompt
        model: "{{ inputs.modelo_decision }}"
        timeout: 3600
        prompt: |
          Eres un proceso independiente con contexto limpio: no has visto la sesión que formuló las preguntas, no debes buscar su razonamiento y decides únicamente con documentos. Nadie va a revisar tu decisión antes del informe final: tiene que ser la mejor posible y quedar explicada.
          1. Lee .specify/feature.json para localizar <feature_dir>. Lee <feature_dir>/gates/clarify-preguntas.json y <feature_dir>/spec.md; la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md; la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md; CLAUDE.md; y los refs/ que el hito cite. Si ya existe <feature_dir>/gates/clarify-respuestas.json, es un intento anterior incompleto: complétalo.
          2. Para cada pregunta, en orden:
             (e) antes que nada, el umbral de materialidad de la sección «Gates» de la constitución: si el producto no puede llegar a ese estado o recibir esa entrada por una vía real (un emisor que existe o que entrega el hito, un argumento, una bandera o una variable de quien usa el kit, o un estado que crea el propio binario, incluidas sus invocaciones concurrentes y la interrupción de sus propias escrituras si el hito promete atomicidad), o si todas las opciones dan el mismo resultado observable para una persona o una skill, la respuesta es "no material: lo cubre la regla genérica (defecto `inesperado`, código 1, ADR 0023); el spec no lo especifica", con criterio "e";
             (a) si la respuesta está determinada por el hito, CLAUDE.md, refs/ o la constitución, esa es la respuesta; cita la fuente;
             (b) si no está especificada en ninguna fuente, la respuesta es "fuera de alcance: no se implementa";
             (c) si varias opciones son compatibles con las fuentes, elige la de mayor calidad, escalabilidad, mantenibilidad, seguridad y mejores prácticas de Go y de este proyecto, sin atajos ni ñapas, y explica la alternativa rechazada;
             (d) si la pregunta afecta a alcance, frontera humana, privacidad, términos de uso de una fuente, reglas de anomalías o a una decisión cerrada de CLAUDE.md, NO escales: elige la lectura CONSERVADORA —la que menos comportamiento añade y menos compromete; lo dudoso no se implementa y va a "Fuera de alcance"— y marca conservadora=true. La persona lo verá en el informe final y, si no era lo que quería, corregirá la entrada y relanzará.
          3. Escribe <feature_dir>/gates/clarify-respuestas.json con este formato exacto, una entrada por pregunta y los mismos ids:
             {"respuestas":[{"id":"Q1","opcion":"A","respuesta":"…","criterio":"a|b|c|d|e","fuente":"…","alternativa_rechazada":"…","conservadora":false,"impacto":"comportamiento|alcance|skill|interno"}]}
             "impacto" dice qué cambia la respuesta y ordena el informe final: comportamiento (lo que ve quien usa el binario: salida, códigos de salida, ficheros, argumentos o banderas), alcance (qué entra en el hito o queda fuera), skill (lo que una skill pide, dice o comprueba) o interno (nada observable); si caben varios, el primero de esta lista.
             Si preguntas está vacío, escribe {"respuestas":[]}.
          No modifiques ningún otro fichero. No preguntes ni esperes respuesta.

      - id: check_clarify
        type: shell
        output_format: json
        timeout: 30
        run: "scripts/workflow/clarify.sh comprobar"

  - id: completar_clarify
    type: shell
    output_format: json
    timeout: 30
    run: "scripts/workflow/clarify.sh completar"

  - id: integrar_clarify
    type: if
    condition: "{{ steps.completar_clarify.output.data.n > 0 }}"
    then:
      - id: clarify_integrar
        command: speckit.clarify
        model: "{{ inputs.modelo_analisis }}"
        input:
          args: |
            MODO AUTÓNOMO, FASE 2 (integración). No generes preguntas nuevas ni esperes respuesta. Las preguntas están en <feature_dir>/gates/clarify-preguntas.json y las respuestas ya decididas en <feature_dir>/gates/clarify-respuestas.json (localiza <feature_dir> en .specify/feature.json). Trata cada par como una pregunta ya aceptada por el usuario y aplica tus reglas de integración incremental:
            - en ## Clarifications, una línea por pregunta: "- Q: <pregunta> → A: <respuesta> (auto: criterio <criterio>; fuente: <fuente>)", y "(auto: conservadora; …)" cuando la respuesta lleve conservadora=true;
            - actualiza las secciones afectadas del spec y elimina los [NEEDS CLARIFICATION] resueltos;
            - lo respondido con "no se implementa" va a "## Fuera de alcance";
            - lo respondido con criterio "e" (no material) no añade nada al spec aparte de su línea en ## Clarifications: lo cubre la regla genérica;
            - actualiza checklists/requirements.md.
            Termina con el informe de cobertura.

  # ================================================================ gate de entrada del spec: mecánico → juez → corrector; el único rechazo posible del run
  - id: iniciar_gate_spec
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh iniciar spec"

  - id: ronda_spec
    type: do-while
    max_iterations: 4
    condition: "{{ steps.leer_gate_spec.output.data.seguir }}"
    steps:
      # Desde la segunda ronda, lo que cambió la corrección anterior (ADR 0028, convergencia).
      - id: cambios_spec
        type: shell
        timeout: 30
        run: "scripts/workflow/gate.sh cambios spec"

      - id: precheck_spec
        type: shell
        timeout: 60
        run: "scripts/workflow/precheck.sh spec"

      - id: juez_spec
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 3600
        prompt: |
          Eres el JUEZ DE ENTRADA del spec del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica la sección «Criterio de decisión autónoma» y la sección «Gates» de .specify/memory/constitution.md, con su umbral de materialidad, su criterio de uso, sus umbrales que se cumplen y su regla de convergencia (ADR 0028 y 0029).
          Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, checklists/, gates/clarify-*.json, gates/spec-precheck.txt (defectos mecánicos: cada uno es un incumplimiento) y, si existen, gates/spec-pendiente.md y gates/spec-correccion-r*.diff; la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md; CLAUDE.md; la constitución; y la SKILL.md de cada skill que consumirá lo que el hito entrega.
          Rúbrica (cada criterio se evalúa cumple/no cumple con evidencia citada del artefacto):
            a. alcance: el spec cubre el hito completo y nada más que el hito; tampoco especifica caso a caso estados o entradas que no pasan el umbral de materialidad;
            b. fuera_de_alcance: todo lo no especificado en hito, CLAUDE.md, refs/ o constitución está listado en "## Fuera de alcance";
            c. clarificaciones: cada respuesta de clarify-respuestas.json está reflejada en el spec y en Clarifications, y las conservadoras dejan fuera exactamente lo dudoso;
            d. aceptacion: los criterios de "Aceptación" y "Controles" del hito están en el spec, medibles, en forma Dado/Cuando/Entonces o como condición con umbral;
            e. decisiones_cerradas: ninguna decisión cerrada de CLAUDE.md se reabre ni contradice;
            f. checklist_veraz: cada marca [x] de checklists/ es cierta (cita el requisito que la satisface);
            g. sin_implementacion: el spec no fija tecnología ni diseño (eso es del plan);
            h. derivable: de cada requisito se puede derivar un test que lo distinga —sin términos con dos lecturas razonables, sin requisitos contradictorios, sin huecos de comportamiento (errores, límites, estados vacíos) que el spec implique y no defina—. Una ambigüedad o un hueco solo incumple si pasa el umbral de materialidad; una contradicción entre requisitos incumple siempre;
            i. uso: de fuera adentro, cada salida del hito que consume una skill o una persona (un verbo, los campos de su `data`, sus hallazgos o avisos, un fichero) está especificada desde quien la consume: (1) quién la pide y cómo —qué paso de la SKILL.md, cuántas veces por pregunta, qué hace con cada elemento—, trazado a lo que el hito dice que gana la skill; (2) su tamaño con un uso realista sostenido —meses de uso diario: cientos de normas y miles de bloques consultados, la mayoría hace más de una semana—, acotado por lo que necesita la pregunta (filtro, límite o agregación con cota) y no por todo lo acumulado; (3) su pertinencia con el tiempo: qué hace que cada señal deje de darse (una consulta nueva, una fecha, una acción de la skill), sin señales que no caducan nunca ni que se repiten en cada consulta sin información nueva. La evidencia es un cálculo y un recorrido, citando los FR: elementos por invocación × bytes por elemento × invocaciones por pregunta con ese volumen, y qué da cada señal en la consulta siguiente y al cabo de un mes;
            j. umbral_con_control: cada requisito o criterio de éxito con un umbral numérico —un porcentaje, un recuento, un tamaño, un tiempo; «como mucho», «al menos»— que se mide sin persona, en `make ci` o en el cierre (el job de evals u otra comprobación de GitHub Actions que cuenta `medir_cierre`), dice qué control lo hace cumplir: qué comprobación sale en rojo, y cuándo, si la medida pasa del umbral. Publicar la medida para que la lea la persona —en el informe del job, en un registro o en el informe final— no es un control, y la regla de decisión por serie del ADR 0016 (2 de 3 sesiones de cada eval) no lo es de un umbral agregado sobre todas las respuestas de un modelo: admite hasta un 33 % en cada serie. Hacer cumplir un umbral que pide el hito no es alcance añadido: un spec que deja su control en "## Fuera de alcance", o que dice que el umbral «se comprueba en el informe», incumple. El umbral de materialidad se aplica igual: el motivo nombra la vía por la que la medida puede pasar del umbral y la diferencia (la comprobación sale en verde con la medida por encima). Basta con que el spec nombre la comprobación que sale en rojo y cuándo: qué casos, formas o datos mide el control es diseño y lo juzga el plan (criterio o de su juez). No entran aquí un umbral que solo puede medir una persona (un escenario del quickstart) ni uno del repositorio —constitución, Definition of Done, `codecov.yml`— cuyo control vive en configuración que el hito no puede tocar: lo que veas de eso va a observaciones. La evidencia es, por cada umbral, el requisito, dónde se mide y la frase del spec que nombra la comprobación que falla, o su ausencia.
          UMBRAL DE MATERIALIDAD. Una ambigüedad, un hueco o un estado solo es defecto si se cumplen las dos condiciones, y el motivo nombra las dos ("vía: …; diferencia: …"):
            (a) el producto puede llegar a ese estado o recibir esa entrada por una vía real: un emisor que existe en el repositorio o que entrega el hito; un argumento, una bandera o una variable de entorno de quien usa el kit, persona o skill; o un estado que crea el propio binario, incluidas dos invocaciones concurrentes suyas y la interrupción de sus propias escrituras cuando el hito promete atomicidad;
            (b) las lecturas posibles dan un resultado observable distinto para una persona o una skill: otro código de salida, otro contenido de `data` o de la salida legible, otros ficheros creados o cambiados, u otra respuesta de la skill. Que un test pueda distinguirlas no basta.
          No son vías: ficheros del kit modificados, truncados, enlazados, con permisos cambiados o dejados a medias por algo que no es el binario (otra aplicación, una persona a mano); datos de un emisor que todavía no existe; ni lecturas que solo difieren por dentro. Todo eso lo cubre una regla genérica —el binario lo trata como defecto `inesperado` y sale con 1 (ADR 0023), sin prometer bytes, ficheros ni recuperación— y el spec no lo especifica caso a caso. Si ya lo hace, o afirma algo universal que solo falla en un estado así, el motivo es acotarlo a lo alcanzable y remitir a la regla genérica; nunca añadir requisitos, casos límite ni supuestos para ese estado.
          Escribe <feature_dir>/gates/spec.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","criterios":[{"id":"a","criterio":"alcance","cumple":true|false,"evidencia":"…"}],"motivos":["…"],"observaciones":["…"],"entrada":[]}
          "aprobado" solo si TODOS los criterios cumplen. Cada motivo empieza por las letras de los criterios que incumple, p. ej. "[h] …", y dice qué cambiar y dónde; los de h llevan su vía y su diferencia, los de i su cálculo, y los de j el umbral, dónde se mide y qué comprobación tendría que salir en rojo. Todo lo que un corrector pueda arreglar sin decidir por la persona va a motivos, incluidos los asuntos de alcance, frontera humana, privacidad o TOS: el corrector aplica la lectura conservadora. "observaciones" recoge, una línea cada una, lo que viste y no llega a motivo por el umbral de materialidad o por la convergencia: no cuenta para el veredicto ni llega al corrector.
          RECHAZO DE ENTRADA. Es la única forma de devolver el spec a la persona antes del informe final, y solo por estos tres tipos, cada uno demostrado con el fragmento exacto:
            - "contradiccion": dos requisitos que no pueden cumplirse a la vez, en la propia sección del hito;
            - "sin_criterio_comprobable": un requisito central del hito del que no se puede derivar ningún test ni con la lectura conservadora;
            - "objetivo_vacio": tras cerrar las ambigüedades de forma conservadora no queda nada del objetivo principal del hito (p. ej., todo lo que pide cae al otro lado de la frontera humana).
          Para cada uno añade a "entrada" {"tipo":"contradiccion|sin_criterio_comprobable|objetivo_vacio","requisito":"FR-…","fragmento":"…","por_que":"por qué impide derivar un test","pregunta":"pregunta cerrada para la persona"}. Si no hay ninguno, "entrada" es []. No uses "entrada" para nada que un corrector pueda resolver.
          Revisión exhaustiva dentro del umbral: evalúa cada criterio contra todos los artefactos y enumera en motivos todos los incumplimientos, no solo el primero de cada criterio; cada defecto que quede para otra ronda cuesta una corrección y un juicio más, y cada motivo por debajo del umbral añade texto que abre huecos nuevos.
          CONVERGENCIA. Si gates/spec.json ya existe, es el veredicto de la ronda anterior: léelo antes de sobrescribirlo y comprueba primero que cada motivo anterior está corregido; el que no lo esté se repite. El gates/spec-correccion-r<n>.diff de n mayor es exactamente lo que cambió la última corrección. Un motivo NUEVO —que no estaba en el veredicto anterior— solo cuenta si lo introdujo esa corrección (está en su diff) o si es material: pasa el umbral de materialidad, el criterio de uso o el de umbrales (j), o sin él el producto haría algo distinto de lo que pide el hito (contradicción, alcance, decisión cerrada, requisito sin test posible). Cualquier otro hallazgo nuevo —una referencia, una redacción, una nota de checklist— va a observaciones: pudo verse en la ronda anterior y reabrirlo ahora solo alarga el gate.
          Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_gate_spec
        type: shell
        output_format: json
        timeout: 30
        run: "scripts/workflow/gate.sh leer spec 4"

      - id: corregir_spec
        type: if
        condition: "{{ steps.leer_gate_spec.output.data.corregir }}"
        then:
          - id: corrector_spec
            type: prompt
            model: "{{ inputs.modelo_redaccion }}"
            timeout: 3600
            prompt: |
              Eres el CORRECTOR del spec del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Un juez independiente ha rechazado el spec; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/spec.json (criterios con cumple=false y motivos), gates/spec-precheck.txt (defectos mecánicos), spec.md, checklists/, la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md, CLAUDE.md y .specify/memory/constitution.md.
              Para cada criterio incumplido y cada defecto mecánico, corrige spec.md y/o checklists/ con la mejor solución posible, sin atajos: nunca marques un ítem de checklist sin que el spec lo satisfaga. Un motivo describe un caso de un defecto: identifica la clase de error que lo causa, búscala en todo el spec y corrígela en cada aparición que pase el umbral de materialidad de la constitución («Gates»; ADR 0028), no solo en la línea citada, y en ninguna más: no añadas requisitos, casos límite ni supuestos para estados o entradas a los que el producto no puede llegar o cuyas lecturas no cambian nada que vea una persona o una skill; si el spec ya los enumera, sustitúyelos por la regla genérica (defecto `inesperado`, código 1, ADR 0023). Entre dos correcciones que resuelven el motivo, elige la que deja el spec más corto: acotar una afirmación, remitir a la regla genérica o quitar lo que nada exige antes que añadir casos.
              Un motivo de uso ([i]) se corrige desde quien consume la salida: se acota a lo que la pregunta necesita y cada señal dice cuándo deja de darse, con la opción que menos comportamiento añade dentro del objetivo del hito. Un motivo de umbral ([j]) se corrige en el requisito: dice qué comprobación sale en rojo si la medida pasa del umbral (el job de evals falla, un test de `make ci` falla) y sale de "## Fuera de alcance" lo que excluya ese control; nunca se rebaja ni se retira un umbral que pide el hito, ni se deja solo publicado o informativo, porque hacer cumplir un umbral del hito no es alcance añadido (constitución, «Criterio de decisión autónoma», punto 2; ADR 0029). Las "observaciones" del veredicto no se aplican.
              Si un motivo toca alcance, frontera humana, privacidad, términos de uso, anomalías o una decisión cerrada, aplica la lectura conservadora (lo dudoso no se implementa y va a "## Fuera de alcance"). Anota en <feature_dir>/gates/supuestos.md cada lectura conservadora y cada corrección de uso o de umbral, con una línea "- [impacto] corrector_spec: <motivo> → <lo que quedó fuera o se decidió, y por qué>", donde impacto es comportamiento (lo que ve quien usa el binario: salida, códigos, ficheros, argumentos), alcance (qué entra o queda fuera), skill (lo que una skill pide, dice o comprueba) o interno (nada observable); si caben varios, el primero de esta lista.
              No modifiques gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

  - id: check_gate_spec
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh cerrar spec {{ inputs.hito }}"

  # ================================================================ plan
  - id: plan
    command: speckit.plan
    model: "{{ inputs.modelo_decision }}"
    input:
      args: |
        MODO AUTÓNOMO: no preguntes ni esperes respuesta; resuelve dudas técnicas con la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md y déjalas documentadas en research.md (decisión, alternativas, por qué).
        Restricciones para este hito {{ inputs.hito }}:
        - Toda afirmación sobre el comportamiento de una herramienta o dependencia externa (acciones de CI, linters, escáneres, toolchain de Go) se verifica contra su código o documentación disponibles en local (module cache, `go doc`, `go help`, la propia herramienta con `--help`) y research.md cita dónde se comprobó. Lo que no puedas verificar sin red se declara como supuesto no verificado, no como hecho.
        - Cada escenario de quickstart.md debe poder ejecutarse tal cual: órdenes, rutas, flags y datos de prueba reales, y sin efectos colaterales en el árbol de trabajo, el índice ni el historial de git más allá de lo que el escenario declara.
        - Stack y dependencias: solo las fijadas en la constitución (§V) y en docs/ROADMAP.md §3; cualquier otra va a Complexity Tracking con justificación o no se usa.
        - Estructura: la de docs/ROADMAP.md §2 y CLAUDE.md. Reglas de dependencia entre paquetes obligatorias.
        - Rellena el Constitution Check con un ítem por principio (I-IX) y por regla de dependencia, indicando cómo lo cumple este hito. Si un gate falla sin justificación, corrígelo en el plan.
        - Enumera en el plan los controles mecánicos que este hito añade o toca (objetivos de make, tests de contrato, fixtures) según la sección «Gates» de la constitución.
        - Aceptación e2e (ADR 0018): una línea "Aceptación e2e:" que diga qué guiones testscript describen la entrega del hito, uno o varios por historia de usuario, y qué FR/SC cubre cada uno; los escribirá la primera tarea en <feature_dir>/aceptacion/ y quedarán congelados. Si el hito no tiene comportamiento visible del binario, "Aceptación e2e: no aplica" con el motivo (las evals de la skill, si las hay, son entonces su aceptación).
        - Datos externos (ADR 0018): el ejecutor nunca toca la red. Todo dato de una fuente externa —respuestas que reproducen los tests o material de origen de un fichero de data/— se obtiene en el paso determinista grabar_datos del workflow, y solo de fuentes con fila en docs/SOURCES.md de main con «Revisado» fechado. Para cada una, el plan nombra el manifiesto <paquete>/testdata/grabaciones.json (con "fuente") y el test //go:build grabacion TestGrabar* que pide con internal/httpx y deja las respuestas en testdata/ del paquete y el material de origen en $KITLEGAL_EVIDENCIAS (evidencias/<hito>/). Los ficheros de data/ derivados de ese material los produce código del repositorio, de forma reproducible; nunca se escriben a mano ni de memoria. Una fuente sin fila revisada en main queda fuera de alcance (anótalo en research.md).
        - Nada del plan lo hace una persona a mitad del run, ni una tarea del hito publica la rama, abre la propuesta de cambio o mide CI y evals remotas: eso lo hace el workflow tras la revisión final.
        - Aplica las skills golang-* instaladas (golang-how-to orquesta) al decidir layout, tests, lint y CLI.
        - De fuera adentro (criterio m del juez): el contrato de cada salida que consume una skill o una persona da su forma, un ejemplo con sus bytes, su tamaño con meses de uso (cientos de normas y miles de bloques consultados) y las invocaciones por pregunta que hará la SKILL.md, y la condición que apaga cada señal.
        - Proporcional (criterio n del juez; constitución V): la solución más simple que cumple el spec. Cada mecanismo —paquete, tipo o función exportada, fichero, estado del disco que se trata aparte, opción, test de un caso límite— se traza a un FR/SC que lo exige, y nada se diseña, se mide, se declara ni se prueba para estados que no pasan el umbral de materialidad (constitución, «Gates»): los cubre la regla genérica, defecto `inesperado` con código 1.
        - Controles de umbral (criterio o del juez; ADR 0029): una sección "## Controles de umbral" con la tabla `| Requisito | Umbral | Control | Dónde |` y una fila por cada requisito o criterio de éxito con un umbral que se mide sin persona, en `make ci` o en el cierre. «Dónde» es `ci:<ruta>` o `ci:<ruta>:<Test>` —un test o una comprobación que ejecuta `make ci`; <Test>, una función Go o un objetivo del Makefile— o `evals:<skill>:<nombre>` —un umbral que el job de evals publica en `umbrales` de su informe.json con `decide: true`, contrato del ADR 0029—; el informe final lo lee sin modelo para decir si cada uno está comprobado. Sin umbrales, "Ninguno." y el motivo. Un control que solo publica la medida no es un control.
        - Lo que no esté en el spec no entra en el plan.
        - Antes de dar por terminado, comprueba plan.md, research.md, quickstart.md y contracts/ contra la rúbrica del paso `juez_plan` de .specify/workflows/hito/workflow.yml y contra scripts/workflow/precheck.sh (fase plan), y corrige lo que no cumpla.

  - id: iniciar_gate_plan
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh iniciar plan"

  - id: ronda_plan
    type: do-while
    max_iterations: 4
    condition: "{{ steps.leer_gate_plan.output.data.seguir }}"
    steps:
      - id: cambios_plan
        type: shell
        timeout: 30
        run: "scripts/workflow/gate.sh cambios plan"

      - id: precheck_plan
        type: shell
        timeout: 60
        run: "scripts/workflow/precheck.sh plan"

      - id: juez_plan
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 3600
        prompt: |
          Eres el JUEZ del plan del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica las secciones «Criterio de decisión autónoma» y «Gates» de .specify/memory/constitution.md, con su umbral de materialidad, su criterio de uso, la proporcionalidad, los umbrales que se cumplen y la regla de convergencia (ADR 0028 y 0029).
          Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, plan.md, research.md, data-model.md, contracts/, quickstart.md (los que existan), gates/plan-precheck.txt (defectos mecánicos: cada uno es un incumplimiento) y, si existen, gates/plan-pendiente.md y gates/plan-correccion-r*.diff; la constitución; CLAUDE.md; docs/ROADMAP.md §2-§3 y la sección "#### {{ inputs.hito }} ·"; docs/SOURCES.md; y la SKILL.md de cada skill que consumirá lo que el hito entrega.
          Rúbrica (cumple/no cumple con evidencia):
            a. constitution_check: completo, un ítem por principio y regla de dependencia, y veraz;
            b. dependencias: ninguna fuera de la lista fijada sin justificación en Complexity Tracking;
            c. reglas_dependencia: la estructura propuesta respeta qué paquete importa qué (core sin adaptadores; net/http solo en httpx; SQLite solo en cache/store/graph; os.Exit solo en cli/cmd; stdout solo en render);
            d. errores_exit_codes: errores tipados que mapean a los exit codes estables;
            e. tests_primero: el plan nombra los guiones de aceptación e2e congelados (o "no aplica" con motivo), los unitarios, los fixtures y los controles mecánicos que añade;
            f. alcance: nada fuera del spec;
            g. sin_atajos: ningún nolint, test saltado, TODO diferido o error silenciado previsto;
            h. mejor_alternativa: si hay varias opciones técnicas, la elegida es la de mayor calidad y escalabilidad y research.md documenta la rechazada;
            i. afirmaciones_verificadas: cada afirmación sobre el comportamiento de una herramienta o dependencia externa está comprobada contra su código o documentación en local (compruébalo tú también) y research.md cita dónde, o figura como supuesto no verificado;
            j. quickstart_ejecutable: cada escenario de quickstart.md funciona tal cual y no deja efectos colaterales más allá de lo que declara;
            k. datos_externos: todo dato externo sale del paso grabar_datos (manifiesto con fuente + test de grabación), solo de fuentes con fila revisada en docs/SOURCES.md de main, y lo derivado a data/ lo produce código; nada lo escribe o lo descarga una persona ni se escribe de memoria;
            l. autonomia: nada del plan exige a una persona a mitad del run ni publica o mide en la plataforma desde una tarea;
            m. uso: de fuera adentro, el contrato de cada salida que consume una skill o una persona da su forma y un ejemplo, y el plan calcula su tamaño con un uso realista sostenido —meses de uso diario: cientos de normas y miles de bloques consultados, la mayoría hace más de una semana— con los bytes por elemento del ejemplo, las invocaciones por pregunta que hará la SKILL.md y la condición que apaga cada señal; el diseño lo acota a lo que necesita la pregunta, no a todo lo acumulado, y no deja señales que no caducan nunca ni que se repiten en cada consulta sin información nueva. Rehaz tú el cálculo. Si la causa está en el spec (un requisito que obliga a la salida que no pasa), el motivo dice qué requisito cambiar: el corrector del plan puede tocar spec.md solo para eso;
            n. proporcionalidad (constitución V, YAGNI): la solución es la más simple que cumple el spec; cada mecanismo del plan —paquete, tipo o función exportada, fichero, estado del disco que se trata aparte, opción, paso, test de un caso límite, supuesto o desviación declarada— se traza a un FR/SC que lo exige, y ninguno existe solo para un estado o una entrada que no pasa el umbral de materialidad. Lo que no se traza es motivo: quitarlo. La evidencia es el mecanismo y su FR, o la falta de FR;
            o. controles_de_umbral: la sección "## Controles de umbral" de plan.md tiene una fila por cada requisito o criterio de éxito con un umbral que se mide sin persona, en `make ci` o en el cierre —cotéjala con el spec y con los umbrales que añada el propio plan—, y cada fila dice dónde vive el control que pone en rojo esa comprobación cuando la medida pasa del umbral: `ci:<ruta>` o `ci:<ruta>:<Test>` para un test o una comprobación que ejecuta `make ci`, o `evals:<skill>:<nombre>` para un umbral que el job de evals publica en `umbrales` de su informe.json con `decide: true`, que pone su veredicto en fallo (contrato del ADR 0029). Rehaz el recorrido de cada uno: con la medida por encima del umbral, ¿qué sale en rojo, y lo ve `verificar` (`make ci`) o `medir_cierre`? El control mide el umbral en cada forma que promete el requisito (con y sin argumentos, cada modelo, cada ámbito). Incumplen un control que solo publica la medida, un umbral del job con `decide: false`, la regla por serie del ADR 0016 en lugar de un umbral agregado, y un umbral del spec que el plan no recoge o deja para que lo lea la persona. Que falte la sección entera ya es un defecto del precheck: no lo repitas como motivo y juzga igual el resto del plan. Si la causa está en el spec (deja el control fuera de alcance, o dice que el umbral se comprueba en el informe), el motivo dice qué requisito cambiar: el corrector del plan puede tocar spec.md para eso. Como en el criterio j del spec, el umbral de materialidad se aplica igual, y no entran un umbral que solo mide una persona ni uno del repositorio cuyo control vive en configuración que el hito no toca (a observaciones).
          UMBRAL DE MATERIALIDAD (se aplica a todo motivo sobre un estado, una entrada, una ambigüedad o una afirmación): solo es defecto lo que (a) el producto puede alcanzar por una vía real —un emisor que existe o que entrega el hito; un argumento, una bandera o una variable de quien usa el kit; o un estado que crea el propio binario, incluidas sus invocaciones concurrentes y la interrupción de sus propias escrituras si el hito promete atomicidad— y (b) da un resultado observable distinto para una persona o una skill: código de salida, `data`, salida legible, ficheros creados o cambiados, respuesta de la skill. El motivo nombra las dos ("vía: …; diferencia: …"). Ficheros del kit tocados por algo que no es el binario (otra aplicación, una persona a mano: truncados, con permisos cambiados, enlazados, con auxiliares ajenos), datos de un emisor que todavía no existe y diferencias solo internas no son vías: los cubre una regla genérica —defecto `inesperado`, código 1 (ADR 0023)—. Una afirmación del plan que solo falla en un estado así no es un defecto de verificación (criterio i); si el plan promete, mide, declara o prueba algo sobre ese estado, el motivo es retirarlo y remitir a la regla genérica (criterio n), nunca medirlo mejor ni declararlo con más detalle.
          Escribe <feature_dir>/gates/plan.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","criterios":[{"id":"a","criterio":"constitution_check","cumple":true|false,"evidencia":"…"}],"motivos":["…"],"observaciones":["…"]}
          "aprobado" solo si TODOS cumplen. Cada motivo empieza por las letras de los criterios que incumple, p. ej. "[n] …", y dice qué cambiar y dónde. Un asunto de alcance, frontera humana, privacidad o TOS también es un motivo: el corrector aplica la lectura conservadora. "observaciones" recoge, una línea cada una, lo que viste y no llega a motivo por el umbral de materialidad o por la convergencia: no cuenta para el veredicto ni llega al corrector.
          Revisión exhaustiva dentro del umbral: evalúa cada criterio contra todos los artefactos y enumera en motivos todos los incumplimientos, no solo el primero de cada criterio.
          CONVERGENCIA. Si gates/plan.json ya existe, es el veredicto de la ronda anterior: léelo antes de sobrescribirlo y comprueba primero que cada motivo anterior está corregido; el que no lo esté se repite. El gates/plan-correccion-r<n>.diff de n mayor es exactamente lo que cambió la última corrección. Un motivo NUEVO —que no estaba en el veredicto anterior— solo cuenta si lo introdujo esa corrección (está en su diff) o si es material: pasa el umbral de materialidad, el criterio de uso o el de umbrales (o), o sin él se construiría algo distinto de lo que pide el spec o algo que no se traza a él. Cualquier otro hallazgo nuevo —una referencia de línea, una redacción, una cifra que no cambia el diseño— va a observaciones.
          Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_gate_plan
        type: shell
        output_format: json
        timeout: 30
        run: "scripts/workflow/gate.sh leer plan 4"

      - id: corregir_plan
        type: if
        condition: "{{ steps.leer_gate_plan.output.data.corregir }}"
        then:
          - id: corrector_plan
            type: prompt
            model: "{{ inputs.modelo_decision }}"
            timeout: 3600
            prompt: |
              Eres el CORRECTOR del plan del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Un juez independiente ha rechazado el plan; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/plan.json (criterios con cumple=false y motivos), gates/plan-precheck.txt, plan.md, research.md, data-model.md, contracts/, quickstart.md, spec.md, .specify/memory/constitution.md, CLAUDE.md y docs/ROADMAP.md §2-§3.
              Para cada criterio incumplido y cada defecto mecánico, corrige plan.md/research.md/data-model.md/contracts/quickstart.md con la mejor solución posible, sin atajos. Un motivo describe un caso de un defecto: identifica la premisa o la clase de error que lo causa, búscala en todos los artefactos del plan y corrígela en cada aparición que pase el umbral de materialidad de la constitución («Gates»; ADR 0028), no solo en la línea citada, y en ninguna más: no diseñes, midas, declares ni pruebes nada para estados o entradas a los que el producto no puede llegar o cuyas lecturas no cambian nada que vea una persona o una skill; si el plan ya lo hace, sustitúyelo por la regla genérica (defecto `inesperado`, código 1, ADR 0023). Entre dos correcciones que resuelven el motivo, elige la que deja el diseño más simple: acotar una afirmación, remitir a la regla genérica o quitar un mecanismo que no se traza a un FR antes que añadir casos, filas de verificación o desviaciones declaradas.
              Un motivo de uso ([m]) se corrige desde quien consume la salida: se acota a lo que la pregunta necesita y cada señal dice cuándo deja de darse, con la opción que menos comportamiento añade dentro del objetivo del hito. Un motivo de umbral ([o]) se corrige con su fila de "## Controles de umbral" y el diseño del control que la respalda: el test o la comprobación de `make ci`, o el umbral del job de evals con `decide: true` y el cambio de su veredicto; nunca se rebaja ni se retira un umbral que pide el hito, ni se deja solo publicado. Si la causa de un motivo de uso o de umbral es un requisito del spec, corrige ese requisito en spec.md (y lo que dependa de él en checklists/): es lo único del spec que este paso puede tocar. Las "observaciones" del veredicto no se aplican.
              Si un motivo toca alcance, frontera humana, privacidad, términos de uso, anomalías o una decisión cerrada, aplica la lectura conservadora (no se implementa); hacer cumplir un umbral que pide el hito no es alcance añadido (ADR 0029). Anota en <feature_dir>/gates/supuestos.md cada lectura conservadora y cada decisión de uso o de umbral, con una línea "- [impacto] corrector_plan: <motivo> → <decisión>", donde impacto es comportamiento (lo que ve quien usa el binario: salida, códigos, ficheros, argumentos), alcance (qué entra o queda fuera), skill (lo que una skill pide, dice o comprueba) o interno (nada observable); si caben varios, el primero de esta lista.
              No modifiques gates/*.json, ni spec.md salvo por un motivo de uso o de umbral cuya causa esté en él. Escribe en español. No preguntes; no esperes respuesta.

  - id: check_gate_plan
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh cerrar plan {{ inputs.hito }}"

  - id: commit_artefactos_plan
    type: shell
    timeout: 120
    run: |
      set -eu
      git add -A
      git diff --cached --quiet && { echo "nada que commitear"; exit 0; }
      git commit -q -m "docs({{ inputs.hito }}): spec, clarificaciones y plan del hito"
      git log --oneline -1

  # ================================================================ tasks + analyze
  - id: tasks
    command: speckit.tasks
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO AUTÓNOMO: no preguntes. Genera tasks.md siguiendo docs/ROADMAP.md §6 (ritual por hito) con estas reglas, porque las tareas se ejecutarán y verificarán UNA A UNA por un proceso automático con un guardián de diff y sin ninguna persona hasta el informe final (ADR 0018):
        - T001 es la única tarea [aceptacion] (salvo que plan.md diga "Aceptación e2e: no aplica"): escribe, a partir del spec y sin código de producto, los guiones testscript de la entrega en <feature_dir>/aceptacion/*.txtar (cada guion nombra en un comentario los FR/SC que cubre) y, si el hito entrega o cambia una skill, sus evals en evals/<skill>/. El workflow comprueba que cada guion falla hoy por una aserción y después los congela: ninguna tarea posterior puede tocarlos. Los guiones afirman solo lo que el spec fija: nada que el spec deje sin definir por no pasar el umbral de materialidad de la constitución («Gates»). Al terminar el bucle se activan en internal/app/testdata/script/ y `make ci` tiene que pasarlos.
        - Cada tarea es una rebanada vertical que deja `make ci` en verde al terminar: incluye su test (unitario, integración o e2e) y la implementación mínima que lo hace pasar. No separes "escribir el test" e "implementar" en tareas distintas salvo que el test cubra código ya existente.
        - Orden estrictamente ejecutable en secuencia: ninguna tarea depende de una posterior. En H0, la primera tarea tras la aceptación entrega el Makefile y los gates.
        - Formato de línea obligatorio: "- [ ] T001 [P] [US1] Descripción" con TODAS las rutas que la tarea va a crear o modificar (ficheros o directorios, p. ej. internal/cli/, cmd/kitlegal/main.go, Makefile, .gitleaksignore). El guardián rechaza cualquier fichero fuera de esas rutas; go.mod, go.sum, CHANGELOG.md y el directorio del feature siempre están permitidos, y declarar x.go permite x_test.go.
        - Toda tarea que cree o modifique ficheros bajo testdata/ o schemas/ lleva la etiqueta [datos] y no mezcla otro trabajo. Los datos externos los graba el paso grabar_datos del workflow, sin modelo, justo después del commit de la tarea [datos] que deja el manifiesto <paquete>/testdata/grabaciones.json (con "fuente") y su test //go:build grabacion TestGrabar*; la tarea siguiente ya parte de las grabaciones. Ninguna tarea usa la red, KITLEGAL_RECORD ni escribe en evidencias/, y ningún fichero de data/ se escribe a mano: lo produce código a partir de lo grabado.
        - Ninguna tarea la hace, la revisa o la desbloquea una persona, y ninguna publica la rama, abre la propuesta de cambio o mide CI y evals remotas: el workflow hace el cierre tras la revisión final. No existe la etiqueta [plataforma].
        - Ids T001, T002… únicos y correlativos; una tarea por línea.
        - Incluye tareas explícitas para cada punto de la Definition of Done (§1) que aplique al hito: CHANGELOG.md, ADR, docs/SOURCES.md, schemas, fixtures.
        - Cada fila de "## Controles de umbral" de plan.md tiene la tarea que construye su control, con un test que lo ve fallar cuando la medida pasa del umbral (ADR 0029).
        - Ninguna tarea fuera del spec.
        - Antes de dar por terminado, comprueba tasks.md contra la rúbrica del paso `juez_tasks` de .specify/workflows/hito/workflow.yml y contra scripts/workflow/precheck.sh (fase tasks), y corrige lo que no cumpla.

  - id: analyze
    command: speckit.analyze
    model: "{{ inputs.modelo_analisis }}"
    input:
      args: |
        MODO AUTÓNOMO: no preguntes ni ofrezcas remediaciones para después. Además de mostrar el informe, escríbelo íntegro en <feature_dir>/gates/analyze.md (localiza <feature_dir> con .specify/feature.json).

  - id: iniciar_gate_tasks
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh iniciar tasks"

  - id: ronda_tasks
    type: do-while
    max_iterations: 4
    condition: "{{ steps.leer_gate_tasks.output.data.seguir }}"
    steps:
      - id: cambios_tasks
        type: shell
        timeout: 30
        run: "scripts/workflow/gate.sh cambios tasks"

      - id: precheck_tasks
        type: shell
        timeout: 60
        run: "scripts/workflow/precheck.sh tasks"

      - id: juez_tasks
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 3600
        prompt: |
          Eres el JUEZ de consistencia (spec ↔ plan ↔ tasks) del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica las secciones «Criterio de decisión autónoma» y «Gates» de .specify/memory/constitution.md.
          Lee .specify/feature.json para localizar <feature_dir>; lee gates/analyze.md, gates/tasks-precheck.txt (defectos mecánicos: cada uno es un incumplimiento), spec.md, plan.md, tasks.md, quickstart.md, checklists/ y, si existen, gates/tasks-pendiente.md y gates/tasks-correccion-r*.diff.
          Rúbrica (cumple/no cumple con evidencia):
            a. analisis_critico: ningún hallazgo CRITICAL o HIGH de analyze.md sigue sin resolver en los artefactos;
            b. trazabilidad: toda tarea traza a un requisito del spec (cita sus FR/SC), todo requisito tiene tareas y cada fila de "## Controles de umbral" de plan.md tiene la tarea que construye su control, con un test que lo ve fallar cuando la medida pasa del umbral (ADR 0029);
            c. rebanadas_verdes: cada tarea incluye test e implementación y puede dejar `make ci` en verde por sí sola; el orden es ejecutable en secuencia;
            d. rutas_declaradas: cada tarea declara todas las rutas que tocará (ficheros o directorios), sin rutas genéricas tipo "internal/";
            e. datos_separados: las tareas que tocan testdata/ o schemas/ llevan [datos] y no mezclan otro trabajo; los datos externos salen de un manifiesto y un test de grabación, nunca de la red, de una persona ni de la memoria;
            f. dod: existen tareas para cada punto aplicable de la Definition of Done (CHANGELOG, ADR, SOURCES.md, schemas, fixtures);
            g. checklist_veraz: cada marca [x] de checklists/ es cierta;
            h. aceptacion_primero: T001 es la tarea [aceptacion] y sus guiones cubren los escenarios de aceptación del spec (o el plan justifica "no aplica");
            i. autonomia: ninguna tarea exige a una persona, publica la rama, abre la propuesta de cambio ni mide CI o evals remotas.
          Escribe <feature_dir>/gates/tasks.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","criterios":[{"id":"a","criterio":"analisis_critico","cumple":true|false,"evidencia":"…"}],"motivos":["…"],"observaciones":["…"]}
          "aprobado" solo si TODOS cumplen. Motivos concretos: qué cambiar, en qué artefacto. "observaciones" recoge lo que viste y no llega a motivo por la convergencia: no cuenta para el veredicto ni llega al corrector.
          Revisión exhaustiva: evalúa cada criterio contra todos los artefactos (incluido quickstart.md cuando una tarea ejecute sus escenarios) y enumera en motivos TODOS los incumplimientos.
          CONVERGENCIA (ADR 0028). Si gates/tasks.json ya existe, es el veredicto de la ronda anterior: léelo antes de sobrescribirlo y comprueba primero que cada motivo anterior está corregido; el que no lo esté se repite. El gates/tasks-correccion-r<n>.diff de n mayor es exactamente lo que cambió la última corrección. Un motivo NUEVO solo cuenta si lo introdujo esa corrección o si es material: sin él una tarea no se puede ejecutar, verificar ni trazar, o se construiría algo distinto de lo que pide el spec. Cualquier otro hallazgo nuevo va a observaciones.
          Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_gate_tasks
        type: shell
        output_format: json
        timeout: 30
        run: "scripts/workflow/gate.sh leer tasks 4"

      - id: corregir_tasks
        type: if
        condition: "{{ steps.leer_gate_tasks.output.data.corregir }}"
        then:
          - id: corrector_tasks
            type: prompt
            model: "{{ inputs.modelo_redaccion }}"
            timeout: 3600
            prompt: |
              Eres el CORRECTOR de artefactos del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Un juez independiente ha rechazado la consistencia spec/plan/tasks; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/tasks.json (criterios con cumple=false y motivos), gates/tasks-precheck.txt, gates/analyze.md, spec.md, plan.md, tasks.md, quickstart.md y checklists/.
              Para cada criterio incumplido y cada defecto mecánico corrige el artefacto que corresponda (spec, plan, quickstart o tasks) con la mejor solución, sin atajos; nunca marques un checklist sin que el artefacto lo satisfaga. Un motivo describe un caso de un defecto: identifica la clase de error que lo causa, búscala en todos los artefactos y corrígela en cada aparición, no solo en la línea citada. Mantén el formato de tareas ("- [ ] Tnnn … rutas", [datos] para testdata/ y schemas/, [aceptacion] en T001). Una tarea que dependa de una persona se rehace para que la haga código o el paso grabar_datos; si no es posible, lo que pedía queda fuera de alcance y lo anotas en <feature_dir>/gates/supuestos.md ("- [impacto] corrector_tasks: <motivo> → <decisión>", donde impacto es comportamiento, alcance, skill o interno, como define la constitución en «Criterio de decisión autónoma»). Las "observaciones" del veredicto no se aplican.
              No modifiques gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

  - id: check_gate_tasks
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh cerrar tasks {{ inputs.hito }}"

  - id: commit_artefactos_tasks
    type: shell
    timeout: 120
    run: |
      set -eu
      git add -A
      git diff --cached --quiet && { echo "nada que commitear"; exit 0; }
      git commit -q -m "docs({{ inputs.hito }}): tareas y análisis del hito"
      git log --oneline -1

  # ================================================================ implementación tarea a tarea: guardián, aceptación congelada, grabación y cuarentena
  - id: bucle_tareas
    type: do-while
    max_iterations: 400
    condition: "{{ steps.siguiente_tarea.output.data.id != '' or steps.siguiente_tarea.output.data.converger }}"
    steps:
      - id: siguiente_tarea
        type: shell
        output_format: json
        timeout: 120
        run: "scripts/workflow/tarea.sh siguiente {{ inputs.hito }}"

      # Sin tareas pendientes, una sola vez: converge compara el código con los artefactos
      # y añade a tasks.md lo que falte, que el bucle ejecuta después con las mismas reglas.
      - id: converger
        type: if
        condition: "{{ steps.siguiente_tarea.output.data.converger }}"
        then:
          - id: converge
            command: speckit.converge
            model: "{{ inputs.modelo_analisis }}"
            input:
              args: |
                MODO AUTÓNOMO: no preguntes. Compara el código con spec.md, plan.md y tasks.md y añade a tasks.md, con el formato "- [ ] Tnnn … rutas" (ids correlativos, [datos] si toca testdata/ o schemas/), solo el trabajo que falte para cumplir el spec y la Definition of Done (docs/ROADMAP.md §1). Nada fuera del spec. Las tareas de <feature_dir>/gates/cuarentena.json no se tocan ni se duplican: su trabajo está en cuarentena por una causa que su nota explica. Ninguna tarea nueva publica, mide la plataforma remota ni depende de una persona. Es un paso de lectura: no ejecutes `make ci` (su última salida está en <feature_dir>/gates/ci.log), no uses `gh` ni `git push`, no lances subagentes ni esperas programadas; lee el código y los artefactos y escribe las tareas que falten.
          - id: marcar_converge
            type: shell
            timeout: 30
            run: |
              set -eu
              d=$(jq -r .feature_directory .specify/feature.json)
              touch "$d/gates/converge-hecho"
              echo "converge hecho: $(grep -cE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" || true) tareas pendientes"

      - id: tarea
        type: if
        condition: "{{ steps.siguiente_tarea.output.data.id != '' }}"
        then:
          # Primer intento con modelo_implementacion; los reintentos, con modelo_escalada.
          # Mismo prompt (ancla YAML); solo cambian id y modelo. Una iteración de cierre
          # (tarea ya marcada [X] y sin commitear) no implementa nada.
          - id: implementar
            type: if
            condition: "{{ not steps.siguiente_tarea.output.data.cierre }}"
            then:
              - id: implementar_modelo
                type: if
                condition: "{{ steps.siguiente_tarea.output.data.intento < 2 }}"
                then:
                  - &implementar_tarea
                    id: implementar_tarea
                    command: speckit.implement
                    model: "{{ inputs.modelo_implementacion }}"
                    input:
                      args: |
                        MODO AUTÓNOMO. Ejecuta ÚNICAMENTE la tarea {{ steps.siguiente_tarea.output.data.id }} de tasks.md (intento {{ steps.siguiente_tarea.output.data.intento }} de 3; al tercero sin verde entra en cuarentena):
                        {{ steps.siguiente_tarea.output.data.texto }}
                        Si existe <feature_dir>/gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md, léelo antes de empezar: documenta por qué no quedó en verde un intento anterior, con la salida de la verificación.
                        Reglas: el test primero, dentro de la tarea (rojo → verde); sin atajos (nada de nolint sin justificar, tests saltados, TODO diferidos ni errores silenciados); aplica las skills golang-*; no toques ni marques otras tareas. El guardián de diff rechazará cualquier fichero fuera de las rutas declaradas en la tarea (go.mod, go.sum, CHANGELOG.md, el directorio del feature y x_test.go de un x.go declarado siempre están permitidos), cualquier cambio en testdata/ o schemas/ si la tarea no lleva [datos], cualquier escritura en evidencias/, cualquier t.Skip nuevo y cualquier cambio en la suite de aceptación congelada (<feature_dir>/gates/aceptacion-congelada.json): si un guion congelado falla, se arregla el código, nunca el guion.
                        Si la tarea lleva [aceptacion]: escribe los guiones de <feature_dir>/aceptacion/*.txtar desde el spec (un comentario con los FR/SC que cubre cada uno; mismas convenciones que internal/app/testdata/script/) y, si el hito entrega o cambia una skill, sus evals; no escribas código de producto. La verificación exige que cada guion falle HOY por una aserción, no por no poder leerse. No afirmes nada que el spec no fije: lo que deja sin definir por no pasar el umbral de materialidad de la constitución («Gates») no se afirma en ningún guion.
                        Si la tarea lleva [datos] y deja un manifiesto <paquete>/testdata/grabaciones.json: escribe el manifiesto (con "fuente") y el test //go:build grabacion TestGrabar* que lo graba con internal/httpx; tú no grabas nada: el workflow lo graba sin modelo después del commit de esta tarea.
                        Nunca uses KITLEGAL_RECORD, la red, git push ni gh. Nadie va a responder: si aparece una ambigüedad que los gates no cerraron, elige la lectura conservadora (la que menos comportamiento añade), aplícala y añade una línea a <feature_dir>/gates/supuestos.md ("- [impacto] {{ steps.siguiente_tarea.output.data.id }}: <ambigüedad> → <lectura elegida y por qué>", donde impacto es comportamiento si cambia lo que ve quien usa el binario —salida, códigos, ficheros, argumentos—, alcance si deja algo dentro o fuera, skill si cambia lo que una skill pide, dice o comprueba, e interno si no cambia nada observable; si caben varios, el primero). Una ambigüedad sobre un estado al que el producto no puede llegar no se resuelve ni se anota: la cubre la regla genérica de la constitución (defecto `inesperado`, código 1).
                        Al terminar ejecuta `make ci` (si aún no existe el Makefile, `go build ./... && go vet ./... && go test -race ./...`) en primer plano y marca la tarea [X] SOLO si está en verde. Si ya estaba hecha y en verde, limítate a marcarla. Si no consigues verde, déjala [ ] y escribe la causa en <feature_dir>/gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md; si la tarea está mal delimitada (necesita una ruta que no declara), amplía su línea en tasks.md y explícalo en esa nota: el intento siguiente la relee. Las checklists ya fueron verificadas; no preguntes ni esperes respuesta.
                else:
                  - <<: *implementar_tarea
                    id: implementar_tarea_escalada
                    model: "{{ inputs.modelo_escalada }}"

          - id: verificar
            type: shell
            continue_on_error: true
            timeout: 1800
            run: "scripts/workflow/verificar.sh tarea"

          # Verificación en rojo. Ninguna salida para el run:
          #   · tarea REDELIMITADA (sigue [ ] y su nota cambió en este intento): sin reparación
          #     ni commit; el intento siguiente relee la línea con sus rutas y hereda el árbol;
          #   · cualquier otro rojo: `reparar` → verificación; si sigue en rojo, el diagnóstico
          #     va a la nota de la tarea y el intento siguiente (modelo_escalada) parte de ahí.
          #     Tras tres intentos, la tarea entra en cuarentena (scripts/workflow/tarea.sh).
          - id: tras_verificar
            type: if
            condition: "{{ steps.verificar.output.exit_code != 0 }}"
            then:
              - id: redelimitada
                type: shell
                output_format: json
                timeout: 30
                run: "scripts/workflow/tarea.sh redelimitada"

              - id: reparar_tarea
                type: if
                condition: "{{ not steps.redelimitada.output.data.redelimitada }}"
                then:
                  - id: reparar
                    type: prompt
                    model: "{{ inputs.modelo_escalada }}"
                    timeout: 3600
                    prompt: |
                      La verificación determinista falla tras la tarea {{ steps.siguiente_tarea.output.data.id }} ({{ steps.siguiente_tarea.output.data.texto }}) del hito {{ inputs.hito }} de kitlegal. Salida del verificador (final del log; el completo está en <feature_dir>/gates/ci.log, con <feature_dir> en .specify/feature.json):

                      {{ steps.verificar.output.stdout }}

                      Arregla la causa raíz aplicando la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md: nada de desactivar linters, tests o controles; nada de nolint sin justificación en el propio código; nada de silenciar errores ni de saltar tests. Si la línea del log empieza por «guardián:», el fallo es de alcance: deshaz los cambios fuera de las rutas declaradas, en testdata/ o schemas/ sin [datos], en evidencias/ o en la suite de aceptación congelada (esa se respeta siempre: se arregla el código). Si el fallo es un test que legítimamente sigue en rojo porque su implementación pertenece a una tarea posterior, o exige tocar un fichero que la tarea no declara, NO lo arregles: la tarea está mal delimitada; redelimita su línea en tasks.md, anótalo en gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md, deja la tarea como [ ] y termina: el bucle la reintentará con la línea nueva. En cualquier otro caso repite `make ci` en primer plano hasta verde y deja la tarea marcada [X]. No preguntes ni esperes respuesta.

                  - id: verificar_reparacion
                    type: shell
                    continue_on_error: true
                    timeout: 1800
                    run: "scripts/workflow/verificar.sh tarea"

                  - id: reparacion_roja
                    type: if
                    condition: "{{ steps.verificar_reparacion.output.exit_code != 0 }}"
                    then:
                      - id: registrar_fallo
                        type: shell
                        timeout: 30
                        run: "scripts/workflow/tarea.sh fallo"

          # Decide el commit con el estado real de ESTA iteración (última línea de gates/ci.log
          # y la marca de tasks.md), nunca con salidas de pasos que quizá no se ejecutaron.
          - id: estado_cierre
            type: shell
            output_format: json
            timeout: 30
            run: "scripts/workflow/tarea.sh estado"

          - id: cerrar_tarea
            type: if
            condition: "{{ steps.estado_cierre.output.data.commitear }}"
            then:
              - id: commit_tarea
                type: shell
                timeout: 120
                run: "scripts/workflow/tarea.sh commit {{ inputs.hito }}"

              - id: congelar
                type: if
                condition: "{{ steps.siguiente_tarea.output.data.aceptacion }}"
                then:
                  - id: congelar_aceptacion
                    type: shell
                    timeout: 60
                    run: "scripts/workflow/aceptacion.sh congelar"

              # Grabación determinista de datos externos (ADR 0018, opción b): sin modelo, solo
              # de fuentes con fila revisada en docs/SOURCES.md de main. Sustituye a la pausa
              # humana de las tareas [datos]; la persona revisa lo grabado en el informe final.
              - id: grabar
                type: if
                condition: "{{ steps.siguiente_tarea.output.data.datos }}"
                then:
                  - id: grabar_datos
                    type: shell
                    output_format: json
                    timeout: 3600
                    run: "scripts/workflow/grabar-datos.sh grabar {{ inputs.hito }}"

  # ================================================================ la suite congelada entra en make ci
  - id: activar_aceptacion
    type: shell
    timeout: 120
    run: "scripts/workflow/aceptacion.sh activar {{ inputs.hito }}"

  # ================================================================ make ci del hito completo y sus reparaciones
  - id: base_ci
    type: shell
    timeout: 30
    run: "scripts/workflow/global.sh base"

  - id: ci
    type: shell
    continue_on_error: true
    timeout: 1800
    run: "scripts/workflow/verificar.sh global"

  - id: reparar_ci
    type: if
    condition: "{{ steps.ci.output.exit_code != 0 }}"
    then:
      - id: bucle_reparacion
        type: do-while
        max_iterations: 3
        condition: "{{ not steps.cerrar_reparacion.output.data.verde }}"
        steps:
          # La base se fija en cada intento: si el guardián rechaza el tercero, se aparta
          # solo lo de ese intento y no lo que los dos primeros dejaron commiteado.
          - id: base_reparacion
            type: shell
            timeout: 30
            run: "scripts/workflow/global.sh base"
          - id: reparar_hito
            type: prompt
            model: "{{ inputs.modelo_escalada }}"
            timeout: 3600
            prompt: |
              `make ci` falla en el hito {{ inputs.hito }} de kitlegal, con la suite de aceptación congelada ya activada en internal/app/testdata/script/. Final del log en <feature_dir>/gates/ci.log (localiza <feature_dir> en .specify/feature.json).
              Ejecuta `make ci` en primer plano, lee la salida completa y arregla la causa raíz aplicando la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md: nada de desactivar linters, tests o controles; nada de nolint sin justificación; nada de t.Skip. Nunca modifiques testdata/, schemas/, evidencias/, la configuración de lint, cobertura o CI, ni los guiones congelados (<feature_dir>/gates/aceptacion-congelada.json): un guion congelado que falla se arregla en el código. Si un arreglo exige decidir algo que el spec no dice, elige la lectura conservadora y añade una línea a <feature_dir>/gates/supuestos.md ("- [impacto] reparar_hito: <decisión>", con impacto comportamiento, alcance, skill o interno, como define la constitución en «Criterio de decisión autónoma»). Repite hasta verde. No hagas commit: lo hace el workflow tras verificar. No preguntes.
          - id: cerrar_reparacion
            type: shell
            output_format: json
            timeout: 1800
            run: "scripts/workflow/global.sh cerrar {{ inputs.hito }} 'fix({{ inputs.hito }}): make ci del hito completo'"

  # ================================================================ barrido global de artefactos antes de los jueces (lección de H6)
  # En H6 la revisión final dio 13 rondas: cada una encontraba otra afirmación de un
  # artefacto o de la documentación que el producto final ya no sostenía. Un barrido de
  # todos ellos contra el código, de una vez, cortó el goteo. Va aquí, antes de los jueces.
  - id: base_barrido
    type: shell
    timeout: 30
    run: "scripts/workflow/global.sh base"

  - id: barrido
    type: prompt
    model: "{{ inputs.modelo_redaccion }}"
    timeout: 3600
    prompt: |
      Eres el paso de BARRIDO GLOBAL del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo, antes de la revisión final. El código ya está terminado y `make ci` refleja su estado; tu trabajo es que TODO lo que se afirma sobre él sea verdad, de una vez y no ronda a ronda.
      Lee .specify/feature.json para localizar <feature_dir>, y `git diff main...HEAD` completo. Contrasta con el código y con el binario (compílalo y ejecútalo en un directorio temporal fuera del repositorio cuando haga falta) cada afirmación de:
        1. los artefactos del hito: spec.md, plan.md, research.md, data-model.md, contracts/, quickstart.md y tasks.md;
        2. la documentación del repositorio que el hito toca o que habla de lo que el hito cambia: README.md, CONTRIBUTING.md, CHANGELOG.md (Unreleased), docs/ (ROADMAP, SOURCES, ADR del hito, WORKFLOW si procede), skills/*/SKILL.md y los comentarios de paquete de los paquetes nuevos;
        3. las cifras (número de normas, municipios, evals, ficheros, tiempos), los códigos de salida y los ejemplos de órdenes.
      Corrige el TEXTO para que diga lo que el producto hace (nunca el código para que haga lo que dice un texto: si un requisito del spec no se cumple, no lo tapes; déjalo como está para que los jueces lo vean y añade una línea a <feature_dir>/gates/supuestos.md, "- [impacto] barrido: <requisito> → <lo que hace el producto>", con impacto comportamiento, alcance, skill o interno, como define la constitución en «Criterio de decisión autónoma»). Busca cada clase de error en todos los ficheros, no solo el primer caso. No toques código de producto, tests, testdata/, schemas/, evidencias/, la configuración de verificación ni la suite de aceptación congelada; `references/` de las skills se regenera con `make skills-sync`, nunca a mano.
      Termina ejecutando `make ci` en primer plano; si queda en rojo por tu cambio, corrígelo. No hagas commit: lo hace el workflow tras verificar. Escribe en español. No preguntes; no esperes respuesta.

  - id: cerrar_barrido
    type: shell
    output_format: json
    timeout: 1800
    run: "scripts/workflow/global.sh cerrar {{ inputs.hito }} 'docs({{ inputs.hito }}): barrido de artefactos y documentación contra el producto' --revertir-si-rojo"

  # ================================================================ revisión final: dos jueces en paralelo → corrector sobre la unión (4 veredictos, 3 correcciones)
  - id: iniciar_revision
    type: shell
    timeout: 30
    run: "scripts/workflow/gate.sh iniciar revision"

  - id: ronda_revision
    type: do-while
    max_iterations: 4
    condition: "{{ steps.leer_revision.output.data.seguir }}"
    steps:
      # Los dos jueces corren a la vez (fan-out) sobre el mismo árbol y sin ver el
      # veredicto del otro. El papel de cada uno sale de preparar_jueces; el resto del
      # prompt (lecturas, rúbrica, formato) es común. Los modelos son inputs con enum;
      # por eso pueden interpolarse en el shell.
      - id: preparar_jueces
        type: shell
        output_format: json
        timeout: 30
        run: |
          set -eu
          papel_a=$(cat <<'EOF'
          Eres el JUEZ A de la revisión final del hito {{ inputs.hito }} de kitlegal. Aplica la Definition of Done de docs/ROADMAP.md §1 y las secciones «Criterio de decisión autónoma» y «Gates» de .specify/memory/constitution.md. Partes sin hipótesis: comprueba cada criterio de la rúbrica con evidencia, ejecutando lo que haga falta para verlo con tus ojos y no dando por buena ninguna afirmación de tasks.md, del CHANGELOG ni de los contratos sin contrastarla con el código y con el binario.
          EOF
          )
          papel_b=$(cat <<'EOF'
          Eres el JUEZ B (adversarial) de la revisión final del hito {{ inputs.hito }} de kitlegal. Tu hipótesis de partida es que el hito NO cumple la Definition of Done de docs/ROADMAP.md §1 y tu trabajo es encontrar la evidencia. Busca activamente: tests que no prueban nada (sin aserciones, solo camino feliz, tautológicos), nolint o `t.Skip`, errores ignorados (`_ =`), fixtures o golden files retocados para que pase un test (compara con `git log -p -- testdata schemas`), guiones de aceptación congelados alterados (compara con gates/aceptacion-congelada.json), datos de data/ que no salen de lo grabado en evidencias/, cobertura fingida, dependencias no fijadas, código fuera del alcance del spec, violaciones de las reglas de dependencia entre paquetes, llamadas de red fuera de internal/httpx, métodos distintos de GET/HEAD, datos personales, promesas de los contratos o del CHANGELOG que el binario no cumple, y cualquier diferencia entre lo que tasks.md dice que se hizo y lo que hay en el diff. Muta el código en una copia desechable fuera del repositorio para comprobar que los tests detectan lo que dicen detectar. Si tras buscar en serio no encuentras evidencia en contra, el criterio cumple.
          Además de la rúbrica común, evalúas un criterio propio:
            k. proporcionalidad (constitución V, YAGNI): el código es lo más simple que cumple el spec; cada mecanismo —paquete, tipo o función exportada, rama que trata un estado aparte, opción, reintento, test de un caso límite— se traza a un FR/SC que lo exige, y ninguno existe solo para un estado o una entrada que no pasa el umbral de materialidad. Lo que no se traza es motivo: retirarlo con sus tests, salvo que lo exija un guion de la suite congelada (entonces dilo, y va al informe). La evidencia es el mecanismo, sus líneas y el FR, o la falta de FR.
          EOF
          )
          jq -n --arg ma "{{ inputs.modelo_revisor }}" --arg mb "{{ inputs.modelo_adversario }}" --arg pa "$papel_a" --arg pb "$papel_b" \
            '{jueces:[{id:"a", modelo:$ma, fichero:"revision-a.json", papel:$pa}, {id:"b", modelo:$mb, fichero:"revision-b.json", papel:$pb}]}'

      - id: revision_jueces
        type: fan-out
        items: "{{ steps.preparar_jueces.output.data.jueces }}"
        max_concurrency: 2
        step:
          id: revision_juez
          type: prompt
          model: "{{ item.modelo }}"
          timeout: 3600
          prompt: |
            {{ item.papel }}
            Trabajas en un proceso nuevo con contexto limpio, en paralelo con el otro juez y sin acceso a su veredicto. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. No ejecutes `make ci` ni escribas nada en el árbol de trabajo, porque el otro juez corre a la vez sobre el mismo árbol: si quieres reproducir controles, compilar binarios, medir cobertura o mutar código, hazlo sobre copias en un directorio temporal fuera del repositorio.
            Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, plan.md, tasks.md, gates/ci.log, gates/supuestos.md y gates/cuarentena.json (si existen) y `git diff main...HEAD` completo (código y tests). Si existe, lee gates/revision-pendiente.md.
            Rúbrica común a los dos jueces (cumple/no cumple con evidencia: fichero y línea; el juez B evalúa además el criterio propio de su papel):
              a. dod_ci: `make ci` en verde (gates/ci.log, o reproducido en una copia) y árbol limpio;
              b. dod_tests: tests offline para todo el código nuevo, que detectan la regresión que dicen detectar; la suite de aceptación congelada está activada, intacta y en verde;
              c. dod_reglas: sin net/http, os.Exit ni fmt.Print* fuera de los paquetes autorizados; reglas de dependencia respetadas;
              d. dod_sobre: toda salida de applet pasa el sobre y el schema, y hay un test que valida la salida real contra el esquema que el binario emite;
              e. dod_errores: errores tipados → exit codes; ningún panic en rutas de usuario; lo que el contrato promete sobre códigos de salida ocurre en el binario;
              f. dod_docs: CHANGELOG (Unreleased), ADR si cambia una decisión, docs/SOURCES.md si toca una fuente; ninguna afirmación de la documentación ni de los artefactos que el producto no sostenga;
              g. frontera_humana: HTTP solo vía internal/httpx, solo GET/HEAD, sin secretos, sin NIF de persona, rate limit y User-Agent conforme a la constitución (lo que el linter no ve); datos externos solo desde lo grabado por grabar_datos;
              h. sin_atajos: ningún nolint sin justificación, test saltado, TODO diferido, error silenciado ni fixture ajustado para que pase un test;
              i. alcance: el diff no excede el spec (nada de "mejoras" no pedidas), y cada supuesto de gates/supuestos.md es una lectura conservadora coherente con el spec;
              j. uso: de fuera adentro, para cada salida que consume una skill o una persona, lo medido en el binario: bytes por invocación con un uso realista sostenido —meses de uso diario: cientos de normas y miles de bloques consultados, la mayoría hace más de una semana; siémbralo en una copia fuera del repositorio con el propio binario sobre lo grabado y el reloj fijado como en los tests, o mide un elemento y multiplica—, invocaciones por pregunta que pide la SKILL.md, y si cada señal deja de darse con el tiempo o se repite en cada consulta sin información nueva. Una salida que crece con todo lo acumulado y no con la pregunta, o una señal que no caduca nunca, incumple aunque el spec la pida: el motivo lleva la medida y dice qué acotar;
              l. umbrales_que_se_cumplen (la k es el criterio propio del juez B): cada umbral numérico que se mide sin persona, en `make ci` o en el cierre —las filas de "## Controles de umbral" de plan.md y cualquier otro del spec—, tiene en el código el control que lo hace cumplir, y ese control sale en rojo cuando la medida pasa del umbral: léelo y, si su lógica no lo deja claro, compruébalo con un mutante en una copia fuera del repositorio (sube la medida o baja el umbral: el test, `make ci` o el veredicto del job tienen que fallar). Un umbral del job de evals va en `umbrales` de su informe.json con `decide: true` y su incumplimiento pone el veredicto en fallo (contrato del ADR 0029); la regla de decisión por serie del ADR 0016 no sustituye a un umbral agregado. Un umbral que solo se publica incumple aunque el spec lo pida así: el motivo dice qué control añadir y dónde. No entran un umbral que solo mide una persona ni uno del repositorio cuyo control vive en configuración que el hito no toca (a observaciones).
            UMBRAL DE MATERIALIDAD (constitución, «Gates»; ADR 0028): un defecto sobre un estado o una entrada solo es motivo si el producto puede llegar a él por una vía real —un emisor que existe o que entrega el hito; un argumento, una bandera o una variable de quien usa el kit; un estado que crea el propio binario, incluidas sus invocaciones concurrentes y la interrupción de sus propias escrituras si el hito promete atomicidad— y da un resultado observable distinto para una persona o una skill. Ficheros del kit tocados por algo que no es el binario, datos de un emisor que todavía no existe y diferencias solo internas los cubre la regla genérica (defecto `inesperado`, código 1, ADR 0023): lo que encuentres ahí es una observación.
            Escribe <feature_dir>/gates/{{ item.fichero }} con este formato exacto:
              {"veredicto":"aprobado"|"rechazado","criterios":[{"id":"a","criterio":"dod_ci","cumple":true|false,"evidencia":"…"}],"motivos":["…"],"observaciones":["…"]}
            "aprobado" solo si TODOS cumplen. Todo motivo lo aplica un corrector sin persona: si toca alcance, frontera humana, privacidad o TOS, dilo y el corrector aplicará la lectura conservadora (retirar lo dudoso). Cada motivo empieza por las letras de los criterios que incumple, p. ej. "[e][f] …", y dice qué cambiar y dónde. "observaciones" recoge, una línea cada una, lo que viste y no llega a motivo por el umbral de materialidad o por la convergencia: no cuenta para el veredicto ni llega al corrector.
            Revisión exhaustiva dentro del umbral: evalúa cada criterio contra todo el diff y enumera en motivos todos los incumplimientos, no solo el primero de cada criterio; cada defecto que quede para otra ronda cuesta una corrección y dos juicios más.
            CONVERGENCIA. Si gates/{{ item.fichero }} ya existe, es tu veredicto de la ronda anterior: léelo antes de sobrescribirlo y comprueba primero que cada motivo anterior está corregido; el que no lo esté se repite. Los motivos del otro juez en su gates/revision-*.json también fueron corregidos en esa ronda: comprueba que las correcciones no rompieron nada. La corrección es el último commit «fix({{ inputs.hito }}): motivos de la revisión final» (`git log -1 -p --grep`). Un motivo NUEVO —que no estaba en el veredicto anterior— solo cuenta si lo introdujo esa corrección o si es material: pasa el umbral de materialidad, el criterio de uso o el de umbrales (l), o sin él el hito no cumple la Definition of Done. Cualquier otro hallazgo nuevo va a observaciones.
            Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_revision
        type: shell
        output_format: json
        timeout: 30
        run: "scripts/workflow/gate.sh leer revision 4"

      - id: corregir_revision
        type: if
        condition: "{{ steps.leer_revision.output.data.corregir }}"
        then:
          - id: base_revision
            type: shell
            timeout: 30
            run: "scripts/workflow/global.sh base"

          - id: corrector_revision
            type: prompt
            model: "{{ inputs.modelo_implementacion }}"
            timeout: 3600
            prompt: |
              Eres el CORRECTOR de la revisión final del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Al menos uno de los dos jueces independientes ha rechazado el hito; tú aplicas la UNIÓN de los motivos de ambos, no los discutes, y que un juez aprobara no exime de ningún motivo del otro.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/revision-a.json y gates/revision-b.json (criterios con cumple=false y motivos), spec.md, plan.md, tasks.md, gates/supuestos.md y `git diff main...HEAD`.
              Para cada criterio incumplido corrige el código, los tests o la documentación con la mejor solución, sin atajos, aplicando «Criterio de decisión autónoma» de .specify/memory/constitution.md. Un motivo describe un caso de un defecto: busca la clase de error en todo el diff, no solo la línea citada, y corrígela donde pase el umbral de materialidad de la constitución («Gates»; ADR 0028), en ningún sitio más: no añadas código ni tests para estados a los que el producto no puede llegar; entre dos arreglos, el que deja el código más simple. Un motivo de uso ([j]) acota la salida a lo que necesita la pregunta, o da a cada señal la condición que la apaga, con la opción que menos comportamiento añade; un motivo de proporcionalidad ([k]) retira el mecanismo y sus tests; un motivo de umbral ([l]) añade el control que sale en rojo cuando la medida pasa del umbral —en un test de `make ci` o en el veredicto del job de evals, con su test— y nunca rebaja ni retira el umbral ni lo deja solo publicado. Las "observaciones" no se aplican. Si un motivo toca alcance, frontera humana, privacidad, términos de uso, anomalías o una decisión cerrada, aplica la lectura conservadora (retira lo dudoso); hacer cumplir un umbral que pide el hito no es alcance añadido (ADR 0029). Anota cada lectura conservadora y cada corrección de uso o de umbral en <feature_dir>/gates/supuestos.md ("- [impacto] corrector_revision: <motivo> → <decisión>", donde impacto es comportamiento —lo que ve quien usa el binario: salida, códigos, ficheros, argumentos—, alcance, skill —lo que una skill pide, dice o comprueba— o interno; si caben varios, el primero).
              Nunca modifiques testdata/, schemas/, evidencias/, la configuración de lint, cobertura o CI, ni la suite de aceptación congelada: el workflow deshace cualquier cambio así. Si un motivo solo se arregla ahí, déjalo sin arreglar y explícalo en <feature_dir>/gates/revision-pendiente.md.
              Ejecuta `make ci` en primer plano hasta verde. No hagas commit, push ni merge: el workflow commitea tras verificar. No modifiques gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

          - id: cerrar_correccion
            type: shell
            output_format: json
            timeout: 1800
            run: "scripts/workflow/global.sh cerrar {{ inputs.hito }} 'fix({{ inputs.hito }}): motivos de la revisión final'"

  - id: cerrar_revision
    type: shell
    timeout: 120
    run: "scripts/workflow/gate.sh cerrar revision {{ inputs.hito }}"

  # ================================================================ cierre en la plataforma: después de la revisión, sobre la cabeza que se fusionará (lección de H5 y H6)
  - id: publicar
    type: shell
    timeout: 600
    run: "scripts/workflow/cierre.sh publicar {{ inputs.hito }}"

  - id: bucle_cierre
    type: do-while
    max_iterations: 3
    condition: "{{ not steps.medir_cierre.output.data.verde and steps.medir_cierre.output.data.ronda < 3 }}"
    steps:
      - id: medir_cierre
        type: shell
        output_format: json
        timeout: 11400
        run: "scripts/workflow/cierre.sh medir {{ inputs.hito }}"

      - id: reparar_cierre_si
        type: if
        condition: "{{ not steps.medir_cierre.output.data.verde and steps.medir_cierre.output.data.ronda < 3 }}"
        then:
          - id: base_cierre
            type: shell
            timeout: 30
            run: "scripts/workflow/global.sh base"

          - id: reparar_cierre
            type: prompt
            model: "{{ inputs.modelo_escalada }}"
            timeout: 3600
            prompt: |
              La medición de cierre del hito {{ inputs.hito }} de kitlegal sale en rojo sobre la cabeza de la rama: CI o evals remotas. Lee .specify/feature.json para localizar <feature_dir>; el estado de cada comprobación está en <feature_dir>/gates/cierre.json, el final del log de cada ejecución en rojo en <feature_dir>/gates/cierre.log y el informe de cada job de evals, con sus `umbrales`, en <feature_dir>/gates/evals/<skill>.json.
              Reproduce el fallo en local si se puede (p. ej. `go test -exec 'env GOOS=linux …'` para diferencias del runner, o el guion de evals de scripts/evals.sh con `--help`) y arregla la causa raíz aplicando «Criterio de decisión autónoma» de .specify/memory/constitution.md. Una eval en rojo se arregla en la skill o en la herramienta, nunca en la eval; un umbral del job que no se cumple, también: nunca rebajándolo, quitándolo del veredicto ni dejándolo solo publicado (ADR 0029); una cota de tiempo que el runner no cumple se arregla midiendo lo que la cota protege, no subiéndola sin más. Nunca modifiques testdata/, schemas/, evidencias/, la configuración de lint, cobertura o CI, ni la suite de aceptación congelada.
              Ejecuta `make ci` en primer plano hasta verde. No hagas commit ni push: el workflow commitea, empuja y vuelve a medir. No preguntes; no esperes respuesta.

          - id: cerrar_cierre
            type: shell
            output_format: json
            timeout: 1800
            run: "scripts/workflow/global.sh cerrar {{ inputs.hito }} 'fix({{ inputs.hito }}): cierre en la plataforma'"

  # ================================================================ informe final: el cuerpo de la propuesta de cambio; fusionar es humano
  - id: informe_final
    type: shell
    timeout: 300
    run: "scripts/workflow/informe.sh {{ inputs.hito }}"
