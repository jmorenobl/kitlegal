schema_version: "1.0"
workflow:
  id: "hito"
  name: "Hito del roadmap (SDD con gates automáticos)"
  version: "1.4.1"
  author: "kitlegal"
  integration: "claude"
  description: "Implementa un hito de docs/ROADMAP.md. Gates en tres capas: mecánicos (shell, antes de cualquier juez), jueces LLM con rúbrica cerrada que no corrigen (corrector aparte, dos rondas), y humanos forzados para rutas sensibles. Implementación tarea a tarea con guardián de diff."

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["claude"]

# Seguridad: `inputs.hito` se interpola en pasos `shell`, por eso está
# restringido a un enum. Ningún otro valor libre entra en un `run:`; los
# pasos shell leen todo lo demás de ficheros (.specify/feature.json, gates/*.json).
inputs:
  hito:
    type: string
    required: true
    prompt: "Hito del roadmap a implementar (H0..H26)"
    enum: ["H0","H1","H2","H3","H4","H5","H6","H7","H8","H9","H10","H11","H12","H13","H14","H15","H16","H17","H18","H19","H20","H21","H22","H23","H24","H25","H26"]
  modo:
    type: string
    default: "desatendido"
    enum: ["desatendido", "supervisado"]
    prompt: "desatendido: los gates los decide Claude con el criterio de la constitución; supervisado: además pausa para revisión humana tras spec, plan y revisión final"
  granularidad:
    type: string
    default: "tarea"
    enum: ["tarea", "hito"]
    prompt: "tarea: implementa y verifica tarea a tarea con guardián de diff; hito: una sola pasada de implement"
  veredicto_spec:
    type: string
    default: ""
  veredicto_plan:
    type: string
    default: ""
  veredicto_final:
    type: string
    default: ""
  # ---- modelo por rol (alias de claude --model o nombre completo) ----
  modelo_juez:
    type: string
    default: "fable"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para resolver clarificaciones y para los jueces (spec, plan, tasks, revisión A y B)"
  modelo_redaccion:
    type: string
    default: "opus"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para specify, clarify, plan, tasks y los correctores de artefactos"
  modelo_implementacion:
    type: string
    default: "opus"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para implement, reparaciones de CI y corrector de la revisión final"
  modelo_analisis:
    type: string
    default: "sonnet"
    enum: ["fable", "opus", "sonnet", "haiku", "claude-fable-5-1", "claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
    prompt: "Modelo para analyze y converge"

steps:
  # ================================================================ contexto
  - id: extraer_hito
    type: shell
    output_format: json
    timeout: 30
    run: |
      set -eu
      h="{{ inputs.hito }}"
      sec=$(awk -v h="$h" 'BEGIN{p=0} $0 ~ ("^#### " h " · "){p=1; print; next} p && /^(#{2,4} |---)/{exit} p{print}' docs/ROADMAP.md)
      [ -n "$sec" ] || { echo "hito $h no encontrado en docs/ROADMAP.md" >&2; exit 1; }
      titulo=$(printf '%s\n' "$sec" | head -1 | sed -E 's/^#### [A-Z0-9]+ · //')
      palabras=$(printf '%s' "$titulo" | tr '[:upper:]' '[:lower:]' | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -d- -f1-3)
      slug="$(printf '%s' "$h" | tr '[:upper:]' '[:lower:]')-$palabras"
      jq -n --arg hito "$h" --arg titulo "$titulo" --arg slug "$slug" --arg texto "$sec" \
        '{hito:$hito, titulo:$titulo, slug:$slug, texto:$texto}'

  # ================================================================ specify
  - id: specify
    command: speckit.specify
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        Hito {{ inputs.hito }} · {{ steps.extraer_hito.output.data.titulo }}.
        Nombre corto OBLIGATORIO para la rama y el directorio: {{ steps.extraer_hito.output.data.slug }}

        MODO DESATENDIDO. Nadie va a responder preguntas en esta sesión:
        - No esperes respuesta del usuario. Si detectas ambigüedad que afecte al alcance, déjala como [NEEDS CLARIFICATION: pregunta concreta] (máximo 3); las resolverá un proceso posterior con contexto limpio. No la resuelvas tú ni presentes opciones.
        - El alcance del spec es EXACTAMENTE la sección del hito que sigue. Lo que no esté en ella, en CLAUDE.md, en refs/ o en .specify/memory/constitution.md va a una sección "## Fuera de alcance" (obligatoria, aunque quede vacía) y no se implementa.
        - Lee antes CLAUDE.md, docs/ROADMAP.md (§1 Definition of Done, §2 arquitectura, §3 controles, §6 ritual) y los refs/ que el hito cite.
        - Los criterios de aceptación del spec deben incluir literalmente los de "Aceptación" y "Controles" del hito.

        Sección del roadmap:

        {{ steps.extraer_hito.output.data.texto }}

  # ================================================================ clarify en tres pasos
  - id: clarify_preguntas
    command: speckit.clarify
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO DESATENDIDO, FASE 1 (solo preguntas). Ejecuta el escaneo de ambigüedad y cobertura y genera la cola priorizada de preguntas (máximo 5) exactamente como en modo interactivo, PERO:
        - No presentes las preguntas al usuario ni esperes respuesta.
        - No respondas ninguna. No incluyas recomendación, sugerencia ni opción "preferida": las decidirá otro proceso con contexto limpio y cualquier pista sesgaría la decisión.
        - No modifiques spec.md ni checklists en esta fase.
        - Incluye también como preguntas los marcadores [NEEDS CLARIFICATION] que queden en spec.md.
        - Escribe <feature_dir>/gates/clarify-preguntas.json (localiza <feature_dir> en .specify/feature.json; crea gates/ si no existe) con este formato exacto:
          {"preguntas":[{"id":"Q1","categoria":"…","pregunta":"…","por_que_importa":"…","opciones":[{"id":"A","texto":"…"}],"respuesta_corta_permitida":true}]}
          Las opciones deben ser mutuamente excluyentes y describir implicaciones de forma neutral, sin valorar cuál es mejor.
        - Si no hay ambigüedades que merezcan pregunta, escribe {"preguntas":[]}.
        Termina con un resumen de una línea.

  - id: resolver_clarify
    type: prompt
    model: "{{ inputs.modelo_juez }}"
    timeout: 1800
    prompt: |
      Eres un proceso independiente con contexto limpio: no has visto la sesión que formuló las preguntas, no debes buscar su razonamiento y decides únicamente con documentos.
      1. Lee .specify/feature.json para localizar <feature_dir>. Lee <feature_dir>/gates/clarify-preguntas.json y <feature_dir>/spec.md; la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md; la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md; CLAUDE.md; y los refs/ que el hito cite.
      2. Para cada pregunta, en orden:
         (a) si la respuesta está determinada por el hito, CLAUDE.md, refs/ o la constitución, esa es la respuesta; cita la fuente;
         (b) si no está especificada en ninguna fuente, la respuesta es "fuera de alcance: no se implementa";
         (c) si varias opciones son compatibles con las fuentes, elige la de mayor calidad, escalabilidad, mantenibilidad, seguridad y mejores prácticas de Go y de este proyecto, sin atajos ni ñapas, y explica la alternativa rechazada;
         (d) si la pregunta afecta a alcance, frontera humana, privacidad, términos de uso de una fuente, reglas de anomalías o a una decisión cerrada de CLAUDE.md, no decidas: marca escalar=true y explica qué debe decidir el humano.
      3. Escribe <feature_dir>/gates/clarify-respuestas.json con este formato exacto, una entrada por pregunta y los mismos ids:
         {"respuestas":[{"id":"Q1","opcion":"A","respuesta":"…","criterio":"a|b|c|d","fuente":"…","alternativa_rechazada":"…","escalar":false}]}
         Si preguntas está vacío, escribe {"respuestas":[]}.
      No modifiques ningún otro fichero. No preguntes ni esperes respuesta.

  - id: check_clarify
    type: shell
    output_format: json
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      p="$d/gates/clarify-preguntas.json"; r="$d/gates/clarify-respuestas.json"
      [ -f "$p" ] || { echo "falta $p" >&2; exit 1; }
      [ -f "$r" ] || { echo "falta $r" >&2; exit 1; }
      n=$(jq '.preguntas | length' "$p")
      faltan=$(jq -r --slurpfile r "$r" '([.preguntas[].id] - [$r[0].respuestas[].id]) | join(" ")' "$p")
      [ -z "$faltan" ] || { echo "preguntas sin respuesta: $faltan" >&2; exit 1; }
      esc=$(jq '[.respuestas[] | select(.escalar == true)] | length' "$r")
      if [ "$esc" -gt 0 ]; then
        echo "clarificaciones ESCALADAS a decisión humana. Edita $r (respuesta + escalar=false) y reanuda el run:" >&2
        jq -r '.respuestas[] | select(.escalar == true) | "- \(.id): \(.respuesta)"' "$r" >&2
        exit 1
      fi
      jq -n --argjson n "$n" '{n: $n}'

  - id: integrar_clarify
    type: if
    condition: "{{ steps.check_clarify.output.data.n > 0 }}"
    then:
      - id: clarify_integrar
        command: speckit.clarify
        model: "{{ inputs.modelo_redaccion }}"
        input:
          args: |
            MODO DESATENDIDO, FASE 2 (integración). No generes preguntas nuevas ni esperes respuesta. Las preguntas están en <feature_dir>/gates/clarify-preguntas.json y las respuestas ya decididas en <feature_dir>/gates/clarify-respuestas.json (localiza <feature_dir> en .specify/feature.json). Trata cada par como una pregunta ya aceptada por el usuario y aplica tus reglas de integración incremental:
            - en ## Clarifications, una línea por pregunta: "- Q: <pregunta> → A: <respuesta> (auto: criterio <criterio>; fuente: <fuente>)";
            - actualiza las secciones afectadas del spec y elimina los [NEEDS CLARIFICATION] resueltos;
            - lo respondido con "no se implementa" va a "## Fuera de alcance";
            - actualiza checklists/requirements.md.
            Termina con el informe de cobertura.

  # ================================================================ gate del spec: mecánico → juez → corrector (2 rondas) → check
  - id: precheck_spec
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      ! grep -q "NEEDS CLARIFICATION" "$d/spec.md" || { echo "spec.md conserva [NEEDS CLARIFICATION]"; exit 1; }
      grep -qi "^## Fuera de alcance" "$d/spec.md" || { echo "spec.md no tiene sección '## Fuera de alcance'"; exit 1; }
      ls "$d"/checklists/*.md >/dev/null 2>&1 || { echo "no hay checklists/"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md || { echo "checklists con ítems sin marcar"; grep -nE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md; exit 1; }
      n=$(jq '.preguntas | length' "$d/gates/clarify-preguntas.json")
      if [ "$n" -gt 0 ]; then
        q=$(grep -cE '^[[:space:]]*- Q:' "$d/spec.md" || true)
        [ "$q" -ge "$n" ] || { echo "## Clarifications tiene $q entradas y hubo $n preguntas"; exit 1; }
      fi
      rm -f "$d/gates/spec-rondas"
      echo "precheck_spec ok"

  - id: ronda_spec
    type: do-while
    max_iterations: 3
    condition: "{{ steps.leer_gate_spec.output.data.veredicto != 'aprobado' and steps.leer_gate_spec.output.data.corregible }}"
    steps:
      - id: juez_spec
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 1800
        prompt: |
          Eres el JUEZ del spec del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica la sección «Criterio de decisión autónoma» y la sección «Gates» de .specify/memory/constitution.md.
          Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, checklists/, gates/clarify-*.json y, si existe, gates/spec-pendiente.md; la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md; CLAUDE.md y la constitución.
          Rúbrica (cada criterio se evalúa cumple/no cumple con evidencia citada del artefacto):
            a. alcance: el spec cubre el hito completo y nada más que el hito;
            b. fuera_de_alcance: todo lo no especificado en hito, CLAUDE.md, refs/ o constitución está listado en "## Fuera de alcance";
            c. clarificaciones: cada respuesta de clarify-respuestas.json está reflejada en el spec y en Clarifications;
            d. aceptacion: los criterios de "Aceptación" y "Controles" del hito están en el spec, medibles;
            e. decisiones_cerradas: ninguna decisión cerrada de CLAUDE.md se reabre ni contradice;
            f. checklist_veraz: cada marca [x] de checklists/ es cierta (cita el requisito que la satisface);
            g. sin_implementacion: el spec no fija tecnología ni diseño (eso es del plan).
          Escribe <feature_dir>/gates/spec.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","corregible":true|false,"criterios":[{"id":"a","criterio":"alcance","cumple":true|false,"evidencia":"…"}],"motivos":["…"]}
          Reglas: "aprobado" solo si TODOS los criterios cumplen. "corregible": false si algún motivo requiere decisión humana (alcance del hito, frontera humana, privacidad, TOS, reglas de anomalías, decisión cerrada); en ese caso explícalo en motivos. Sé concreto en motivos: qué cambiar y dónde.
          Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_gate_spec
        type: shell
        output_format: json
        timeout: 30
        run: |
          set -eu
          d=$(jq -r .feature_directory .specify/feature.json)
          g="$d/gates/spec.json"
          [ -f "$g" ] || { echo "falta $g" >&2; exit 1; }
          jq -e 'has("veredicto") and has("corregible") and (.criterios | type == "array" and length > 0)' "$g" >/dev/null || { echo "formato inválido en $g" >&2; exit 1; }
          [ "$(jq -r '(.criterios | all(.cumple == true)) == (.veredicto == "aprobado")' "$g")" = "true" ] || { echo "veredicto incoherente con los criterios en $g" >&2; exit 1; }
          c="$d/gates/spec-rondas"; n=$(cat "$c" 2>/dev/null || echo 0); n=$((n + 1)); echo "$n" > "$c"
          jq --argjson ronda "$n" '{veredicto, corregible, motivos, ronda: $ronda}' "$g"

      - id: corregir_spec
        type: if
        condition: "{{ steps.leer_gate_spec.output.data.veredicto != 'aprobado' and steps.leer_gate_spec.output.data.corregible and steps.leer_gate_spec.output.data.ronda < 3 }}"
        then:
          - id: corrector_spec
            type: prompt
            model: "{{ inputs.modelo_redaccion }}"
            timeout: 1800
            prompt: |
              Eres el CORRECTOR del spec del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Un juez independiente ha rechazado el spec; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/spec.json (criterios con cumple=false y motivos), spec.md, checklists/, la sección "#### {{ inputs.hito }} ·" de docs/ROADMAP.md, CLAUDE.md y .specify/memory/constitution.md.
              Para cada criterio incumplido, corrige spec.md y/o checklists/ con la mejor solución posible, sin atajos: nunca marques un ítem de checklist sin que el spec lo satisfaga. Si un motivo requiere una decisión humana, no lo resuelvas: anótalo en <feature_dir>/gates/spec-pendiente.md.
              No modifiques gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

  - id: check_gate_spec
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      jq -e '.veredicto == "aprobado"' "$d/gates/spec.json" >/dev/null || { echo "gate_spec RECHAZADO tras las rondas de corrección; requiere humano:"; jq -r '.motivos[]' "$d/gates/spec.json"; exit 1; }
      ! grep -q "NEEDS CLARIFICATION" "$d/spec.md" || { echo "spec.md conserva [NEEDS CLARIFICATION]"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md || { echo "checklists con ítems sin marcar"; exit 1; }
      echo "gate_spec aprobado"

  - id: revision_humana_spec
    type: if
    condition: "{{ inputs.modo == 'supervisado' }}"
    then:
      - id: gate_humano_spec
        type: gate
        message: "Revisa spec.md, gates/clarify-respuestas.json y gates/spec.json antes de planificar."
        options: [approve, reject]
        on_reject: abort
        verdict_input: veredicto_spec

  # ================================================================ plan
  - id: plan
    command: speckit.plan
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes ni esperes respuesta; resuelve dudas técnicas con la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md y déjalas documentadas en research.md (decisión, alternativas, por qué).
        Restricciones para este hito {{ inputs.hito }}:
        - Stack y dependencias: solo las fijadas en la constitución (§V) y en docs/ROADMAP.md §3; cualquier otra va a Complexity Tracking con justificación o no se usa.
        - Estructura: la de docs/ROADMAP.md §2 y CLAUDE.md. Reglas de dependencia entre paquetes obligatorias.
        - Rellena el Constitution Check con un ítem por principio (I-VII) y por regla de dependencia, indicando cómo lo cumple este hito. Si un gate falla sin justificación, detente con ERROR.
        - Enumera en el plan los controles mecánicos que este hito añade o toca (objetivos de make, tests de contrato, fixtures) según la sección «Gates» de la constitución.
        - Aplica las skills golang-* instaladas (golang-how-to orquesta) al decidir layout, tests, lint y CLI.
        - Lo que no esté en el spec no entra en el plan.

  - id: precheck_plan
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      [ -f "$d/plan.md" ] || { echo "falta plan.md"; exit 1; }
      [ -f "$d/research.md" ] || { echo "falta research.md"; exit 1; }
      ! grep -q "NEEDS CLARIFICATION" "$d/plan.md" || { echo "plan.md conserva NEEDS CLARIFICATION"; exit 1; }
      grep -q "## Constitution Check" "$d/plan.md" || { echo "plan.md sin Constitution Check"; exit 1; }
      rm -f "$d/gates/plan-rondas"
      echo "precheck_plan ok"

  - id: ronda_plan
    type: do-while
    max_iterations: 3
    condition: "{{ steps.leer_gate_plan.output.data.veredicto != 'aprobado' and steps.leer_gate_plan.output.data.corregible }}"
    steps:
      - id: juez_plan
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 1800
        prompt: |
          Eres el JUEZ del plan del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica las secciones «Criterio de decisión autónoma» y «Gates» de .specify/memory/constitution.md.
          Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, plan.md, research.md, data-model.md, contracts/ (los que existan) y, si existe, gates/plan-pendiente.md; la constitución; CLAUDE.md; docs/ROADMAP.md §2-§3.
          Rúbrica (cumple/no cumple con evidencia):
            a. constitution_check: completo, un ítem por principio y regla de dependencia, y veraz;
            b. dependencias: ninguna fuera de la lista fijada sin justificación en Complexity Tracking;
            c. reglas_dependencia: la estructura propuesta respeta qué paquete importa qué (core sin adaptadores; net/http solo en httpx; SQLite solo en cache/store/graph; os.Exit solo en cli/cmd; stdout solo en render);
            d. errores_exit_codes: errores tipados que mapean a los exit codes estables;
            e. tests_primero: el plan nombra el test e2e y los unitarios/fixtures del hito y los controles mecánicos que añade;
            f. alcance: nada fuera del spec;
            g. sin_atajos: ningún nolint, test saltado, TODO diferido o error silenciado previsto;
            h. mejor_alternativa: si hay varias opciones técnicas, la elegida es la de mayor calidad y escalabilidad y research.md documenta la rechazada.
          Escribe <feature_dir>/gates/plan.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","corregible":true|false,"criterios":[{"id":"a","criterio":"constitution_check","cumple":true|false,"evidencia":"…"}],"motivos":["…"]}
          "aprobado" solo si TODOS cumplen. "corregible": false si algún motivo requiere decisión humana (alcance, frontera humana, privacidad, TOS, reglas de anomalías, decisión cerrada). Motivos concretos: qué cambiar y dónde.
          Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_gate_plan
        type: shell
        output_format: json
        timeout: 30
        run: |
          set -eu
          d=$(jq -r .feature_directory .specify/feature.json)
          g="$d/gates/plan.json"
          [ -f "$g" ] || { echo "falta $g" >&2; exit 1; }
          jq -e 'has("veredicto") and has("corregible") and (.criterios | type == "array" and length > 0)' "$g" >/dev/null || { echo "formato inválido en $g" >&2; exit 1; }
          [ "$(jq -r '(.criterios | all(.cumple == true)) == (.veredicto == "aprobado")' "$g")" = "true" ] || { echo "veredicto incoherente con los criterios en $g" >&2; exit 1; }
          c="$d/gates/plan-rondas"; n=$(cat "$c" 2>/dev/null || echo 0); n=$((n + 1)); echo "$n" > "$c"
          jq --argjson ronda "$n" '{veredicto, corregible, motivos, ronda: $ronda}' "$g"

      - id: corregir_plan
        type: if
        condition: "{{ steps.leer_gate_plan.output.data.veredicto != 'aprobado' and steps.leer_gate_plan.output.data.corregible and steps.leer_gate_plan.output.data.ronda < 3 }}"
        then:
          - id: corrector_plan
            type: prompt
            model: "{{ inputs.modelo_redaccion }}"
            timeout: 1800
            prompt: |
              Eres el CORRECTOR del plan del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Un juez independiente ha rechazado el plan; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/plan.json (criterios con cumple=false y motivos), plan.md, research.md, data-model.md, contracts/, spec.md, .specify/memory/constitution.md, CLAUDE.md y docs/ROADMAP.md §2-§3.
              Para cada criterio incumplido, corrige plan.md/research.md/data-model.md/contracts/ con la mejor solución posible, sin atajos. Si un motivo requiere una decisión humana, no lo resuelvas: anótalo en <feature_dir>/gates/plan-pendiente.md.
              No modifiques spec.md ni gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

  - id: check_gate_plan
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      jq -e '.veredicto == "aprobado"' "$d/gates/plan.json" >/dev/null || { echo "gate_plan RECHAZADO tras las rondas de corrección; requiere humano:"; jq -r '.motivos[]' "$d/gates/plan.json"; exit 1; }
      ! grep -q "NEEDS CLARIFICATION" "$d/plan.md" || { echo "plan.md conserva NEEDS CLARIFICATION"; exit 1; }
      echo "gate_plan aprobado"

  - id: commit_artefactos_plan
    type: shell
    timeout: 120
    run: |
      set -eu
      git add -A
      git diff --cached --quiet && { echo "nada que commitear"; exit 0; }
      git commit -q -m "docs({{ inputs.hito }}): spec, clarificaciones y plan del hito"
      git log --oneline -1

  - id: revision_humana_plan
    type: if
    condition: "{{ inputs.modo == 'supervisado' }}"
    then:
      - id: gate_humano_plan
        type: gate
        message: "Revisa plan.md, research.md y gates/plan.json antes de generar tareas."
        options: [approve, reject]
        on_reject: abort
        verdict_input: veredicto_plan

  # ================================================================ tasks + analyze
  - id: tasks
    command: speckit.tasks
    model: "{{ inputs.modelo_redaccion }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes. Genera tasks.md siguiendo docs/ROADMAP.md §6 (ritual por hito) con estas reglas, porque las tareas se ejecutarán y verificarán UNA A UNA por un proceso automático con un guardián de diff:
        - Cada tarea es una rebanada vertical que deja `make ci` en verde al terminar: incluye su test (unitario, integración o e2e) y la implementación mínima que lo hace pasar. No separes "escribir el test" e "implementar" en tareas distintas salvo que el test cubra código ya existente.
        - Orden estrictamente ejecutable en secuencia: ninguna tarea depende de una posterior. La primera tarea entrega el esqueleto mínimo que hace que `make ci` exista y pase (en H0, el propio Makefile y los gates); el test e2e testscript que describe la entrega del hito va en la primera tarea que pueda dejarlo en verde.
        - Formato de línea obligatorio: "- [ ] T001 [P] [US1] Descripción" con TODAS las rutas que la tarea va a crear o modificar (ficheros o directorios, p. ej. internal/cli/, cmd/kitlegal/main.go, Makefile, .gitleaksignore). El guardián rechaza cualquier fichero fuera de esas rutas; go.mod, go.sum, CHANGELOG.md y el directorio del feature siempre están permitidos, y declarar x.go permite x_test.go.
        - Toda tarea que cree o modifique ficheros bajo testdata/ o schemas/ lleva la etiqueta [datos] y provocará una pausa para revisión humana. Sepáralas del resto: una tarea [datos] solo toca testdata/ y schemas/. Nunca se graban fixtures contra la red dentro del workflow (KITLEGAL_RECORD queda fuera).
        - Ids T001, T002… únicos y correlativos; una tarea por línea.
        - Incluye tareas explícitas para cada punto de la Definition of Done (§1) que aplique al hito: CHANGELOG.md, ADR, docs/SOURCES.md, schemas, fixtures.
        - Ninguna tarea fuera del spec.

  - id: analyze
    command: speckit.analyze
    model: "{{ inputs.modelo_analisis }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes ni ofrezcas remediaciones para después. Además de mostrar el informe, escríbelo íntegro en <feature_dir>/gates/analyze.md (localiza <feature_dir> con .specify/feature.json).

  - id: precheck_tasks
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      [ -f "$d/gates/analyze.md" ] || { echo "falta gates/analyze.md"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md || { echo "checklists con ítems sin marcar: implement se detendría a preguntar"; exit 1; }
      grep -qE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" || { echo "tasks.md no contiene tareas con el formato '- [ ] Tnnn'"; exit 1; }
      dup=$(grep -oE '^[[:space:]]*- \[[ xX]\] T[0-9]+' "$d/tasks.md" | grep -oE 'T[0-9]+' | sort | uniq -d || true)
      [ -z "$dup" ] || { echo "ids de tarea duplicados: $dup"; exit 1; }
      sin_rutas=$(grep -E '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" | tr '`,;()' '     ' | grep -vE '(\.?[A-Za-z0-9_-]+/)+[A-Za-z0-9_.*-]*|[A-Za-z0-9_.-]+\.(go|md|yml|yaml|json|sh|txt|mod|sum|toml|txtar)|\.[A-Za-z0-9_-]*ignore|\.editorconfig|Makefile|LICENSE' || true)
      [ -z "$sin_rutas" ] || { echo "tareas sin rutas declaradas (el guardián de diff las rechazaría):"; echo "$sin_rutas"; exit 1; }
      mixtas=$(grep -E '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" | grep -E '(^|[^A-Za-z0-9_])(testdata|schemas)/' | grep -v '\[datos\]' || true)
      [ -z "$mixtas" ] || { echo "tareas que tocan testdata/ o schemas/ sin etiqueta [datos]:"; echo "$mixtas"; exit 1; }
      rm -f "$d/gates/tasks-rondas"
      echo "precheck_tasks ok: $(grep -cE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md") tareas"

  - id: ronda_tasks
    type: do-while
    max_iterations: 3
    condition: "{{ steps.leer_gate_tasks.output.data.veredicto != 'aprobado' and steps.leer_gate_tasks.output.data.corregible }}"
    steps:
      - id: juez_tasks
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 1800
        prompt: |
          Eres el JUEZ de consistencia (spec ↔ plan ↔ tasks) del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica las secciones «Criterio de decisión autónoma» y «Gates» de .specify/memory/constitution.md.
          Lee .specify/feature.json para localizar <feature_dir>; lee gates/analyze.md, spec.md, plan.md, tasks.md, checklists/ y, si existe, gates/tasks-pendiente.md.
          Rúbrica (cumple/no cumple con evidencia):
            a. analisis_critico: ningún hallazgo CRITICAL o HIGH de analyze.md sigue sin resolver en los artefactos;
            b. trazabilidad: toda tarea traza a un requisito del spec y todo requisito tiene tareas;
            c. rebanadas_verdes: cada tarea incluye test e implementación y puede dejar `make ci` en verde por sí sola; el orden es ejecutable en secuencia;
            d. rutas_declaradas: cada tarea declara todas las rutas que tocará (ficheros o directorios), sin rutas genéricas tipo "internal/";
            e. datos_separados: las tareas que tocan testdata/ o schemas/ llevan [datos] y no mezclan otro trabajo;
            f. dod: existen tareas para cada punto aplicable de la Definition of Done (CHANGELOG, ADR, SOURCES.md, schemas, fixtures);
            g. checklist_veraz: cada marca [x] de checklists/ es cierta.
          Escribe <feature_dir>/gates/tasks.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","corregible":true|false,"criterios":[{"id":"a","criterio":"analisis_critico","cumple":true|false,"evidencia":"…"}],"motivos":["…"]}
          "aprobado" solo si TODOS cumplen. "corregible": false si algún motivo requiere decisión humana. Motivos concretos: qué cambiar, en qué artefacto.
          Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_gate_tasks
        type: shell
        output_format: json
        timeout: 30
        run: |
          set -eu
          d=$(jq -r .feature_directory .specify/feature.json)
          g="$d/gates/tasks.json"
          [ -f "$g" ] || { echo "falta $g" >&2; exit 1; }
          jq -e 'has("veredicto") and has("corregible") and (.criterios | type == "array" and length > 0)' "$g" >/dev/null || { echo "formato inválido en $g" >&2; exit 1; }
          [ "$(jq -r '(.criterios | all(.cumple == true)) == (.veredicto == "aprobado")' "$g")" = "true" ] || { echo "veredicto incoherente con los criterios en $g" >&2; exit 1; }
          c="$d/gates/tasks-rondas"; n=$(cat "$c" 2>/dev/null || echo 0); n=$((n + 1)); echo "$n" > "$c"
          jq --argjson ronda "$n" '{veredicto, corregible, motivos, ronda: $ronda}' "$g"

      - id: corregir_tasks
        type: if
        condition: "{{ steps.leer_gate_tasks.output.data.veredicto != 'aprobado' and steps.leer_gate_tasks.output.data.corregible and steps.leer_gate_tasks.output.data.ronda < 3 }}"
        then:
          - id: corrector_tasks
            type: prompt
            model: "{{ inputs.modelo_redaccion }}"
            timeout: 1800
            prompt: |
              Eres el CORRECTOR de artefactos del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Un juez independiente ha rechazado la consistencia spec/plan/tasks; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/tasks.json (criterios con cumple=false y motivos), gates/analyze.md, spec.md, plan.md, tasks.md y checklists/.
              Para cada criterio incumplido corrige el artefacto que corresponda (spec, plan o tasks) con la mejor solución, sin atajos; nunca marques un checklist sin que el artefacto lo satisfaga. Mantén el formato de tareas ("- [ ] Tnnn … rutas", [datos] para testdata/ y schemas/). Si un motivo requiere decisión humana, no lo resuelvas: anótalo en <feature_dir>/gates/tasks-pendiente.md.
              No modifiques gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

  - id: check_gate_tasks
    type: shell
    timeout: 30
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      jq -e '.veredicto == "aprobado"' "$d/gates/tasks.json" >/dev/null || { echo "gate_tasks RECHAZADO tras las rondas de corrección; requiere humano:"; jq -r '.motivos[]' "$d/gates/tasks.json"; exit 1; }
      ! grep -qE '^[[:space:]]*- \[ \]' "$d"/checklists/*.md || { echo "checklists con ítems sin marcar"; exit 1; }
      grep -qE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" || { echo "tasks.md sin tareas pendientes con formato '- [ ] Tnnn'"; exit 1; }
      echo "gate_tasks aprobado: $(grep -cE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md") tareas"

  - id: commit_artefactos_tasks
    type: shell
    timeout: 120
    run: |
      set -eu
      git add -A
      git diff --cached --quiet && { echo "nada que commitear"; exit 0; }
      git commit -q -m "docs({{ inputs.hito }}): tareas y análisis del hito"
      git log --oneline -1

  # ================================================================ implementación tarea a tarea con guardián de diff
  - id: implementacion_por_tarea
    type: if
    condition: "{{ inputs.granularidad == 'tarea' }}"
    then:
      - id: bucle_tareas
        type: do-while
        max_iterations: 300
        condition: "{{ steps.siguiente_tarea.output.data.id != '' }}"
        steps:
          - id: siguiente_tarea
            type: shell
            output_format: json
            timeout: 30
            run: |
              set -eu
              d=$(jq -r .feature_directory .specify/feature.json)
              mkdir -p "$d/gates"
              f="$d/gates/tareas-intentos.json"; [ -f "$f" ] || echo '{}' > "$f"
              linea=$(grep -E '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" | head -1 || true)
              if [ -z "$linea" ]; then jq -n '{id:"", texto:"", intento:0, datos:false, base:"", rutas:[]}' | tee "$d/gates/tarea-actual.json"; exit 0; fi
              id=$(printf '%s' "$linea" | grep -oE 'T[0-9]+' | head -1)
              texto=$(printf '%s' "$linea" | sed -E 's/^[[:space:]]*- \[ \] //')
              n=$(jq -r --arg id "$id" '.[$id] // 0' "$f"); n=$((n + 1))
              jq --arg id "$id" --argjson n "$n" '.[$id] = $n' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              if [ "$n" -gt 3 ]; then
                echo "la tarea $id lleva $n intentos sin quedar marcada [X]; se detiene para revisión humana (ver $d/gates/tarea-$id.md)" >&2
                exit 1
              fi
              datos=false; printf '%s' "$texto" | grep -q '\[datos\]' && datos=true
              base=$(git rev-parse HEAD)
              rutas=$(printf '%s' "$texto" | tr '`,;()' '     ' | grep -oE '(\.?[A-Za-z0-9_-]+/)+[A-Za-z0-9_.*-]*|[A-Za-z0-9_.-]+\.(go|md|yml|yaml|json|sh|txt|mod|sum|toml|txtar)|\.[A-Za-z0-9_-]*ignore|\.editorconfig|Makefile|LICENSE' | grep -vE '^https?:' | sort -u | jq -R . | jq -s .)
              jq -n --arg id "$id" --arg texto "$texto" --argjson n "$n" --argjson datos "$datos" --arg base "$base" --argjson rutas "$rutas" \
                '{id:$id, texto:$texto, intento:$n, datos:$datos, base:$base, rutas:$rutas}' | tee "$d/gates/tarea-actual.json"

          - id: tarea
            type: if
            condition: "{{ steps.siguiente_tarea.output.data.id != '' }}"
            then:
              - id: implementar_tarea
                command: speckit.implement
                model: "{{ inputs.modelo_implementacion }}"
                input:
                  args: |
                    MODO DESATENDIDO. Ejecuta ÚNICAMENTE la tarea {{ steps.siguiente_tarea.output.data.id }} de tasks.md (intento {{ steps.siguiente_tarea.output.data.intento }} de 3):
                    {{ steps.siguiente_tarea.output.data.texto }}
                    Reglas: el test primero, dentro de la tarea (rojo → verde); sin atajos (nada de nolint sin justificar, tests saltados, TODO diferidos ni errores silenciados); aplica las skills golang-*; no toques ni marques otras tareas. Un guardián de diff rechazará cualquier fichero fuera de las rutas declaradas en la tarea (go.mod, go.sum, CHANGELOG.md, el directorio del feature y x_test.go de un x.go declarado siempre están permitidos) y cualquier cambio en testdata/ o schemas/ si la tarea no lleva [datos]. Nunca uses KITLEGAL_RECORD ni la red. Al terminar ejecuta la verificación determinista (`make ci`; si aún no existe el Makefile, `go build ./... && go vet ./... && go test -race ./...`) y marca la tarea [X] SOLO si está en verde. Si ya estaba hecha y en verde, limítate a marcarla. Si no consigues verde, déjala [ ] y escribe la causa en <feature_dir>/gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md. Las checklists ya fueron verificadas; no preguntes ni esperes respuesta.

              - id: guardian_diff
                type: shell
                timeout: 60
                run: |
                  set -eu
                  d=$(jq -r .feature_directory .specify/feature.json)
                  t="$d/gates/tarea-actual.json"
                  id=$(jq -r .id "$t"); base=$(jq -r .base "$t"); datos=$(jq -r .datos "$t")
                  printf '%s' "$base" | grep -qE '^[0-9a-f]{40}$' || { echo "base de la tarea inválida" >&2; exit 1; }
                  cambiados=$( { git diff --name-only "$base"; git ls-files --others --exclude-standard; } | sort -u )
                  [ -n "$cambiados" ] || { echo "guardián: la tarea $id no cambió ningún fichero"; exit 0; }
                  rutas=$(jq -r '.rutas[]' "$t")
                  fuera=""; protegidos=""
                  for f in $cambiados; do
                    case "$f" in go.mod|go.sum|CHANGELOG.md|"$d"/*) continue;; esac
                    case "$f" in testdata/*|*/testdata/*|schemas/*) protegidos="$protegidos $f";; esac
                    ok=0
                    for r in $rutas; do
                      r=${r%%\**}; r=${r%/}
                      [ -n "$r" ] || continue
                      case "$f" in "$r"|"$r"/*) ok=1; break;; esac
                      case "$r" in *.go) case "$f" in "${r%.go}_test.go") ok=1; break;; esac;; esac
                    done
                    [ "$ok" -eq 1 ] || fuera="$fuera $f"
                  done
                  rc=0
                  if [ -n "$protegidos" ] && [ "$datos" != "true" ]; then echo "guardián: la tarea $id modificó fixtures/schemas sin etiqueta [datos]:$protegidos"; rc=1; fi
                  if [ -n "$fuera" ]; then echo "guardián: la tarea $id tocó ficheros fuera de sus rutas declaradas:$fuera"; echo "rutas declaradas: $(printf '%s ' $rutas)"; rc=1; fi
                  [ "$rc" -eq 0 ] && echo "guardián de diff ok ($(printf '%s\n' "$cambiados" | wc -l | tr -d ' ') ficheros)"
                  exit "$rc"

              - id: verificar
                type: shell
                continue_on_error: true
                timeout: 1800
                run: |
                  set -u
                  d=$(jq -r .feature_directory .specify/feature.json)
                  mkdir -p "$d/gates"; log="$d/gates/ci.log"
                  if [ -f Makefile ] && grep -qE '^ci:' Makefile; then cmd="make ci"
                  elif [ -f go.mod ]; then cmd="go build ./... && go vet ./... && go test -race ./..."
                  else echo "sin Makefile ni go.mod todavía: nada que verificar"; exit 0; fi
                  sh -c "$cmd" > "$log" 2>&1; rc=$?
                  if [ "$rc" -eq 0 ]; then echo "verificación en verde: $cmd"; exit 0; fi
                  echo "verificación FALLIDA ($cmd, exit $rc). Últimas 80 líneas del log ($log):"
                  tail -80 "$log"
                  exit "$rc"

              - id: reparar_tarea
                type: if
                condition: "{{ steps.verificar.output.exit_code != 0 }}"
                then:
                  - id: reparar
                    type: prompt
                    model: "{{ inputs.modelo_implementacion }}"
                    timeout: 1800
                    prompt: |
                      La verificación determinista falla tras la tarea {{ steps.siguiente_tarea.output.data.id }} ({{ steps.siguiente_tarea.output.data.texto }}) del hito {{ inputs.hito }} de kitlegal. Salida del verificador (final del log; el completo está en <feature_dir>/gates/ci.log, con <feature_dir> en .specify/feature.json):

                      {{ steps.verificar.output.stdout }}

                      Arregla la causa raíz aplicando la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md: nada de desactivar linters, tests o controles; nada de nolint sin justificación en el propio código; nada de silenciar errores; nunca modifiques ficheros de testdata/ o schemas/ (el guardián de diff lo rechazará) ni ficheros fuera de las rutas declaradas por la tarea. Si el fallo es un test que legítimamente sigue en rojo porque su implementación pertenece a una tarea posterior, NO lo arregles: la tarea está mal delimitada; anótalo en gates/tarea-{{ steps.siguiente_tarea.output.data.id }}.md, deja la tarea como [ ] y termina. En cualquier otro caso repite la verificación hasta verde y deja la tarea marcada [X]. No preguntes ni esperes respuesta.

                  - id: guardian_diff_reparacion
                    type: shell
                    timeout: 60
                    run: |
                      set -eu
                      d=$(jq -r .feature_directory .specify/feature.json)
                      t="$d/gates/tarea-actual.json"
                      id=$(jq -r .id "$t"); base=$(jq -r .base "$t"); datos=$(jq -r .datos "$t")
                      printf '%s' "$base" | grep -qE '^[0-9a-f]{40}$' || { echo "base de la tarea inválida" >&2; exit 1; }
                      cambiados=$( { git diff --name-only "$base"; git ls-files --others --exclude-standard; } | sort -u )
                      [ -n "$cambiados" ] || { echo "guardián: sin cambios"; exit 0; }
                      rutas=$(jq -r '.rutas[]' "$t")
                      fuera=""; protegidos=""
                      for f in $cambiados; do
                        case "$f" in go.mod|go.sum|CHANGELOG.md|"$d"/*) continue;; esac
                        case "$f" in testdata/*|*/testdata/*|schemas/*) protegidos="$protegidos $f";; esac
                        ok=0
                        for r in $rutas; do
                          r=${r%%\**}; r=${r%/}
                          [ -n "$r" ] || continue
                          case "$f" in "$r"|"$r"/*) ok=1; break;; esac
                          case "$r" in *.go) case "$f" in "${r%.go}_test.go") ok=1; break;; esac;; esac
                        done
                        [ "$ok" -eq 1 ] || fuera="$fuera $f"
                      done
                      rc=0
                      if [ -n "$protegidos" ] && [ "$datos" != "true" ]; then echo "guardián (reparación): la tarea $id modificó fixtures/schemas sin etiqueta [datos]:$protegidos"; rc=1; fi
                      if [ -n "$fuera" ]; then echo "guardián (reparación): ficheros fuera de las rutas declaradas:$fuera"; rc=1; fi
                      [ "$rc" -eq 0 ] && echo "guardián de diff ok tras reparación"
                      exit "$rc"

                  - id: verificar_reparacion
                    type: shell
                    timeout: 1800
                    run: |
                      set -u
                      d=$(jq -r .feature_directory .specify/feature.json)
                      log="$d/gates/ci.log"
                      if [ -f Makefile ] && grep -qE '^ci:' Makefile; then cmd="make ci"
                      elif [ -f go.mod ]; then cmd="go build ./... && go vet ./... && go test -race ./..."
                      else exit 0; fi
                      sh -c "$cmd" > "$log" 2>&1; rc=$?
                      if [ "$rc" -eq 0 ]; then echo "reparación verificada: $cmd"; exit 0; fi
                      echo "la reparación no deja la verificación en verde; se detiene para revisión humana. Últimas 80 líneas:"
                      tail -80 "$log"
                      exit "$rc"

              - id: commit_tarea
                type: shell
                timeout: 120
                run: |
                  set -eu
                  d=$(jq -r .feature_directory .specify/feature.json)
                  id=$(jq -r .id "$d/gates/tarea-actual.json")
                  git add -A
                  git diff --cached --quiet && { echo "tarea $id: nada que commitear"; exit 0; }
                  git commit -q -m "feat({{ inputs.hito }}): $id" -m "$(jq -r .texto "$d/gates/tarea-actual.json")"
                  git log --oneline -1

              - id: revision_humana_datos
                type: if
                condition: "{{ steps.siguiente_tarea.output.data.datos }}"
                then:
                  - id: gate_humano_datos
                    type: gate
                    message: "La tarea [datos] ha tocado testdata/ o schemas/. Revisa `git diff` de esos ficheros (verdad terreno de citas y contratos) antes de continuar. Esta pausa no depende de `modo`."
                    options: [approve, reject]
                    on_reject: abort

  # ================================================================ implementación en una pasada (granularidad=hito)
  - id: implementacion_hito
    type: if
    condition: "{{ inputs.granularidad == 'hito' }}"
    then:
      - id: implement
        command: speckit.implement
        model: "{{ inputs.modelo_implementacion }}"
        input:
          args: |
            MODO DESATENDIDO: no preguntes ni esperes respuesta. Las checklists ya han sido verificadas. Ejecuta todas las tareas de tasks.md en orden; tests antes que código; sin atajos. Aplica las skills golang-*. Nunca uses KITLEGAL_RECORD ni la red. Al terminar ejecuta `make ci` y no des por terminado el hito hasta que esté en verde; si un control falla, arregla la causa, no el control. Marca cada tarea completada como [X].

  # ================================================================ CI del hito completo
  - id: ci
    type: shell
    continue_on_error: true
    timeout: 1800
    run: |
      set -u
      d=$(jq -r .feature_directory .specify/feature.json)
      mkdir -p "$d/gates"; log="$d/gates/ci.log"; rm -f "$d/gates/revision-rondas"
      make ci > "$log" 2>&1; rc=$?
      if [ "$rc" -eq 0 ]; then echo "make ci en verde"; exit 0; fi
      echo "make ci FALLA (exit $rc). Últimas 80 líneas:"; tail -80 "$log"; exit "$rc"

  - id: reparar_ci
    type: if
    condition: "{{ steps.ci.output.exit_code != 0 }}"
    then:
      - id: bucle_reparacion
        type: do-while
        max_iterations: 3
        condition: "{{ steps.ci_reintento.output.exit_code != 0 }}"
        steps:
          - id: reparar_hito
            type: prompt
            model: "{{ inputs.modelo_implementacion }}"
            timeout: 1800
            prompt: |
              `make ci` falla en el hito {{ inputs.hito }} de kitlegal. Salida (final del log; completo en <feature_dir>/gates/ci.log):

              {{ steps.ci.output.stdout }}

              Ejecuta `make ci`, lee la salida completa y arregla la causa raíz aplicando la sección «Criterio de decisión autónoma» de .specify/memory/constitution.md: nada de desactivar linters, tests o controles; nada de nolint sin justificación; nunca modifiques testdata/ ni schemas/. Repite hasta verde. Si el fallo requiere una decisión humana, escribe el motivo en <feature_dir>/gates/ci-bloqueado.md y termina. No preguntes.
          - id: ci_reintento
            type: shell
            continue_on_error: true
            timeout: 1800
            run: |
              set -u
              d=$(jq -r .feature_directory .specify/feature.json)
              log="$d/gates/ci.log"
              make ci > "$log" 2>&1; rc=$?
              if [ "$rc" -eq 0 ]; then echo "make ci en verde"; exit 0; fi
              echo "make ci sigue FALLANDO (exit $rc). Últimas 80 líneas:"; tail -80 "$log"; exit "$rc"
      - id: ci_tras_reparacion
        type: shell
        timeout: 1800
        run: "make ci"

  # ================================================================ converge
  - id: converge
    command: speckit.converge
    model: "{{ inputs.modelo_analisis }}"
    input:
      args: |
        MODO DESATENDIDO: no preguntes. Compara el código con spec.md, plan.md y tasks.md y añade a tasks.md, con el formato "- [ ] Tnnn … rutas" (ids correlativos, [datos] si toca testdata/ o schemas/), solo el trabajo que falte para cumplir el spec y la Definition of Done (docs/ROADMAP.md §1). Nada fuera del spec.

  - id: implement_restante
    command: speckit.implement
    model: "{{ inputs.modelo_implementacion }}"
    input:
      args: |
        MODO DESATENDIDO: ejecuta únicamente las tareas pendientes ([ ]) que converge haya añadido, una a una, con test primero y verificación `make ci` tras cada una; respeta las rutas declaradas y nunca toques testdata/ ni schemas/ salvo en una tarea [datos]. Si no hay ninguna, termina sin cambios. Termina con `make ci` en verde y las tareas marcadas [X]. No preguntes.

  - id: commit_restante
    type: shell
    timeout: 120
    run: |
      set -eu
      git add -A
      git diff --cached --quiet && { echo "nada que commitear"; exit 0; }
      git commit -q -m "feat({{ inputs.hito }}): tareas restantes tras converge"
      git log --oneline -1

  # ================================================================ revisión final: dos jueces independientes → corrector (3 rondas)
  - id: ronda_revision
    type: do-while
    max_iterations: 3
    condition: "{{ steps.leer_revision.output.data.estado == 'corregir' }}"
    steps:
      - id: revision_juez_a
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 1800
        prompt: |
          Eres el JUEZ A de la revisión final del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto. Aplica la Definition of Done de docs/ROADMAP.md §1 y las secciones «Criterio de decisión autónoma» y «Gates» de .specify/memory/constitution.md.
          Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, plan.md, tasks.md, gates/ci.log y `git diff main...HEAD` completo (código y tests). Si existe, lee gates/revision-pendiente.md.
          Rúbrica (cumple/no cumple con evidencia: fichero y línea):
            a. dod_ci: `make ci` en verde (gates/ci.log) y árbol limpio;
            b. dod_tests: tests offline para todo el código nuevo; fixtures en testdata/ solo si el hito lo pide;
            c. dod_reglas: sin net/http, os.Exit ni fmt.Print* fuera de los paquetes autorizados; reglas de dependencia respetadas;
            d. dod_sobre: toda salida de applet pasa el sobre y el schema;
            e. dod_errores: errores tipados → exit codes; ningún panic en rutas de usuario;
            f. dod_docs: CHANGELOG (Unreleased), ADR si cambia una decisión, docs/SOURCES.md si toca una fuente;
            g. frontera_humana: HTTP solo vía internal/httpx, solo GET/HEAD, sin secretos, sin NIF de persona, rate limit y User-Agent conforme a la constitución (lo que el linter no ve);
            h. sin_atajos: ningún nolint sin justificación, test saltado, TODO diferido, error silenciado ni fixture ajustado para que pase un test;
            i. alcance: el diff no excede el spec (nada de "mejoras" no pedidas).
          Escribe <feature_dir>/gates/revision-a.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","corregible":true|false,"criterios":[{"id":"a","criterio":"dod_ci","cumple":true|false,"evidencia":"…"}],"motivos":["…"]}
          "aprobado" solo si TODOS cumplen. "corregible": false si algún motivo requiere decisión humana. Escribe en español. No preguntes; no esperes respuesta.

      - id: revision_juez_b
        type: prompt
        model: "{{ inputs.modelo_juez }}"
        timeout: 1800
        prompt: |
          Eres el JUEZ B (adversarial) de la revisión final del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo con contexto limpio y sin acceso al veredicto del juez A. Tu hipótesis de partida es que el hito NO cumple la Definition of Done y tu trabajo es encontrar la evidencia. Solo emites veredicto: NO modifiques ningún fichero salvo el JSON del veredicto.
          Lee .specify/feature.json para localizar <feature_dir>; lee spec.md, tasks.md, gates/ci.log y `git diff main...HEAD` completo. Busca activamente: tests que no prueban nada (sin aserciones, cubren el camino feliz solo), nolint o `t.Skip`, errores ignorados (`_ =`), fixtures o golden files retocados para que pase un test (compara con `git log -p -- testdata schemas`), cobertura fingida, dependencias no fijadas, código fuera del alcance del spec, violaciones de las reglas de dependencia entre paquetes, llamadas de red fuera de internal/httpx, métodos distintos de GET/HEAD, datos personales, y cualquier diferencia entre lo que tasks.md dice que se hizo y lo que hay en el diff.
          Evalúa la misma rúbrica que el juez A (a. dod_ci, b. dod_tests, c. dod_reglas, d. dod_sobre, e. dod_errores, f. dod_docs, g. frontera_humana, h. sin_atajos, i. alcance), cada criterio cumple/no cumple con evidencia (fichero y línea). Si tras buscar en serio no encuentras evidencia en contra, el criterio cumple.
          Escribe <feature_dir>/gates/revision-b.json con este formato exacto:
            {"veredicto":"aprobado"|"rechazado","corregible":true|false,"criterios":[{"id":"a","criterio":"dod_ci","cumple":true|false,"evidencia":"…"}],"motivos":["…"]}
          "aprobado" solo si TODOS cumplen. Escribe en español. No preguntes; no esperes respuesta.

      - id: leer_revision
        type: shell
        output_format: json
        timeout: 30
        run: |
          set -eu
          d=$(jq -r .feature_directory .specify/feature.json)
          a="$d/gates/revision-a.json"; b="$d/gates/revision-b.json"
          for g in "$a" "$b"; do
            [ -f "$g" ] || { echo "falta $g" >&2; exit 1; }
            jq -e 'has("veredicto") and has("corregible") and (.criterios | type == "array" and length > 0)' "$g" >/dev/null || { echo "formato inválido en $g" >&2; exit 1; }
            [ "$(jq -r '(.criterios | all(.cumple == true)) == (.veredicto == "aprobado")' "$g")" = "true" ] || { echo "veredicto incoherente con los criterios en $g" >&2; exit 1; }
          done
          va=$(jq -r .veredicto "$a"); vb=$(jq -r .veredicto "$b")
          ca=$(jq -r .corregible "$a"); cb=$(jq -r .corregible "$b")
          if [ "$va" = aprobado ] && [ "$vb" = aprobado ]; then estado=aprobado
          elif [ "$va" = rechazado ] && [ "$vb" = rechazado ] && [ "$ca" = true ] && [ "$cb" = true ]; then estado=corregir
          else estado=humano; fi
          c="$d/gates/revision-rondas"; n=$(cat "$c" 2>/dev/null || echo 0); n=$((n + 1)); echo "$n" > "$c"
          jq -n --arg estado "$estado" --arg va "$va" --arg vb "$vb" --argjson ronda "$n" \
            --slurpfile a "$a" --slurpfile b "$b" \
            '{estado:$estado, juez_a:$va, juez_b:$vb, ronda:$ronda, motivos:(($a[0].motivos // []) + ($b[0].motivos // []))}'

      - id: corregir_revision
        type: if
        condition: "{{ steps.leer_revision.output.data.estado == 'corregir' and steps.leer_revision.output.data.ronda < 3 }}"
        then:
          - id: corrector_revision
            type: prompt
            model: "{{ inputs.modelo_implementacion }}"
            timeout: 1800
            prompt: |
              Eres el CORRECTOR de la revisión final del hito {{ inputs.hito }} de kitlegal, en un proceso nuevo. Dos jueces independientes han rechazado el hito; tú aplicas sus motivos, no los discutes.
              Lee .specify/feature.json para localizar <feature_dir>; lee gates/revision-a.json y gates/revision-b.json (criterios con cumple=false y motivos), spec.md, plan.md, tasks.md y `git diff main...HEAD`.
              Para cada criterio incumplido corrige el código, los tests o la documentación con la mejor solución, sin atajos, aplicando «Criterio de decisión autónoma» de .specify/memory/constitution.md. Nunca modifiques testdata/ ni schemas/ (si un motivo lo exige, anótalo en gates/revision-pendiente.md para un humano). Ejecuta `make ci` hasta verde y deja todo commiteado en la rama del hito con Conventional Commits. No hagas push ni merge. Si un motivo requiere decisión humana, no lo resuelvas: anótalo en gates/revision-pendiente.md.
              No modifiques gates/*.json. Escribe en español. No preguntes; no esperes respuesta.

  - id: ci_final
    type: shell
    timeout: 1800
    run: |
      set -eu
      d=$(jq -r .feature_directory .specify/feature.json)
      make ci
      estado=$(jq -r 'if (.veredicto == "aprobado") then "a" else "x" end' "$d/gates/revision-a.json")$(jq -r 'if (.veredicto == "aprobado") then "b" else "x" end' "$d/gates/revision-b.json")
      if [ "$estado" != "ab" ]; then
        echo "revisión final NO aprobada por ambos jueces (A: $(jq -r .veredicto "$d/gates/revision-a.json"), B: $(jq -r .veredicto "$d/gates/revision-b.json")); requiere humano. Motivos:"
        jq -r '.motivos[]' "$d/gates/revision-a.json" "$d/gates/revision-b.json"
        exit 1
      fi
      ! grep -qE '^[[:space:]]*- \[ \] T[0-9]+' "$d/tasks.md" || { echo "quedan tareas sin marcar en tasks.md"; exit 1; }
      test -z "$(git status --porcelain)" || { echo "quedan cambios sin commitear"; git status --short; exit 1; }
      echo "== Hito {{ inputs.hito }} en verde y aprobado por los dos jueces =="
      git log --oneline main..HEAD
      git diff --stat main...HEAD | tail -1

  # ================================================================ gate humano forzado por rutas sensibles (independiente de `modo`)
  - id: rutas_sensibles
    type: shell
    output_format: json
    timeout: 30
    run: |
      set -eu
      cambiados=$( { git diff --name-only main...HEAD; git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u )
      motivos=""
      printf '%s\n' "$cambiados" | grep -qx 'docs/SOURCES.md' && motivos="$motivos docs/SOURCES.md"
      printf '%s\n' "$cambiados" | grep -q '^data/anomalias/' && motivos="$motivos data/anomalias/"
      for dir in $(printf '%s\n' "$cambiados" | grep -oE '^internal/source/[^/]+' | sort -u); do
        git cat-file -e "main:$dir" 2>/dev/null || motivos="$motivos $dir(fuente nueva)"
      done
      if [ -n "$motivos" ]; then jq -n --arg m "$motivos" '{humano:true, motivos:$m}'; else jq -n '{humano:false, motivos:""}'; fi

  - id: gate_rutas_sensibles
    type: if
    condition: "{{ steps.rutas_sensibles.output.data.humano }}"
    then:
      - id: gate_humano_sensible
        type: gate
        message: "El hito toca rutas que exigen revisión humana ({{ steps.rutas_sensibles.output.data.motivos }}): docs/SOURCES.md (responsabilidad sobre fuentes), reglas de anomalías o una fuente nueva. Revisa `git diff main...HEAD` de esas rutas antes de dar por listo el hito. Esta pausa no depende de `modo` ni se puede pre-aprobar por input."
        options: [approve, reject]
        on_reject: abort

  - id: revision_humana_final
    type: if
    condition: "{{ inputs.modo == 'supervisado' }}"
    then:
      - id: gate_humano_final
        type: gate
        message: "Revisa gates/revision-a.json, gates/revision-b.json y el diff. approve = listo para abrir PR y squash-merge (acción humana)."
        options: [approve, reject]
        on_reject: abort
        verdict_input: veredicto_final
