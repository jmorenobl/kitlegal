    fragmentos:
      - Las mujeres con hijos menores de tres años con derecho a la aplicación del mínimo por descendientes previsto en el artículo 58 de esta ley, que en el momento del nacimiento del menor perciban prestaciones contributivas o asistenciales del sistema de protección de desempleo, o que en dicho momento o en cualquier momento posterior estén dadas de alta en el régimen correspondiente de la Seguridad Social o mutualidad con un período mínimo, en este último caso, de 30 días cotizados, podrán minorar la cuota diferencial de este Impuesto hasta en 1.200 euros anuales por cada hijo menor de tres años hasta que el menor alcance los tres años de edad.
    destacado: 1.200 euros anuales

