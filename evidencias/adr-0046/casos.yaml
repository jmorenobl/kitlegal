- id: '074'
  skill: jurisprudencia
  origen: jurisprudencia@e1bfb77
  clase: leída
  etiqueta: defecto
  forma: Úsala
  descripcion: 'Sentencias y jurisprudencia de los tribunales españoles, sin citar ninguna de memoria. Úsala siempre que la
    pregunta nombre, pida, cite o resuma una sentencia o un auto —«STS 1088/2023, de 4 de julio», un ECLI, un ROJ, «la sentencia
    del Supremo sobre…»—, pregunte si una sentencia existe o qué dice, pida jurisprudencia sobre una materia («qué dice la
    jurisprudencia sobre la cláusula suelo») o traiga el texto o el PDF de una resolución, también cuando creas conocerla:
    una sentencia solo se cita con su documento delante. kitlegal no consulta el buscador del CENDOJ: prepara la consulta
    exacta para que la persona la busque con su navegador y coteja el documento que trae. Actívala antes de llamar a cita_preparar
    o a cita_cotejar: qué pedir, qué decir de la sentencia que no está delante y cómo citar la que sí lo dice la skill.'
