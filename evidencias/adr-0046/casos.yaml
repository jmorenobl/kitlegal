- id: '052'
  skill: legal-core
  origen: legal-core@80a3422
  clase: leída
  etiqueta: defecto
  forma: Úsala
  descripcion: 'Punto de partida de las preguntas de derecho público español que dependen de un municipio o de un plazo: identifica
    el territorio de un municipio —código INE, provincia, comunidad, régimen, DIR3 del ayuntamiento y boletines— y calcula
    con kitlegal hasta qué día se puede recurrir una resolución, cuándo vence un plazo administrativo o el del recurso contencioso-administrativo
    y cuándo se produce el silencio, con los festivos de los municipios que cuentan; y dice cuándo un asunto lo regula la
    ley aparte (tributos, multas de tráfico, Seguridad Social, extranjería). Razona con la jerarquía normativa y las leyes
    vertebrales (Constitución, LPAC, LRJSP, LRBRL, TRLRHL, LCSP, LGT…). Úsala cuando se pregunte hasta cuándo se puede recurrir
    o qué plazo hay para un recurso, cuándo vence un plazo o se produce el silencio, qué comunidad, provincia o boletines
    corresponden a un ayuntamiento, si un municipio es foral o qué norma prevalece. Para el texto de un artículo se apoya
    en boe-legislacion.'
