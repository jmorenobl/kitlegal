casos:
- id: '001'
  skill: boe-legislacion
  origen: boe-legislacion@e1bfb77
  clase: leída
  etiqueta: defecto
  forma: Úsala
  descripcion: 'Consulta y cita normativa consolidada del Boletín Oficial del Estado (BOE) de cualquier materia: procedimiento
    administrativo, contratación pública, régimen local, tributos y haciendas locales, transparencia, relaciones laborales…
    Úsala siempre que la respuesta dependa de lo que dice una norma —qué dice un artículo, una ley o un real decreto, qué
    plazo, requisito o procedimiento fija, dónde se regula una materia— o de lo que decía en una fecha —la del acto, la de
    los hechos—, también cuando creas conocer la respuesta: sin leer la norma con kitlegal, no hay cita. Actívala antes de
    llamar a boe_articulo u otra herramienta boe_…: qué pedir y cómo citar lo dice la skill. La norma puede nombrarse por
    su número y año (Ley 39/2015, Real Decreto Legislativo 2/2004), por su abreviatura (LPAC, LCSP, LRBRL, LGT, TRLRHL, LRJSP)
    o por su identificador BOE-A-…, o pedirse el texto, hoy o en una fecha, de una norma estatal o autonómica consolidada
    en el BOE. Lee índice y artículos con kitlegal y cita identificador y bloque.'
