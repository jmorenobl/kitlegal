# Cobertura por materia de kitlegal: los procedimientos que la ley regula aparte del procedimiento común (DA 1ª.2 y
# art. 112 LPAC), a los que no se aplican el art. 30 LPAC ni `plazos calcular`. Lo lee skills.LeerCobertura contra
# schemas/cobertura.yaml.json; única fuente de verdad de las regiones cobertura_por_materia de la referencia de cada
# paquete, hoy skills/plazos-y-territorio/references/administrativo.md.
# Sin texto de ninguna norma: cada precepto se nombra por su identificador, su bloque y su apartado. Solo lleva norma
# la entrada cuyo precepto aplicable se cita de lo grabado; la que no la lleva no la toma de ningún otro sitio, y la
# declaración nombra el precepto de la LPAC. TestPreceptosDeLosPlazos (internal/evals) comprueba contra lo grabado del
# BOE que cada bloque existe y que cada identificador es el que resuelve su búsqueda grabada.
regulados_aparte:
  - procedimiento: aplicación de los tributos en materia tributaria y aduanera y su revisión en vía administrativa
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.a"}
    norma: {identificador: BOE-A-2003-23186, nombre: "Ley 58/2003, General Tributaria", aplicable: {bloque: a97, apartado: "97"}}
  - procedimiento: gestión, inspección, liquidación, recaudación, impugnación y revisión en materia de Seguridad Social y desempleo
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.b"}
  - procedimiento: procedimientos sancionadores en materia tributaria y aduanera
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.c"}
  - procedimiento: procedimientos sancionadores en el orden social
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.c"}
  - procedimiento: procedimientos sancionadores en materia de tráfico y seguridad vial
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.c"}
    norma: {identificador: BOE-A-2015-11722, nombre: "texto refundido de la Ley sobre Tráfico, Circulación de Vehículos a Motor y Seguridad Vial", aplicable: {bloque: a1, apartado: "1"}}
  - procedimiento: procedimientos sancionadores en materia de extranjería
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.c"}
  - procedimiento: actuaciones y procedimientos en materia de extranjería y asilo
    precepto: {norma: BOE-A-2015-10565, bloque: daprimera, apartado: "DA 1ª.2.d"}
  - procedimiento: procedimientos de impugnación que una ley establece en sustitución del recurso de alzada
    precepto: {norma: BOE-A-2015-10565, bloque: a112, apartado: "112.2"}
  - procedimiento: reclamaciones económico-administrativas
    precepto: {norma: BOE-A-2015-10565, bloque: a112, apartado: "112.4"}
