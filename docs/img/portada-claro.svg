  <text x="82" y="366" class="sans" font-size="14" fill="#8A857A">Skills para tu agente · fuentes públicas · software libre (EUPL-1.2)</text>

  <!-- Ejemplo: pregunta, texto vigente y cita -->
  <rect x="660" y="60" width="548" height="300" rx="16" fill="#FFFFFF" stroke="#E2DED4"/>
  <text x="692" y="108" class="sans" font-size="16" fill="#6B675E">› ¿Qué dice el art. 21 de la Ley 39/2015?</text>
  <line x1="692" y1="128" x2="1176" y2="128" stroke="#EEEAE1"/>
  <text x="692" y="166" class="serif" font-size="19" font-weight="700" fill="#1C1B19">Artículo 21. Obligación de resolver.</text>
  <text x="692" y="197" class="serif" font-size="16" fill="#3A3833">1. La Administración está obligada a dictar resolución</text>
  <text x="692" y="220" class="serif" font-size="16" fill="#3A3833">expresa y a notificarla en todos los procedimientos…</text>
  <rect x="692" y="246" width="484" height="42" rx="8" fill="#F5E7E9"/>
  <text x="710" y="272" class="mono" font-size="13" fill="#9B1B30">art. 21 de la Ley 39/2015 [BOE-A-2015-10565, bloque a21]</text>
