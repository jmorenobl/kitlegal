  <desc id="d">Tu agente responde con la ley delante y la cita exacta. Ejemplo: el artículo 21 de la Ley 39/2015, citado como art. 21 de la Ley 39/2015 [BOE-A-2015-10565, bloque a21].</desc>
  <defs>
