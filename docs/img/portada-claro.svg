  <text x="132" y="150" class="serif" font-size="76" font-weight="700" fill="#1C1B19">kitlegal</text>
  <text x="82" y="206" class="sans" font-size="25" fill="#4A4740">Tu agente responde con la ley delante</text>
  <text x="82" y="240" class="sans" font-size="25" fill="#4A4740">y la cita exacta.</text>

