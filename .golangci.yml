# Configuración de golangci-lint (formato v2).
# Contrato: FR-012 a FR-014 y FR-017 del hito H0; decisión en research.md D9.
# H1 añade las cinco reglas de dependencia de docs/ROADMAP.md §2 (FR-050 a
# FR-053): specs/002-h1-kernel-cli-multicall/contracts/reglas-de-arquitectura.md.
# La versión de la herramienta está fijada en tools/golangci-lint/go.mod.
version: "2"

run:
  # Los tests son código del proyecto y se lintan igual que el resto.
  tests: true
  # También los que llevan la etiqueta de compilación integration, que make ci
  # ejecuta con test-integration: sin ella ningún linter —sqlclosecheck y
  # rowserrcheck incluidos— cargaría esos ficheros, y uno que ni compila pasaría
  # el lint en verde (H3 FR-041, research.md D11).
  #
  # Y los que llevan fuentes: la verificación contra la fuente real
  # (internal/app/fuentes_red_test.go) solo la compila scripts/verify-sources.sh,
  # que toca la red y que ejecutan make verify-sources y el flujo nocturno, nunca
  # make ci ni ninguna tarea; sin la etiqueta aquí, ese fichero quedaría fuera de
  # todo control y uno que ni compila pasaría el lint en verde (H4 FR-115,
  # research.md D13).
  #
  # Y los que llevan grabacion: el arnés que graba las respuestas reales de una
  # fuente (internal/source/boe/grabacion_test.go) solo lo compila
  # scripts/grabar-fixtures.sh, que toca la red y que ni make ci ni ninguna tarea
  # ejecutan; sin la etiqueta aquí, ese fichero quedaría fuera de todo control y
  # uno que ni compila pasaría el lint en verde (H4 research.md D13).
  #
  # Y los que llevan evals: los arneses del job de evals
  # (internal/evals/job_test.go) solo los compila scripts/evals.sh, que abre
  # sesiones con modelo y que ni make ci ni ninguna tarea ejecutan; sin la
  # etiqueta aquí, ese fichero quedaría fuera de todo control y uno que ni
  # compila pasaría el lint en verde (H5 research.md D20 y V38).
  build-tags:
    - integration
    - fuentes
    - grabacion
    - evals

linters:
  # `standard` aporta errcheck, govet, staticcheck, ineffassign y unused.
  default: standard
  enable:
    # Los de FR-013 que no vienen en `standard`.
    - bodyclose
    - contextcheck
    - dupl
    - errorlint
    - exhaustive
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - thelper
    - tparallel
    # FR-014 y FR-050: las cinco reglas de dependencia de docs/ROADMAP.md §2.
    # depguard vigila las tres de importación; forbidigo, las dos de símbolo.
    # El reparto y el porqué están en
    # specs/002-h1-kernel-cli-multicall/contracts/reglas-de-arquitectura.md §2.
    - depguard
    - forbidigo

  settings:
    depguard:
      # Una lista por regla de importación. Los patrones de `files` se comparan
      # contra la **ruta absoluta** del fichero normalizada a `/`, así que se
      # escriben como `**/internal/…/**` y no como `internal/…/**`
      # (depguard v2.2.1, depguard.go:71; H1 research.md D18). Un patrón con `!`
      # delante exceptúa.
      #
      # Esta configuración no es la única garantía: internal/arch_test.go
      # comprueba las mismas tres reglas sobre el grafo transitivo real, de modo
      # que borrar estas listas no basta para que una violación pase (FR-051).
      rules:
        # R1 · el dominio es puro. Acotada al árbol del dominio, deniega los nueve
        # paquetes de internal/ —la dependencia va siempre hacia dentro—, el
        # paquete raíz del módulo, con lo empotrado, y los paquetes de entrada y
        # salida de la biblioteca estándar, que es lo que impide que un
        # *slog.Logger o un io.Writer se instalen en internal/core sin que ningún
        # control diga nada (research.md D2, D18).
        #
        # internal/disco y el paquete raíz entran en H19, en la misma tarea que
        # crea el adaptador y antes de que exista ningún test que pudiera
        # saltarse la regla: los `_test.go` del dominio solo los vigila esta
        # lista, porque el grafo de internal/arch_test.go sale de `go list -deps`
        # sin tests (H19 research.md D32, V47). El paquete raíz va como entrada
        # **exacta**, con `$` al final: sin él sería un prefijo, y de ese prefijo
        # cuelga el módulo entero, internal/core incluido (depguard v2.2.1,
        # settings.go:224-247; H19 research.md V45).
        core:
          # `original`: sin lista de permitidos, se deniega exactamente lo
          # enumerado y se permite el resto.
          list-mode: original
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/jmorenobl/kitlegal$
              desc: "R1: el dominio no importa lo empotrado; recibe las skills como bytes desde internal/app"
            - pkg: github.com/jmorenobl/kitlegal/internal/app
              desc: "R1: el dominio no importa el kernel; es el kernel quien depende del dominio"
            - pkg: github.com/jmorenobl/kitlegal/internal/cache
              desc: "R1: el dominio no importa adaptadores; la caché se usa desde internal/source"
            - pkg: github.com/jmorenobl/kitlegal/internal/cli
              desc: "R1: el dominio no importa el kernel; es el kernel quien depende del dominio"
            - pkg: github.com/jmorenobl/kitlegal/internal/disco
              desc: "R1: el dominio no importa adaptadores; el disco llega por los puertos que define internal/core/instalacion"
            - pkg: github.com/jmorenobl/kitlegal/internal/graph
              desc: "R1: el dominio no importa adaptadores; el grafo se alimenta desde el applet, con GraphOp"
            - pkg: github.com/jmorenobl/kitlegal/internal/httpx
              desc: "R1: el dominio no importa adaptadores; la red vive en internal/httpx"
            - pkg: github.com/jmorenobl/kitlegal/internal/render
              desc: "R1: el dominio no presenta nada; la presentación se inyecta desde la raíz de composición"
            - pkg: github.com/jmorenobl/kitlegal/internal/source
              desc: "R1: el dominio no importa adaptadores; son las fuentes las que usan el dominio"
            - pkg: github.com/jmorenobl/kitlegal/internal/store
              desc: "R1: el dominio no importa adaptadores; el almacén se usa desde internal/source"
            - pkg: log
              desc: "R1: el dominio no registra eventos; el *slog.Logger llega como argumento al método Ejecutar"
            - pkg: log/slog
              desc: "R1: el dominio no registra eventos; el *slog.Logger llega como argumento al método Ejecutar, nunca dentro de schema.Contexto"
            - pkg: os
              desc: "R1: el dominio no hace entrada ni salida; lo que necesite del entorno se lo pasa quien lo llama"
            - pkg: io
              desc: "R1: el dominio no hace entrada ni salida; devuelve datos, no los escribe"
            - pkg: net/http
              desc: "R1: el dominio no hace entrada ni salida; la red vive en internal/httpx (R2)"
            - pkg: database/sql
              desc: "R1: el dominio no hace entrada ni salida; el almacenamiento vive en internal/{cache,store,graph} (R3)"

        # R2 · la biblioteca HTTP es de internal/httpx y de nadie más. Desde H2
        # la regla tiene dueño: ese paquete existe, es el único del árbol que
        # importa net/http y es donde viven el contexto obligatorio, la
        # identificación, robots.txt, el ritmo por sitio y los reintentos.
        # internal/arch_test.go comprueba lo mismo sobre el cierre transitivo
        # real y exige además que el dueño esté en el grafo y sea él quien
        # importa la biblioteca, de modo que la subprueba R2 no pueda volver a
        # pasar en vacío (H2 FR-053, research.md D18).
        red:
          list-mode: original
          files:
            - "**"
            - "!**/internal/httpx/**"
          deny:
            - pkg: net/http
              desc: "R2: la red se usa a través de internal/httpx, que concentra reintentos, límite por sitio, robots.txt y User-Agent identificable"

        # R3 · SQLite y database/sql son de los tres paquetes de almacenamiento y
        # de nadie más. Desde H3 la regla tiene dueño: internal/cache existe y es
        # el único paquete del árbol que importa database/sql y el controlador de
        # SQLite. internal/store e internal/graph llegan en H12 y H17 y ya figuran
        # entre las excepciones. internal/arch_test.go comprueba lo mismo sobre el
        # cierre transitivo real, aunque sin exigir dueño todavía: esa exigencia
        # pide los tres paquetes en el grafo (H3 FR-036, FR-037).
        sql:
          list-mode: original
          files:
            - "**"
            - "!**/internal/cache/**"
            - "!**/internal/store/**"
            - "!**/internal/graph/**"
          deny:
            - pkg: database/sql
              desc: "R3: el acceso a base de datos vive en internal/{cache,store,graph}; el resto del árbol los usa por su interfaz"
            - pkg: modernc.org/sqlite
              desc: "R3: el controlador de SQLite vive en internal/{cache,store,graph}; el resto del árbol los usa por su interfaz"

        # Los applets de ejemplo son la implementación de referencia, no
        # funcionalidad del binario distribuido. Viven en un paquete normal del
        # módulo —para que vet, lint, formato y cobertura los alcancen sin
        # enumerarlos— y esta lista es lo que impide enlazarlos por descuido:
        # solo su propio árbol (el binario de e2e incluido) y los tests pueden
        # importarlos. internal/arch_test.go comprueba lo mismo sobre el cierre
        # transitivo de cmd/kitlegal (docs/ADR/0010).
        ejemplo:
          list-mode: original
          files:
            - "**"
            - "!**/internal/app/ejemplo/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/jmorenobl/kitlegal/internal/app/ejemplo
              desc: "los applets de ejemplo no se enlazan en el binario distribuido; solo los importan su binario de e2e y los tests (ADR 0010)"

    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      # Sin exclusiones: la de H0 para fmt.Fprint, fmt.Fprintf y fmt.Fprintln
      # existía porque el punto de entrada escribía por su cuenta en los
      # descriptores. Desde H1 no queda ninguna escritura sin comprobar —el
      # presentador de internal/render es el único camino a la salida y propaga
      # el error de cada escritura—, así que mantenerla solo taparía el camino
      # que el contrato obliga a vigilar (FR-035, FR-040, FR-057, research.md D27).
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      # R4 y R5 son reglas de **símbolo**, no de importación: todo paquete
      # importa `os`, y lo prohibido es llamar a `os.Exit` o referenciar
      # `os.Stdout`. Un grafo de dependencias no lo ve, así que el lint es la
      # única capa que puede vigilarlas (FR-051, reglas-de-arquitectura.md §2).
      #
      # `analyze-types` es obligatorio: sin él el campo `pkg` de cada patrón se
      # ignora y el patrón casa por texto, de modo que `import o "os"` seguido de
      # `o.Exit(1)` lo esquivaría (forbidigo v2.3.1, patterns.go:23-26).
      analyze-types: true
      forbid:
        # R4. El mensaje de forbidigo incorpora este `msg`, así que el fallo
        # nombra la regla violada (FR-053) y las excepciones de más abajo pueden
        # acotarse a una marca concreta.
        - pattern: ^os\.Exit$
          pkg: ^os$
          msg: "R4: solo la raíz de composición de cada binario termina el proceso; todo lo demás devuelve un error o un código"
        # R5, primera mitad: sin excepción alguna en todo el árbol. Desaparece
        # así la acotación por ruta que H0 dejó como provisional mientras
        # internal/render no existía (FR-052).
        - pattern: ^fmt\.Print(|f|ln)$
          pkg: ^fmt$
          msg: "R5: la salida se emite por el escritor que recibe la función; solo internal/render escribe en la salida estándar"
        # R5, segunda mitad: los descriptores del sistema se nombran únicamente
        # donde se inyectan. Van con una marca propia para que exceptuarlos en
        # una raíz de composición no pueda desactivar de paso la prohibición de
        # fmt.Print*, que lleva la marca `R5:`.
        - pattern: ^os\.Stdout$
          pkg: ^os$
          msg: "R5-descriptores: os.Stdout solo se nombra en la raíz de composición, que lo inyecta; todo lo demás recibe un io.Writer"
        - pattern: ^os\.Stderr$
          pkg: ^os$
          msg: "R5-descriptores: os.Stderr solo se nombra en la raíz de composición, que lo inyecta; todo lo demás recibe un io.Writer"
    gocyclo:
      min-complexity: 13
    misspell:
      # El diccionario de misspell es solo inglés; el español se neutraliza
      # falso positivo a falso positivo en ignore-rules (research.md D9).
      locale: US
      ignore-rules:
        # «Procedimiento administrativo común», la búsqueda de la lista cerrada de
        # grabación cuya dirección fija byte a byte el contrato verbos-y-salidas §1
        # de H4 y que TestConsultaDeBusqueda, en
        # internal/source/boe/busqueda_test.go, copia tal cual con su consulta
        # titulo:administrativo (FR-030, research.md D8 y D18); misspell lo lee
        # como «administration».
        - administrativo
        # Plural español de «argumento»; misspell lo lee como «arguments».
        - argumentos
        # «Capitulo», el tipo que TipoDesdeID, en internal/source/boe/ids.go,
        # infiere de ids como ci1 o cv3, y valor del enumerado tipo de las
        # entradas del índice que fija el modelo de datos de H4 (FR-040,
        # research.md D9 y D18); misspell lo lee como «capitol».
        - capitulo
        # «Comando», el singular del formato de eval de H5: «comando esperado» y
        # «comando ausente» en los comentarios y en los motivos de Juzgar y del
        # informe (data-model §6.1 y §10.2 de H5, research.md D20); misspell lo
        # lee como «commando».
        - comando
        # «Comandos», la clave comandos del formato de eval de H5 (FR-060,
        # contrato de evals §1) en la etiqueta YAML del campo Comandos de Eval, y
        # las claves comandos_ejecutados y comandos_ausentes del informe (contrato
        # del job §5, research.md D20); misspell lo lee como «commandos».
        - comandos
        # Plural español de «control» —los controles mecánicos del hito, palabra
        # de todos los documentos del proyecto—; misspell lo lee como «controls».
        - controles
        # «Defectos de la skill», lo que Regenerar devuelve junto a las derivas y
        # lo que make skills-check presenta (data-model §5 de H5, contrato de
        # sincronización §2, research.md D20); misspell lo lee como «defects».
        - defectos
        # «Dependencias», las del contrato del applet boe de H4 —DependenciasDeBoe
        # y DependenciasDeRed— y las que Nueva, en internal/source/boe/fuente.go,
        # exige al componer la fuente: sus comentarios y sus mensajes nombran las
        # dependencias ausentes (FR-121, research.md D18); misspell lo lee como
        # «dependencies».
        - dependencias
        # «Descripcion» —Applet.Descripcion y Verbo.Descripcion—, el identificador que
        # fija el contrato del applet; misspell lo lee como «Description».
        - descripcion
        # «Disposicion», el tramo que comparten disposicion_adicional,
        # disposicion_transitoria, disposicion_derogatoria y disposicion_final,
        # los tipos que TipoDesdeID infiere de ids como da3 o dt1, y la clave
        # fecha_disposicion de los metadatos, que fija el modelo de datos de H4
        # (FR-040, FR-050, research.md D9 y D18); misspell lo lee como
        # «disposition».
        - disposicion
        # «Inventario de tests», la sección de plan.md que cada tabla cita;
        # misspell lo lee como «Inventor».
        - inventario
        # «Legislacion consolidada», el servicio del BOE cuyo nombre imita la ruta
        # larga de la tabla del contrato de grabación §2 de H2 que
        # TestNombreDeGrabacion copia tal cual; misspell lo lee como «legislation».
        - legislacion
        # «Real Decreto Legislativo», el rango que la expresión de
        # normas-nombradas tiene que casar tal cual en SKILL.md (contrato de
        # sincronización §2 de H5, research.md D20); misspell lo lee como
        # «legislation».
        - legislativo
        # «Materias», el verbo de refs/boe.py que la entrada 32 del porte anotado
        # en internal/source/boe/doc.go deja fuera de alcance, y la clave de data
        # del verbo analisis, que fija el modelo de datos de H4 (FR-120,
        # research.md D18); misspell lo lee como «materials».
        - materias
        # «Patrones», los pattern de NORMA y BLOQUE de schemas/normas.yaml.json y
        # schemas/eval.yaml.json, que TestGramaticasCoincidenConBoe compara con
        # boe.ValidarNorma y boe.ValidarBloque y que sus mensajes nombran
        # (data-model de H5, cabecera; control 10 del plan de H5; research.md
        # D20); misspell lo lee como «patrons».
        - patrones
        # «Expresiones regulares», el análisis de emergencia de _fallback_parse
        # que la entrada 7 del porte anotado en internal/source/boe/doc.go no porta
        # (H4 FR-120, research.md D18); misspell lo lee como «regulars».
        - regulares
        # «Reproduccion», el tramo del directorio de grabaciones que fija el
        # contrato de grabación de H2 (testdata/reproduccion/<fuente>) y que nombra
        # el subtest sin-cache-la-reproduccion-falla del inventario de tests de H3;
        # misspell lo lee como «reproduction».
        - reproduccion
        # «Resolucion de adjudicacion», parte de la otra ruta larga de la misma
        # tabla, la que se recorta; misspell lo lee como «resolution».
        - resolucion
        # «Variantes toleradas», el subtest aviso-con-variantes-toleradas de
        # TestJuzgar, en internal/evals/juzgar_test.go, cuyo nombre fijan el
        # inventario de tests del plan y la guía de validación de H5.1 (FR-035,
        # research.md D19); misspell lo lee como «variants».
        - variantes
        # Plural español de «versión» —las del esquema de la caché: la que el
        # fichero trae y la que el binario conoce, que el contrato de errores de
        # H3 §3 obliga a nombrar en el mensaje—; misspell lo lee como
        # «versions». El singular lleva tilde y no casa (H3 S2, D15).
        - versiones
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Las dos únicas excepciones del árbol, y las dos son raíces de
      # composición: el punto de entrada del binario distribuido y el `package
      # main` del binario de e2e. Un `package main` no puede propagar un código
      # de salida sin os.Exit —retornar de main sale siempre con 0— ni inyectar
      # descriptores sin nombrarlos (research.md D18, D19).
      #
      # Se escriben como `path` + `text` sobre la **marca** de la regla, nunca
      # sobre el linter entero: exceptuar os.Exit en una raíz de composición no
      # puede así desactivar por accidente la prohibición de fmt.Print*, que
      # lleva otra marca y no tiene excepción ninguna (FR-052).
      #
      # Ni el kernel (internal/cli, aunque docs/ROADMAP.md §2 se lo permitiría)
      # ni el paquete padre de applets de ejemplo (internal/app/ejemplo) entran
      # aquí: el plan elige la forma estricta —un único punto de salida por
      # binario— y el control vigila esa, no la permisiva.
      - linters:
          - forbidigo
        path: ^cmd/
        text: "R4:"
      - linters:
          - forbidigo
        path: ^cmd/
        text: "R5-descriptores:"
      - linters:
          - forbidigo
        path: ^internal/app/ejemplo/kitlegal-e2e/
        text: "R4:"
      - linters:
          - forbidigo
        path: ^internal/app/ejemplo/kitlegal-e2e/
        text: "R5-descriptores:"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
